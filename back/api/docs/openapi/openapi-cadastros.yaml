definitions:
  IdReference:
    type: object
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 2147483647
        format: int32
  CountResult:
    type: object
    properties:
      count:
        type: integer
        minimum: 0
        maximum: 2147483647
        format: int32
  ErrorResponse:
    type: object
    properties:
      code:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int32
        description: |
            Código do erro
      message:
        type: string
        description: |
            Mensagem resumida sobre o erro
      description:
        type: string
        description: |
            Detalhes para melhor entendimento do erro
  SumResult:
    type: object
    properties:
      sum:
        type: number
        minimum: 0.0
        maximum: 999999999999.99
        format: double
  cadastros.Municipio:
    description: |
            Município brasileiro identificado pelo código IBGE de 7 dígitos, exceto o 
            registro especial Exterior (UF EX), que não tem IBGE e carrega o código 0 da 
            tabela oficial; esse 0 nunca é enviado ao IntegraNotas (para pessoa no exterior 
            o envio manda uf = EX e omite o código do município). Dado de referência 
            compartilhado:
             endereço de Empresa aponta para ele, e a Pessoa o referencia por cidade e UF 
            (relação cidade): a tela mostra cidade e UF e esconde o IBGE, que está direto 
            aqui.
             O par (nome, UF) é único, regra documentada e não expressa no mapa. O Municipio 
            é buscado por nome e UF. Todo registro tem código: o IBGE de 7 dígitos ou, no 
            Exterior, o 0.
             Vive no contexto cadastros (domain.cadastros). Há dependência mútua entre os 
            contextos configuracao e cadastros:
             a Empresa (configuracao) referencia o Municipio, e Pessoa e Servico (cadastros) 
            referenciam a Empresa.
             Municipio e Empresa devem ser modelados juntos.

    type: object
    required:
      - codigoIbge
      - nome
      - uf
      - id
      - dataCriacao
      - dataAtualizacao
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      codigoIbge:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            Código do município no IBGE, 7 dígitos numéricos (inclui o dígito verificador), 
            exceto o registro especial Exterior (UF EX),
             que não tem IBGE e carrega o código 0 da tabela oficial. Esse 0 nunca é enviado 
            ao IntegraNotas (para pessoa no exterior o envio manda uf = EX e omite o código 
            do município).
             É único: não há dois municípios com o mesmo código. Guardado como texto para 
            preservar o formato.

      nome:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Nome oficial do município, como publicado pelo IBGE. O registro Exterior tem o 
            nome Exterior (o nome do IBGE vem vazio no arquivo; decisão provisória do 
            usuário, a confirmar).

      uf:
        type: string
        maxLength: 2
        pattern: \w*\W*
        description: |
            Sigla da unidade federativa do município, com 2 letras maiúsculas (ex: SP). 
            Valem as 27 UFs do Brasil mais EX (exterior).

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID). O código IBGE é a chave de negócio; 
            este campo é a chave técnica.

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o município foi cadastrado no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

  cadastros.Pessoa:
    description: |
            Cadastro de pessoa, física ou jurídica, que pode ser cliente, fornecedor ou 
            ambos (atributos cliente e fornecedor), reutilizável nas emissões, que na nota 
            assume o papel de tomador do serviço. É por empresa: o mesmo documento pode 
            existir
             uma vez em cada empresa, e uma empresa nunca enxerga a pessoa de outra.
             Tem um só documento (CNPJ ou CPF, um ou outro). Ao enviar a NFS-e, o sistema 
            separa o documento em cnpj ou cpf, que no IntegraNotas são campos distintos.
             A cidade é uma referência ao Municipio, que já traz a UF e o código IBGE: a tela 
            mostra cidade e UF e esconde o IBGE.
             Os contatos são uma lista (Contato), com vários por pessoa. Na exportação o 
            endereço não tem município brasileiro e usa os campos de exterior.
             Vive no contexto cadastros (domain.cadastros), que referencia a Empresa 
            (configuracao) e tem dependência mútua com ele, pois a Empresa referencia o 
            Municipio, que está em cadastros.

    type: object
    required:
      - tipoPessoa
      - nome
      - cliente
      - fornecedor
      - logradouro
      - numeroEndereco
      - bairro
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipoPessoa:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Física ou jurídica. Define como se lê o documento: jurídica tem CNPJ de 14 
            dígitos, física tem CPF de 11 dígitos. Obrigatório.

            Valores permitidos: 
              FISICA
                 Valor: FISICA
                 Texto: Pessoa física - Pessoa física, identificada pelo CPF de 11 dígitos.
              JURIDICA
                 Valor: JURIDICA
                 Texto: Pessoa jurídica - Pessoa jurídica, identificada pelo CNPJ de 14 dígitos.
        enum:
          - FISICA
          - JURIDICA
      documento:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Documento da pessoa, só dígitos, sem formatação: 14 dígitos é CNPJ (pessoa 
            jurídica) e 11 dígitos é CPF (pessoa física), coerente com o tipo de pessoa.
             É um ou outro, nunca os dois. Ao enviar a NFS-e vai como cnpj ou cpf conforme o 
            tamanho. CPF é dado pessoal, sujeito a mascaramento nas respostas. Único dentro 
            da empresa.

      nome:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome da pessoa física ou razão social da pessoa jurídica (vai no campo 
            razao_social do envio). Obrigatório.

      nomeFantasia:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome fantasia da pessoa jurídica. Opcional. O nome nomeFantasia é o que já 
            consta na lista de busca do projeto (nondeterministicSearchField), por isso o 
            campo é pesquisável.

      inscricaoMunicipal:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Inscrição municipal da pessoa (campo im do envio). Opcional.

      rgInscricaoEstadual:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Um só campo: RG quando a pessoa é física, inscrição estadual quando é jurídica. 
            Opcional.
             Regra de aplicação: pessoa jurídica com inscrição estadual preenchida marca 
            consumidorFinal como não.

      tipoDestinatario:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Indica quem é o destinatário (campo tipo_destinatario do envio, indDest), 
            valores 0 ou 1. Opcional, padrão 0.

            Valores permitidos: 
              PROPRIO_TOMADOR
                 Valor: 0
                 Texto: Próprio tomador - O destinatário é o próprio tomador/adquirente (padrão). Código gravado: 0.
              OUTRO_DESTINATARIO
                 Valor: 1
                 Texto: Outro destinatário - O destinatário não é o próprio adquirente (outra pessoa ou outro estabelecimento). Código gravado: 1.
      consumidorFinal:
        type: boolean
        description: |
            Indica se a pessoa é consumidora final, sim ou não. Padrão sim (true), que é o 
            da pessoa física.
             Regra de aplicação, não do mapa: pessoa jurídica com inscrição estadual 
            preenchida passa a não.

      cliente:
        type: boolean
        description: |
            Indica se a pessoa é cliente da empresa (toma serviços; aparece no menu Clientes 
            e é a que a NFS-e usa como tomador). Padrão não (false). Uma mesma pessoa pode 
            ser cliente e fornecedor ao mesmo tempo.

      fornecedor:
        type: boolean
        description: |
            Indica se a pessoa é fornecedora da empresa (presta serviços ou vende à empresa; 
            aparece no menu Fornecedores). Padrão não (false). Uma mesma pessoa pode ser 
            cliente e fornecedor ao mesmo tempo.

      telefone:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Telefone principal da pessoa, só números. Opcional. Outros contatos ficam na 
            lista de contatos.

      email:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            E-mail principal da pessoa, até 60 caracteres. Opcional. Outros contatos ficam 
            na lista de contatos.

      logradouro:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            Rua, avenida ou similar do endereço da pessoa. Obrigatório.

      numeroEndereco:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Número do imóvel, texto porque aceita S/N (campo numero do endereço do envio). 
            Obrigatório.

      complemento:
        type: string
        maxLength: 256
        pattern: \w*\W*
        description: |
            Complemento do endereço. Opcional.

      bairro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Bairro do endereço. Obrigatório.

      cep:
        type: string
        maxLength: 8
        pattern: \w*\W*
        description: |
            CEP de 8 dígitos sem hífen, texto para preservar zeros à esquerda. Opcional. A 
            consulta de CEP (BrasilAPI) preenche o endereço e a cidade.

      codigoPais:
        type: string
        maxLength: 4
        pattern: \w*\W*
        description: |
            Código do país do endereço no exterior, de 3 a 4 dígitos (campo codigo_pais do 
            envio). Só na exportação. Quando preenchido e sem cidade,
             o endereço é de exportação e a UF enviada ao gateway é EX, derivada pelo sistema 
            na montagem do envio, sem atributo uf.

      codigoPostal:
        type: string
        maxLength: 11
        pattern: \w*\W*
        description: |
            Código postal do endereço no exterior (campo codigo_postal do envio). Opcional.

      nomeMunicipioExterior:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Nome da cidade no exterior (campo nome_municipio do envio). Opcional.

      nomeProvincia:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Nome da província ou estado no exterior (campo nome_provincia do envio). 
            Opcional.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da pessoa (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a pessoa foi cadastrada.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa dona desta pessoa e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
      cidade:
        description: |
            Cidade do endereço, referência ao Municipio, que traz nome, UF e código IBGE 
            (campos codigo_municipio e uf do envio).
             A tela mostra cidade e UF e esconde o IBGE, que é obtido do Municipio buscado 
            por nome e UF. Não há atributos uf nem IBGE na pessoa.
             Opcional apenas porque na exportação o endereço não tem município brasileiro. 
            Para pessoa estrangeira a cidade é o registro Exterior (UF EX), junto dos campos 
            de exportação.

        allOf:
          - $ref: '#/definitions/IdReference'
      contatos:
        type: array
        items:
          $ref: '#/definitions/cadastros.Contato'
        description: |
            Lista de contatos da pessoa, com vários itens. Só existem dentro da pessoa, no 
            mesmo contexto. Os sócios do QSA da consulta de CNPJ entram aqui.

  cadastros.Servico:
    description: |
            Cadastro de serviço prestado, próprio de cada empresa e reutilizável na emissão. 
            Guarda o enquadramento fiscal padrão
             (código da LC 116, ISS e PIS/COFINS) e valores padrão que a nota pode 
            sobrescrever.
             Vive no contexto cadastros (domain.cadastros), que referencia a Empresa 
            (configuracao) e tem dependência mútua com ele, pois a Empresa referencia o 
            Municipio, que está em cadastros.
             Os padrões tributários (ISS, PIS/COFINS, retenções) são só sugestão para a nota 
            e todos opcionais. Nenhum agente de IA informa tributo: esses campos só se 
            preenchem pela tela. Dinheiro em ValorMonetario(15,2) e alíquotas em 
            Decimal(5,2); deduções, previdência, CNAE, inscrição estadual e tipo de ente não 
            existem aqui. As validações de coerência estão nas description dos atributos e 
            são implementadas à mão.

    type: object
    required:
      - nome
      - ativo
      - codigoServico
      - issRetido
      - tipoOperacaoIss
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Nome interno para reconhecer o serviço em telas e listas. Não vai no envio ao 
            gateway.

      codigoInterno:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Código do serviço no sistema da empresa, até 20 caracteres (campo codigo_interno 
            do envio). Opcional.

      ativo:
        type: boolean
        description: |
            Indica se o serviço pode ser escolhido em novas emissões. Serviço desativado 
            some das listas, mas permanece
             nas notas já emitidas, que guardam o que foi enviado.

      codigoServico:
        type: string
        maxLength: 6
        pattern: \w*\W*
        description: |
            Código do serviço da LC 116/2003, exatamente 6 dígitos (campo servico.codigo do 
            envio). Obrigatório.
             Texto para preservar zeros à esquerda.

      codigoTributacaoMunicipio:
        type: string
        maxLength: 3
        pattern: \w*\W*
        description: |
            Código de tributação do município, exatamente 3 dígitos (campo 
            codigo_tributacao_municipio do envio). Opcional:
             só se a prefeitura tiver código próprio; se não tiver, fica em branco. "000" é 
            recusado (o governo devolve E0315).

      codigoNbs:
        type: string
        maxLength: 9
        pattern: \w*\W*
        description: |
            Nomenclatura Brasileira de Serviços, 9 dígitos (campo codigo_nbs do envio). 
            Opcional.

      descricaoCurta:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            Descrição de até 200 caracteres (campo descricao do envio), usada só no PDF. 
            Opcional.

      discriminacaoPadrao:
        type: string
        maxLength: 2000
        pattern: \w*\W*
        description: |
            Texto padrão da discriminação do serviço, até 2000 caracteres (campo 
            discriminacao do envio, obrigatório na nota).
             Quebra de linha só com \n. Opcional no cadastro, a nota pode informar a sua.

      valorPadrao:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor sugerido do serviço (valor_servicos do envio, mínimo 0.01 na nota). 
            Opcional, a nota pode alterar.

      aliquotaIss:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Alíquota do ISS em pontos percentuais, de 0 a 100 (5.00 significa 5%). Campo 
            aliquota_iss do envio. Opcional.
             Coerência (validar à mão ao salvar): com ISS retido ligado ou com base de 
            cálculo informada, a alíquota é obrigatória. Nunca é deduzida pelo sistema.

      issRetido:
        type: boolean
        description: |
            Indica se o ISS é retido pelo tomador (campo iss_retido do envio). Padrão não. 
            Com ISS retido ligado, a alíquota do ISS é obrigatória no serviço (validar à 
            mão).

      tipoOperacaoIss:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Tipo da operação para o ISS. NÃO vai mais no envio v2: o campo 
            tributos_municipais.tipo_operacao não existe no schema de 2026-11-24.
             O atributo é mantido no cadastro, sem efeito no envio. Padrão 1, tributável.

            Valores permitidos: 
              TRIBUTAVEL
                 Valor: 1
                 Texto: Tributável - Operação tributável pelo ISS (padrão). Código gravado: 1.
              IMUNIDADE
                 Valor: 2
                 Texto: Imunidade - Operação com imunidade do ISS. Código gravado: 2.
              EXPORTACAO
                 Valor: 3
                 Texto: Exportação - Exportação de serviço. Código gravado: 3.
              NAO_INCIDENCIA
                 Valor: 4
                 Texto: Não incidência - Operação em que o ISS não incide. Código gravado: 4.
      cstPisCofins:
        type: string
        maxLength: 2
        pattern: \w*\W*
        description: |
            CST do PIS/COFINS, 2 dígitos (campo tributos_nacionais.cst do envio, obrigatório 
            na nota quando o grupo federal vai). Texto, com zero à esquerda,
             de lista fechada com os 33 códigos do schema do IntegraNotas (valores em [e] 
            values; o código gravado é o filho codigo). Opcional no cadastro, a nota informa 
            se faltar.
             O sistema nunca escolhe o CST. Coerência (validar à mão ao salvar): com tipo de 
            retenção ou alíquota de PIS/COFINS informados, o CST é obrigatório.

            Valores permitidos: 
              ALIQUOTA_NORMAL
                 Valor: 01
                 Texto: Alíquota normal - Operação tributável: base de cálculo = valor da operação (alíquota normal, cumulativo ou não cumulativo). Código gravado: 01.
              ALIQUOTA_DIFERENCIADA
                 Valor: 02
                 Texto: Alíquota diferenciada - Operação tributável: base de cálculo = valor da operação (alíquota diferenciada). Código gravado: 02.
              ALIQUOTA_POR_UNIDADE
                 Valor: 03
                 Texto: Alíquota por unidade - Operação tributável: base de cálculo = quantidade vendida × alíquota por unidade de produto. Código gravado: 03.
              MONOFASICA_ALIQUOTA_ZERO
                 Valor: 04
                 Texto: Monofásica (alíquota zero) - Operação tributável: tributação monofásica (alíquota zero). Código gravado: 04.
              SUBSTITUICAO_TRIBUTARIA
                 Valor: 05
                 Texto: Substituição tributária - Operação tributável: substituição tributária. Código gravado: 05.
              ALIQUOTA_ZERO
                 Valor: 06
                 Texto: Alíquota zero - Operação tributável: alíquota zero. Código gravado: 06.
              ISENTA
                 Valor: 07
                 Texto: Isenta da contribuição - Operação isenta da contribuição. Código gravado: 07.
              SEM_INCIDENCIA
                 Valor: 08
                 Texto: Sem incidência - Operação sem incidência da contribuição. Código gravado: 08.
              COM_SUSPENSAO
                 Valor: 09
                 Texto: Com suspensão - Operação com suspensão da contribuição. Código gravado: 09.
              OUTRAS_SAIDAS
                 Valor: 49
                 Texto: Outras operações de saída - Outras operações de saída. Código gravado: 49.
              CREDITO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 50
                 Texto: Crédito: tributada no mercado interno - Operação com direito a crédito: vinculada exclusivamente a receita tributada no mercado interno. Código gravado: 50.
              CREDITO_NAO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 51
                 Texto: Crédito: não tributada no mercado interno - Operação com direito a crédito: vinculada exclusivamente a receita não tributada no mercado interno. Código gravado: 51.
              CREDITO_EXPORTACAO
                 Valor: 52
                 Texto: Crédito: exportação - Operação com direito a crédito: vinculada exclusivamente a receita de exportação. Código gravado: 52.
              CREDITO_TRIBUTADA_E_NAO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 53
                 Texto: Crédito: tributada e não tributada no mercado interno - Operação com direito a crédito: vinculada a receitas tributadas e não tributadas no mercado interno. Código gravado: 53.
              CREDITO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 54
                 Texto: Crédito: tributada no mercado interno e exportação - Operação com direito a crédito: vinculada a receitas tributadas no mercado interno e de exportação. Código gravado: 54.
              CREDITO_NAO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 55
                 Texto: Crédito: não tributada no mercado interno e exportação - Operação com direito a crédito: vinculada a receitas não tributadas no mercado interno e de exportação. Código gravado: 55.
              CREDITO_TRIBUTADA_E_NAO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 56
                 Texto: Crédito: tributada e não tributada no mercado interno e exportação - Operação com direito a crédito: vinculada a receitas tributadas e não tributadas no mercado interno e de exportação. Código gravado: 56.
              CREDITO_PRESUMIDO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 60
                 Texto: Crédito presumido: tributada no mercado interno - Crédito presumido: operação de aquisição vinculada exclusivamente a receita tributada no mercado interno. Código gravado: 60.
              CREDITO_PRESUMIDO_NAO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 61
                 Texto: Crédito presumido: não tributada no mercado interno - Crédito presumido: operação de aquisição vinculada exclusivamente a receita não tributada no mercado interno. Código gravado: 61.
              CREDITO_PRESUMIDO_EXPORTACAO
                 Valor: 62
                 Texto: Crédito presumido: exportação - Crédito presumido: operação de aquisição vinculada exclusivamente a receita de exportação. Código gravado: 62.
              CREDITO_PRESUMIDO_TRIBUTADA_E_NAO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 63
                 Texto: Crédito presumido: tributada e não tributada no mercado interno - Crédito presumido: operação de aquisição vinculada a receitas tributadas e não tributadas no mercado interno. Código gravado: 63.
              CREDITO_PRESUMIDO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 64
                 Texto: Crédito presumido: tributada no mercado interno e exportação - Crédito presumido: operação de aquisição vinculada a receitas tributadas no mercado interno e de exportação. Código gravado: 64.
              CREDITO_PRESUMIDO_NAO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 65
                 Texto: Crédito presumido: não tributada no mercado interno e exportação - Crédito presumido: operação de aquisição vinculada a receitas não tributadas no mercado interno e de exportação. Código gravado: 65.
              CREDITO_PRESUMIDO_TRIBUTADA_E_NAO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 66
                 Texto: Crédito presumido: tributada e não tributada no mercado interno e exportação - Crédito presumido: operação de aquisição vinculada a receitas tributadas e não tributadas no mercado interno e de exportação. Código gravado: 66.
              CREDITO_PRESUMIDO_OUTRAS_OPERACOES
                 Valor: 67
                 Texto: Crédito presumido: outras operações - Crédito presumido: outras operações. Código gravado: 67.
              AQUISICAO_SEM_CREDITO
                 Valor: 70
                 Texto: Aquisição sem direito a crédito - Operação de aquisição sem direito a crédito. Código gravado: 70.
              AQUISICAO_ISENTA
                 Valor: 71
                 Texto: Aquisição com isenção - Operação de aquisição com isenção. Código gravado: 71.
              AQUISICAO_COM_SUSPENSAO
                 Valor: 72
                 Texto: Aquisição com suspensão - Operação de aquisição com suspensão. Código gravado: 72.
              AQUISICAO_ALIQUOTA_ZERO
                 Valor: 73
                 Texto: Aquisição a alíquota zero - Operação de aquisição a alíquota zero. Código gravado: 73.
              AQUISICAO_SEM_INCIDENCIA
                 Valor: 74
                 Texto: Aquisição sem incidência - Operação de aquisição sem incidência da contribuição. Código gravado: 74.
              AQUISICAO_SUBSTITUICAO_TRIBUTARIA
                 Valor: 75
                 Texto: Aquisição por substituição tributária - Operação de aquisição por substituição tributária. Código gravado: 75.
              OUTRAS_ENTRADAS
                 Valor: 98
                 Texto: Outras operações de entrada - Outras operações de entrada. Código gravado: 98.
              OUTRAS_OPERACOES
                 Valor: 99
                 Texto: Outras operações - Outras operações. Código gravado: 99.
        enum:
          - '01'
          - '02'
          - '03'
          - '04'
          - '05'
          - '06'
          - '07'
          - '08'
          - '09'
          - '49'
          - '50'
          - '51'
          - '52'
          - '53'
          - '54'
          - '55'
          - '56'
          - '60'
          - '61'
          - '62'
          - '63'
          - '64'
          - '65'
          - '66'
          - '67'
          - '70'
          - '71'
          - '72'
          - '73'
          - '74'
          - '75'
          - '98'
          - '99'
      tipoRetencao:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Tipo de retenção do PIS, da COFINS e da CSLL, de 0 a 9 (campo 
            tributos_nacionais.tipo_retencao do envio). Opcional.
             No JSON vai como texto ("2"), não como número; em branco, o gateway assume 2 
            (PIS/COFINS não retidos). O código gravado é o número.
             Coerência (validar à mão ao salvar): informado o tipo de retenção, o CST do 
            PIS/COFINS é obrigatório.

            Valores permitidos: 
              NENHUM_RETIDO
                 Valor: 0
                 Texto: PIS/COFINS/CSLL não retidos - PIS, COFINS e CSLL não retidos. Código gravado: 0.
              PIS_COFINS_RETIDOS
                 Valor: 1
                 Texto: PIS/COFINS retido - PIS e COFINS retidos. Código gravado: 1.
              PIS_COFINS_NAO_RETIDOS
                 Valor: 2
                 Texto: PIS/COFINS não retido - PIS e COFINS não retidos. É o que o gateway assume quando o campo vem em branco. Código gravado: 2.
              PIS_COFINS_CSLL_RETIDOS
                 Valor: 3
                 Texto: PIS/COFINS/CSLL retidos - PIS, COFINS e CSLL retidos. Código gravado: 3.
              PIS_COFINS_RETIDOS_CSLL_NAO_RETIDA
                 Valor: 4
                 Texto: PIS/COFINS retidos, CSLL não retido - PIS e COFINS retidos, CSLL não retida. Código gravado: 4.
              PIS_RETIDO
                 Valor: 5
                 Texto: PIS retido, COFINS/CSLL não retidos - PIS retido, COFINS e CSLL não retidos. Código gravado: 5.
              COFINS_RETIDO
                 Valor: 6
                 Texto: COFINS retido, PIS/CSLL não retidos - COFINS retido, PIS e CSLL não retidos. Código gravado: 6.
              COFINS_CSLL_RETIDOS
                 Valor: 7
                 Texto: PIS não retido, COFINS/CSLL retidos - PIS não retido, COFINS e CSLL retidos. Código gravado: 7.
              CSLL_RETIDO
                 Valor: 8
                 Texto: PIS/COFINS não retidos, CSLL retido - PIS e COFINS não retidos, CSLL retida. Código gravado: 8.
              PIS_CSLL_RETIDOS
                 Valor: 9
                 Texto: COFINS não retido, PIS/CSLL retidos - COFINS não retido, PIS e CSLL retidos. Código gravado: 9.
      aliquotaPis:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Alíquota do PIS em pontos percentuais (5.00 significa 5%; campo 
            tributos_nacionais.aliquota_pis do envio). Opcional.
             Informada, exige o CST do PIS/COFINS (validar à mão ao salvar).

      aliquotaCofins:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Alíquota da COFINS em pontos percentuais (5.00 significa 5%; campo 
            tributos_nacionais.aliquota_cofins do envio). Opcional.
             Informada, exige o CST do PIS/COFINS (validar à mão ao salvar).

      percentualTributosSimples:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Percentual aproximado de tributos do Simples Nacional (Lei 12.741/2012), em 
            pontos percentuais (13.75 significa 13,75%). Opcional. Vai nos tributos totais 
            da nota; o nome exato do campo no envio v2 precisa ser confirmado em 
            homologação.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do serviço (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o serviço foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa dona deste serviço e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  cadastros.Contato:
    description: |
            Contato de uma Pessoa, com tipo, nome, WhatsApp e e-mail. Uma pessoa tem vários. 
            Existe só dentro da pessoa e no mesmo contexto, por isso é detalhe da Pessoa 
            ([m]/[o]).
             Os sócios do QSA da consulta de CNPJ entram como contatos do tipo sócio. O 
            e-mail e o telefone principais ficam na própria Pessoa.
             Vive no contexto cadastros (domain.cadastros) e referencia a Empresa 
            (configuracao) como tenant.

    type: object
    required:
      - tipoContato
      - nome
      - id
      - dataCriacao
      - dataAtualizacao
      - pessoa
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipoContato:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Papel do contato perante a pessoa. Os valores são os de [e] values: SOCIO, 
            FINANCEIRO, COMERCIAL, FISCAL e OUTRO. Só SOCIO decorre da história do usuário 
            (sócios do QSA entram como contatos); os demais foram propostos pelo modelador 
            (a confirmar). Obrigatório.

            Valores permitidos: 
              SOCIO
                 Valor: SOCIO
                 Texto: Sócio - Sócio ou administrador da pessoa jurídica, vindo do quadro de sócios e administradores (QSA) da consulta de CNPJ. É o tipo com que os sócios do QSA entram como contatos; o usuário pode ajustá-los antes de salvar.
              FINANCEIRO
                 Valor: FINANCEIRO
                 Texto: Financeiro - Pessoa de contato da área financeira da pessoa cadastrada (cobrança, pagamento, boletos).
              COMERCIAL
                 Valor: COMERCIAL
                 Texto: Comercial - Pessoa de contato da área comercial da pessoa cadastrada (negociação, propostas, relacionamento).
              FISCAL
                 Valor: FISCAL
                 Texto: Fiscal ou contábil - Pessoa de contato fiscal ou contábil (contador ou responsável por impostos e notas) da pessoa cadastrada.
              OUTRO
                 Valor: OUTRO
                 Texto: Outro - Qualquer contato que não se enquadre nos demais tipos.
        enum:
          - SOCIO
          - FINANCEIRO
          - COMERCIAL
          - FISCAL
          - OUTRO
      nome:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome da pessoa de contato. Acréscimo do modelador, não listado pelo usuário: os 
            sócios do QSA entram como contatos e um contato sem nome não se identifica. 
            Obrigatório.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Número de WhatsApp do contato, só números. Opcional.

      email:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            E-mail do contato, até 60 caracteres. Opcional.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do contato (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o contato foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      pessoa:
        description: |
            Pessoa a quem o contato pertence. Apagar a pessoa apaga seus contatos.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona deste contato e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  cadastros.ImportacaoMunicipio:
    description: |
            Histórico dos envios do arquivo de cidades (CSV do IBGE) feitos pelo 
            administrador da plataforma. É o rastro de quem alterou a tabela de municípios e 
            quando, e guarda o relatório de cada importação (totais e resumo das linhas 
            rejeitadas). Regra da importação, detalhada em docs/carga-municipios.md: 
            atualiza ou insere pelo código IBGE e nunca apaga cidades, pois Pessoa e Empresa 
            as referenciam; linhas inválidas são rejeitadas e relatadas, sem adivinhar.
             Registro da plataforma, não de uma empresa: não tem empresa, não tem tenantKey e 
            não tem ambiente (não depende do gateway). Só o administrador da plataforma 
            envia; essa regra é da aplicação e o mapa não a expressa.
             Vive no contexto cadastros (domain.cadastros). O usuário que fez a importação é 
            guardado só como id (idUsuario, referência de auditoria, CN-REL-002), sem 
            relação com o Usuario do contexto usuarios; assim cadastros não depende de 
            usuarios.

    type: object
    required:
      - nomeArquivo
      - estado
      - dataHoraInicio
      - linhasLidas
      - linhasInseridas
      - linhasAtualizadas
      - linhasIguais
      - linhasRejeitadas
      - id
      - dataCriacao
      - dataAtualizacao
      - idUsuario
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nomeArquivo:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            Nome do arquivo enviado pelo administrador.

      codificacaoDetectada:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Codificação que a importação detectou no arquivo, UTF-8 ou Windows-1252. Útil 
            para depurar. Vazia se a importação falhou antes de ler o arquivo.

      separadorDetectado:
        type: string
        maxLength: 5
        pattern: \w*\W*
        description: |
            Separador de colunas que a importação detectou no arquivo (ponto e vírgula, 
            vírgula ou tabulação). Útil para depurar. Vazio se a importação falhou antes de 
            ler o arquivo.

      estado:
        type: string
        maxLength: 23
        pattern: \w*\W*
        description: |
            Estado da importação. Ciclo: nasce em EM_ANDAMENTO; termina em CONCLUIDA 
            (nenhuma linha rejeitada), CONCLUIDA_COM_REJEICOES (terminou, mas ao menos uma 
            linha foi rejeitada) ou FALHOU (não conseguiu processar o arquivo). Os três 
            últimos são finais e preenchem dataHoraFim.

            Valores permitidos: 
              EM_ANDAMENTO
                 Valor: EM_ANDAMENTO
                 Texto: Em andamento - Estado inicial e padrão: a importação foi iniciada e ainda não terminou. Enquanto estiver neste estado, dataHoraFim fica vazia.
              CONCLUIDA
                 Valor: CONCLUIDA
                 Texto: Concluída - Estado final: a importação terminou e nenhuma linha foi rejeitada. Preenche dataHoraFim.
              CONCLUIDA_COM_REJEICOES
                 Valor: CONCLUIDA_COM_REJEICOES
                 Texto: Concluída com rejeições - Estado final: a importação terminou, mas ao menos uma linha foi rejeitada (relatadas em resumoRejeicoes). Preenche dataHoraFim.
              FALHOU
                 Valor: FALHOU
                 Texto: Falhou - Estado final: o arquivo não pôde ser processado. Preenche dataHoraFim.
        enum:
          - EM_ANDAMENTO
          - CONCLUIDA
          - CONCLUIDA_COM_REJEICOES
          - FALHOU
      dataHoraInicio:
        type: string
        format: date-time
        description: |
            Data e hora em que a importação começou.

      dataHoraFim:
        type: string
        format: date-time
        description: |
            Data e hora em que a importação terminou, com sucesso ou falha. Vazia enquanto 
            EM_ANDAMENTO.

      linhasLidas:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Total de linhas de dados lidas do arquivo (sem o cabeçalho). Deve ser igual à 
            soma de inseridas, atualizadas, iguais e rejeitadas.

      linhasInseridas:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Quantidade de cidades novas, cujo código IBGE ainda não existia na tabela.

      linhasAtualizadas:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Quantidade de cidades existentes cujo nome ou UF mudou.

      linhasIguais:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Quantidade de cidades existentes que já estavam idênticas ao arquivo, sem 
            alteração.

      linhasRejeitadas:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Quantidade de linhas rejeitadas (código fora do padrão, UF inválida, nome vazio 
            ou código repetido no arquivo).

      resumoRejeicoes:
        type: string
        maxLength: 4000
        pattern: \w*\W*
        description: |
            Resumo em texto das linhas rejeitadas, com o número da linha e o motivo de cada 
            uma. O detalhe completo pode ser truncado para caber no limite; os totais ficam 
            sempre exatos em linhasRejeitadas.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da importação (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi criado no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      idUsuario:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do usuário (administrador da plataforma) que fez a importação, guardado só 
            como referência de auditoria, sem carregar o objeto Usuario. Só o administrador 
            da plataforma envia; a regra é da aplicação e o mapa não a expressa.

  configuracao.Empresa:
    description: |
            Empresa usuária do sistema e tenant do modelo. Cada empresa só emite e só 
            enxerga as próprias notas.
             NUNCA é apagada, só DESATIVADA (situacao = DESATIVADA): a aplicação não deve 
            expor a remoção. Nasce no signup com o documento, o e-mail e o WhatsApp 
            informados, em situacao PENDENTE_CONFIRMACAO, e fica ATIVA quando o usuário 
            clica no link do e-mail (ConfirmacaoCadastro).
             É identificada por um documento único (CNPJ ou CPF). Tem atividades 
            (AtividadeEmpresa) e quadro de sócios (QsaEmpresa) como detalhes ([m]/[o]).
             Regra de edição, da aplicação: o usuário da empresa só altera razaoSocial, 
            nomeFantasia e o endereço; o resto é alterável só pelo administrador da 
            plataforma ou suporte. É cadastrada no gateway IntegraNotas, onde se chama 
            "emitente", e o gateway devolve o token do emitente,
             separado por ambiente. Token, credenciais da prefeitura e certificado ficam no 
            cofre, aqui só há referência.
             Vive no contexto configuracao (domain.configuracao), sozinha. Há dependência 
            mútua com o contexto cadastros: a Empresa referencia o Municipio (cadastros), e 
            Pessoa e Servico (cadastros) referenciam a Empresa. Empresa e Municipio devem 
            ser modelados juntos.

    type: object
    required:
      - nomeFantasia
      - razaoSocial
      - documento
      - email
      - whatsapp
      - telefone
      - logradouro
      - numeroEndereco
      - bairro
      - cep
      - regimeTributario
      - situacao
      - nfseHabilitada
      - ultimoNumeroNfse
      - statusCadastro
      - situacaoCertificado
      - id
      - ambiente
      - dataCriacao
      - dataAtualizacao
      - municipio
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nomeFantasia:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Nome fantasia da empresa, de 2 a 60 caracteres (campo nome do cadastro no 
            gateway). Alterável pelo usuário da empresa.

      razaoSocial:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Razão social da empresa, de 2 a 60 caracteres (campo razao do cadastro no 
            gateway). Alterável pelo usuário da empresa.

      documento:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Documento da empresa, só dígitos, sem formatação: 14 dígitos é CNPJ e 11 dígitos 
            é CPF. É um ou outro, nunca os dois.
             No cadastro no gateway e no envio ao IntegraNotas o sistema o separa em cnpj ou 
            cpf conforme o tamanho. CPF é dado pessoal, sujeito a mascaramento nas 
            respostas. Obrigatório.
             Único por ambiente (o mesmo documento tem um registro por ambiente). Alterável 
            só pelo administrador da plataforma ou suporte.

      rgInscricaoEstadual:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Inscrição estadual da empresa, até 20 caracteres. Mesmo nome do campo da Pessoa. 
            Opcional. Alterável só pelo administrador da plataforma ou suporte.

      inscricaoMunicipal:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Inscrição municipal da empresa, de 1 a 20 caracteres (campo im do gateway). 
            Opcional. Alterável só pelo administrador da plataforma ou suporte.

      email:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            E-mail da empresa, até 60 caracteres. Obrigatório: várias integrações exigem 
            (IntegraNotas, bancos para boleto e PIX). É o e-mail informado no signup. 
            Alterável só pelo administrador da plataforma ou suporte.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            WhatsApp da empresa, até 20 caracteres. Obrigatório: necessário em cadastros de 
            integração como IntegraNotas e bancos para boleto e PIX. É o WhatsApp informado 
            no signup. Alterável só pelo administrador da plataforma ou suporte.

      telefone:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Telefone da empresa, de 6 a 14 dígitos, só números. Alterável só pelo 
            administrador da plataforma ou suporte.

      logradouro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Rua, avenida ou similar do endereço da empresa, de 1 a 60 caracteres (campo rua 
            do gateway). Alterável pelo usuário da empresa.

      numeroEndereco:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Número do imóvel, de 1 a 60 caracteres, texto porque aceita S/N (campo numero do 
            gateway). Alterável pelo usuário da empresa.

      complemento:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Complemento do endereço, até 60 caracteres. Opcional. Alterável pelo usuário da 
            empresa.

      bairro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Bairro do endereço, de 2 a 60 caracteres. Alterável pelo usuário da empresa.

      cep:
        type: string
        maxLength: 8
        pattern: \w*\W*
        description: |
            CEP do endereço, exatamente 8 dígitos sem hífen. Guardado como texto para 
            preservar zeros à esquerda. Alterável pelo usuário da empresa.

      regimeTributario:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime tributário da empresa (campo crt do gateway). Define o enquadramento 
            usado na emissão. Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              SIMPLES_NACIONAL
                 Valor: 1
                 Texto: Simples Nacional - Empresa optante pelo Simples Nacional. Código gravado e enviado ao gateway (crt): 1.
              SIMPLES_EXCESSO_SUBLIMITE
                 Valor: 2
                 Texto: Simples Nacional com excesso de sublimite - Simples Nacional com excesso de sublimite de receita. Código gravado e enviado ao gateway (crt): 2.
              REGIME_NORMAL
                 Valor: 3
                 Texto: Regime Normal - Empresa no regime normal (lucro presumido ou real). Código gravado e enviado ao gateway (crt): 3.
              MEI
                 Valor: 4
                 Texto: MEI - Microempreendedor Individual. Código gravado e enviado ao gateway (crt): 4.
      regimeIbsCbs:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime de apuração do IBS e da CBS da empresa (campo regime_cibs do gateway), de 
            0 a 4. Opcional por decisão do usuário.
             O valor 0 significa não informado e a tag não é enviada. Alterável só pelo 
            administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_INFORMADO
                 Valor: 0
                 Texto: Não informado - Não informado, padrão: a tag regime_cibs não é enviada. Código gravado: 0.
              SIMPLES_OPCAO_REGIME_REGULAR
                 Valor: 1
                 Texto: Simples Nacional com opção pelo regime regular - Simples Nacional com opção pelo regime regular do IBS e da CBS (crt 1 ou 2). Código gravado e enviado ao gateway: 1.
              NORMAL_OPCAO_SIMPLES_PENDENTE_SEM_REGULAR
                 Valor: 2
                 Texto: Regime Normal, opção pelo Simples pendente, sem regime regular - Regime Normal com opção pendente pelo Simples Nacional, sem regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 2.
              NORMAL_SUBLIMITE_PENDENTE_SEM_REGULAR
                 Valor: 3
                 Texto: Regime Normal, excesso de sublimite pendente, sem regime regular - Regime Normal com opção pendente pelo Simples Nacional com excesso de sublimite, sem regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 3.
              NORMAL_OPCAO_SIMPLES_PENDENTE_COM_REGULAR
                 Valor: 4
                 Texto: Regime Normal, opção pelo Simples pendente, com regime regular - Regime Normal com opção pendente pelo Simples Nacional, com regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 4.
      logo:
        type: string
        format: byte
        description: |
            Logotipo da empresa, imagem JPG ou PNG proporcional (como 100x100) de até 1 MB. 
            Opcional, enviado ao gateway em Base64. Alterável só pelo administrador da 
            plataforma ou suporte.

      urlWebhook:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            URL pública, de 1 a 200 caracteres, que recebe as notificações do gateway. 
            Registrada no cadastro da empresa no gateway
             e só aceita se responder HTTP 200. Opcional. Alterável só pelo administrador da 
            plataforma ou suporte.

      situacao:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação da conta da empresa NO SISTEMA (não confundir com statusCadastro, que é 
            o cadastro no gateway IntegraNotas). A empresa nasce PENDENTE_CONFIRMACAO no 
            signup,
             vira ATIVA quando o usuário clica no link do e-mail (ou quando o suporte ativa) 
            e DESATIVADA quando o suporte a desativa à mão. Nunca é apagada. Alterável só 
            pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              PENDENTE_CONFIRMACAO
                 Valor: PENDENTE_CONFIRMACAO
                 Texto: Pendente de confirmação - Estado inicial e padrão: a empresa nasce assim no signup, aguardando o clique no link de confirmação enviado por e-mail.
              ATIVA
                 Valor: ATIVA
                 Texto: Ativa - Conta ativa, depois do clique no link do e-mail ou quando o suporte a ativa.
              DESATIVADA
                 Valor: DESATIVADA
                 Texto: Desativada - Conta desativada à mão pelo suporte, com motivo obrigatório. A empresa nunca é apagada.
        enum:
          - PENDENTE_CONFIRMACAO
          - ATIVA
          - DESATIVADA
      dataConfirmacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o usuário confirmou o cadastro pelo link do e-mail. Vazia 
            enquanto pendente. Alterável só pelo administrador da plataforma ou suporte.

      referenciaCrm:
        type: string
        maxLength: 50
        pattern: \w*\W*
        description: |
            Identificador desta empresa como cliente no CRM da Marke. A cobrança é do CRM, 
            este sistema não processa pagamento. Opcional. Alterável só pelo administrador 
            da plataforma ou suporte.

      nfseHabilitada:
        type: boolean
        description: |
            Indica se a empresa habilitou a emissão de NFS-e. Ao habilitar, o sistema 
            cadastra o emitente no IntegraNotas (webhook e token do emitente, guardado no 
            cofre) e, se já houver certificado, envia-o. Padrão não (false). Alterável pelo 
            administrador da empresa e pela plataforma.

      serieNfse:
        type: string
        maxLength: 5
        pattern: \w*\W*
        description: |
            Série da DPS usada nas notas desta empresa, 1 a 5 dígitos. Informada ao 
            habilitar a emissão. Vai no campo serie do envio.

      ultimoNumeroNfse:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Último número da DPS já utilizado pela empresa (0 se nunca emitiu). O próximo 
            número é este mais 1, e o sistema o incrementa de forma atômica a cada nota. 
            Informado ao habilitar a emissão, para continuar a numeração de outro emissor. 
            Até 9 dígitos.

      statusCadastro:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação do cadastro da empresa NO GATEWAY (emitente no IntegraNotas), no 
            ambiente do registro. Não é a situação da conta no sistema (ver situacao). A 
            empresa nasce NAO_CADASTRADO,
             vira CADASTRADO quando o gateway devolve o token, e ERRO quando o cadastro é 
            recusado. Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_CADASTRADO
                 Valor: NAO_CADASTRADO
                 Texto: Não cadastrado - A empresa ainda não foi cadastrada no gateway. É o estado inicial e o padrão.
              CADASTRADO
                 Valor: CADASTRADO
                 Texto: Cadastrado - Cadastro aceito pelo gateway, que devolveu o token do emitente (nome no IntegraNotas), guardado no cofre.
              ERRO
                 Valor: ERRO
                 Texto: Erro no cadastro - Cadastro recusado pelo gateway.
        enum:
          - NAO_CADASTRADO
          - CADASTRADO
          - ERRO
      dataCadastroGateway:
        type: string
        format: date-time
        description: |
            Data e hora em que o gateway aceitou o cadastro e devolveu o token. Vazia 
            enquanto não cadastrado. Alterável só pelo administrador da plataforma ou 
            suporte.

      validadeCertificado:
        type: string
        format: date
        description: |
            Data de validade do certificado digital enviado ao gateway. Vazia enquanto não 
            houver certificado. Alterável só pelo administrador da plataforma ou suporte.

      situacaoCertificado:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação do certificado digital da empresa no gateway, no ambiente do registro. 
            Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_ENVIADO
                 Valor: NAO_ENVIADO
                 Texto: Não enviado - Nenhum certificado foi enviado ao gateway. É o estado inicial e o padrão.
              VALIDO
                 Valor: VALIDO
                 Texto: Válido - Certificado aceito pelo gateway e dentro da validade.
              VENCIDO
                 Valor: VENCIDO
                 Texto: Vencido - Certificado com a validade vencida (erro 5011 do gateway).
              INVALIDO
                 Valor: INVALIDO
                 Texto: Inválido - Certificado corrompido ou enviado com senha errada (erro 5003 do gateway).
              NAO_PERTENCE
                 Valor: NAO_PERTENCE
                 Texto: Não pertence à empresa - Certificado que não pertence ao documento (CNPJ ou CPF) da empresa (erro 5029 do gateway).
        enum:
          - NAO_ENVIADO
          - VALIDO
          - VENCIDO
          - INVALIDO
          - NAO_PERTENCE
      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da empresa (UUID). Também é o identificador do tenant, 
            usado como chave de escopo
             da própria empresa (tenantKey) e referenciado pelo tenantKey das demais 
            entidades.

      ambiente:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Ambiente do gateway a que este registro pertence. Empresa (emitente no 
            IntegraNotas) e token são independentes por ambiente,
             então o mesmo documento (CNPJ ou CPF) tem um registro por ambiente e uma nota de 
            teste nunca se mistura com uma real.

            Valores permitidos: 
              HOMOLOGACAO
                 Valor: HOMOLOGACAO
                 Texto: Homologação - Ambiente de testes do gateway. É o padrão. Nada emitido aqui tem validade fiscal e uma nota de teste nunca se mistura com uma real.
              PRODUCAO
                 Valor: PRODUCAO
                 Texto: Produção - Ambiente real do gateway. As notas emitidas aqui têm validade fiscal.
        enum:
          - HOMOLOGACAO
          - PRODUCAO
      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a empresa foi cadastrada no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      atividades:
        type: array
        items:
          $ref: '#/definitions/configuracao.AtividadeEmpresa'
        description: |
            Atividades econômicas (CNAE) da empresa: uma principal e várias secundárias. Só 
            existem dentro da empresa, no mesmo contexto. Alterável só pelo administrador da 
            plataforma ou suporte.

      qsa:
        type: array
        items:
          $ref: '#/definitions/configuracao.QsaEmpresa'
        description: |
            Quadro de sócios e administradores (QSA) da empresa, com vários itens. Só existe 
            dentro da empresa, no mesmo contexto. Alterável só pelo administrador da 
            plataforma ou suporte.

      municipio:
        description: |
            Município do endereço da empresa. Traz código IBGE, nome e UF, que não se 
            repetem aqui (campos cmun, municipio e uf do gateway). A empresa não pode usar o 
            registro Exterior (regra da aplicação). Alterável pelo usuário da empresa.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.AtividadeEmpresa:
    description: |
            Atividade econômica (CNAE) de uma Empresa, com tipo, código CNAE e descrição. 
            Uma empresa tem uma atividade principal e várias secundárias. A regra de no 
            máximo uma principal por empresa é da aplicação.
             Existe só dentro da empresa e no mesmo contexto, por isso é detalhe da Empresa 
            ([m]/[o]). O tenant é a própria empresa. Não tem ambiente: herda o da Empresa.
             Vive no contexto configuracao (domain.configuracao).

    type: object
    required:
      - tipo
      - codigoCnae
      - descricao
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipo:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Se a atividade é a principal ou uma secundária da empresa. No máximo uma 
            principal por empresa (regra da aplicação). Obrigatório.

            Valores permitidos: 
              PRINCIPAL
                 Valor: PRINCIPAL
                 Texto: Principal - Atividade econômica principal da empresa. No máximo uma por empresa (regra da aplicação).
              SECUNDARIA
                 Valor: SECUNDARIA
                 Texto: Secundária - Atividade econômica secundária da empresa. Uma empresa pode ter várias.
        enum:
          - PRINCIPAL
          - SECUNDARIA
      codigoCnae:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            Código CNAE da atividade, 7 dígitos, só números, sem formatação. Guardado como 
            texto para preservar zeros à esquerda. Obrigatório.

      descricao:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Descrição da atividade conforme a tabela CNAE, até 300 caracteres. Obrigatório.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da atividade (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a atividade foi cadastrada.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa a quem a atividade pertence e tenant do registro. Apagar a empresa apaga 
            suas atividades. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.QsaEmpresa:
    description: |
            Item do quadro de sócios e administradores (QSA) de uma Empresa, com nome, CPF, 
            qualificação e data de entrada na sociedade. Uma empresa tem vários.
             Existe só dentro da empresa e no mesmo contexto, por isso é detalhe da Empresa 
            ([m]/[o]). O tenant é a própria empresa. Não tem ambiente: herda o da Empresa.
             Vive no contexto configuracao (domain.configuracao).

    type: object
    required:
      - nome
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome do sócio ou administrador. Obrigatório.

      cpf:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            CPF do sócio, opcional. NÃO se valida como 11 dígitos: a consulta pública de 
            CNPJ pode devolver o CPF do sócio mascarado (a confirmar ao ler a API), então o 
            valor é guardado como veio, até 14 caracteres.
             Dado pessoal, sujeito a mascaramento nas respostas.

      qualificacao:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Qualificação do sócio na sociedade, como Sócio-Administrador, até 100 
            caracteres. Opcional.

      dataEntradaSociedade:
        type: string
        format: date
        description: |
            Data em que o sócio entrou na sociedade. Opcional.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do item do QSA (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o item foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa a quem o sócio pertence e tenant do registro. Apagar a empresa apaga seu 
            QSA. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'

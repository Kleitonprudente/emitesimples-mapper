definitions:
  IdReference:
    type: object
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 2147483647
        format: int32
  CountResult:
    type: object
    properties:
      count:
        type: integer
        minimum: 0
        maximum: 2147483647
        format: int32
  ErrorResponse:
    type: object
    properties:
      code:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int32
        description: |
            Código do erro
      message:
        type: string
        description: |
            Mensagem resumida sobre o erro
      description:
        type: string
        description: |
            Detalhes para melhor entendimento do erro
  SumResult:
    type: object
    properties:
      sum:
        type: number
        minimum: 0.0
        maximum: 999999999999.99
        format: double
  cadastros.Municipio:
    description: |
            Município brasileiro identificado pelo código IBGE de 7 dígitos, exceto o 
            registro especial Exterior (UF EX), que não tem IBGE e carrega o código 0 da 
            tabela oficial; esse 0 nunca é enviado ao IntegraNotas (para pessoa no exterior 
            o envio manda uf = EX e omite o código do município). Dado de referência 
            compartilhado:
             endereço de Empresa aponta para ele, e a Pessoa o referencia por cidade e UF 
            (relação cidade): a tela mostra cidade e UF e esconde o IBGE, que está direto 
            aqui.
             O par (nome, UF) é único, regra documentada e não expressa no mapa. O Municipio 
            é buscado por nome e UF. Todo registro tem código: o IBGE de 7 dígitos ou, no 
            Exterior, o 0.
             Vive no contexto cadastros (domain.cadastros). Há dependência mútua entre os 
            contextos configuracao e cadastros:
             a Empresa (configuracao) referencia o Municipio, e Pessoa e Servico (cadastros) 
            referenciam a Empresa.
             Municipio e Empresa devem ser modelados juntos.

    type: object
    required:
      - codigoIbge
      - nome
      - uf
      - id
      - dataCriacao
      - dataAtualizacao
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      codigoIbge:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            Código do município no IBGE, 7 dígitos numéricos (inclui o dígito verificador), 
            exceto o registro especial Exterior (UF EX),
             que não tem IBGE e carrega o código 0 da tabela oficial. Esse 0 nunca é enviado 
            ao IntegraNotas (para pessoa no exterior o envio manda uf = EX e omite o código 
            do município).
             É único: não há dois municípios com o mesmo código. Guardado como texto para 
            preservar o formato.

      nome:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Nome oficial do município, como publicado pelo IBGE. O registro Exterior tem o 
            nome Exterior (o nome do IBGE vem vazio no arquivo; decisão provisória do 
            usuário, a confirmar).

      uf:
        type: string
        maxLength: 2
        pattern: \w*\W*
        description: |
            Sigla da unidade federativa do município, com 2 letras maiúsculas (ex: SP). 
            Valem as 27 UFs do Brasil mais EX (exterior).

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID). O código IBGE é a chave de negócio; 
            este campo é a chave técnica.

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o município foi cadastrado no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

  cadastros.Pessoa:
    description: |
            Cadastro de pessoa, física ou jurídica, que pode ser cliente, fornecedor ou 
            ambos (atributos cliente e fornecedor), reutilizável nas emissões, que na nota 
            assume o papel de tomador do serviço. É por empresa: o mesmo documento pode 
            existir
             uma vez em cada empresa, e uma empresa nunca enxerga a pessoa de outra.
             Tem um só documento (CNPJ ou CPF, um ou outro). Ao enviar a NFS-e, o sistema 
            separa o documento em cnpj ou cpf, que no IntegraNotas são campos distintos.
             A cidade é uma referência ao Municipio, que já traz a UF e o código IBGE: a tela 
            mostra cidade e UF e esconde o IBGE.
             Os contatos são uma lista (Contato), com vários por pessoa. Na exportação o 
            endereço não tem município brasileiro e usa os campos de exterior.
             Vive no contexto cadastros (domain.cadastros), que referencia a Empresa 
            (configuracao) e tem dependência mútua com ele, pois a Empresa referencia o 
            Municipio, que está em cadastros.

    type: object
    required:
      - tipoPessoa
      - nome
      - cliente
      - fornecedor
      - logradouro
      - numeroEndereco
      - bairro
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipoPessoa:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Física ou jurídica. Define como se lê o documento: jurídica tem CNPJ de 14 
            dígitos, física tem CPF de 11 dígitos. Obrigatório.

      documento:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Documento da pessoa, só dígitos, sem formatação: 14 dígitos é CNPJ (pessoa 
            jurídica) e 11 dígitos é CPF (pessoa física), coerente com o tipo de pessoa.
             É um ou outro, nunca os dois. Ao enviar a NFS-e vai como cnpj ou cpf conforme o 
            tamanho. CPF é dado pessoal, sujeito a mascaramento nas respostas. Único dentro 
            da empresa.

      nome:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome da pessoa física ou razão social da pessoa jurídica (vai no campo 
            razao_social do envio). Obrigatório.

      nomeFantasia:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome fantasia da pessoa jurídica. Opcional. O nome nomeFantasia é o que já 
            consta na lista de busca do projeto (nondeterministicSearchField), por isso o 
            campo é pesquisável.

      inscricaoMunicipal:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Inscrição municipal da pessoa (campo im do envio). Opcional.

      rgInscricaoEstadual:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Um só campo: RG quando a pessoa é física, inscrição estadual quando é jurídica. 
            Opcional.
             Regra de aplicação: pessoa jurídica com inscrição estadual preenchida marca 
            consumidorFinal como não.

      tipoDestinatario:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Indica quem é o destinatário (campo tipo_destinatario do envio, indDest), 
            valores 0 ou 1. Opcional, padrão 0.

            Valores permitidos: 
              proprioTomador
                 Valor: 0
                 Texto: O destinatário é o próprio tomador/adquirente (padrão)
              outroDestinatario
                 Valor: 1
                 Texto: O destinatário não é o próprio adquirente (outra pessoa ou outro estabelecimento)
      consumidorFinal:
        type: boolean
        description: |
            Indica se a pessoa é consumidora final, sim ou não. Padrão sim (true), que é o 
            da pessoa física.
             Regra de aplicação, não do mapa: pessoa jurídica com inscrição estadual 
            preenchida passa a não.

      cliente:
        type: boolean
        description: |
            Indica se a pessoa é cliente da empresa (toma serviços; aparece no menu Clientes 
            e é a que a NFS-e usa como tomador). Padrão não (false). Uma mesma pessoa pode 
            ser cliente e fornecedor ao mesmo tempo.

      fornecedor:
        type: boolean
        description: |
            Indica se a pessoa é fornecedora da empresa (presta serviços ou vende à empresa; 
            aparece no menu Fornecedores). Padrão não (false). Uma mesma pessoa pode ser 
            cliente e fornecedor ao mesmo tempo.

      telefone:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Telefone principal da pessoa, só números. Opcional. Outros contatos ficam na 
            lista de contatos.

      email:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            E-mail principal da pessoa, até 60 caracteres. Opcional. Outros contatos ficam 
            na lista de contatos.

      logradouro:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            Rua, avenida ou similar do endereço da pessoa. Obrigatório.

      numeroEndereco:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Número do imóvel, texto porque aceita S/N (campo numero do endereço do envio). 
            Obrigatório.

      complemento:
        type: string
        maxLength: 256
        pattern: \w*\W*
        description: |
            Complemento do endereço. Opcional.

      bairro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Bairro do endereço. Obrigatório.

      cep:
        type: string
        maxLength: 8
        pattern: \w*\W*
        description: |
            CEP de 8 dígitos sem hífen, texto para preservar zeros à esquerda. Opcional. A 
            consulta de CEP (BrasilAPI) preenche o endereço e a cidade.

      codigoPais:
        type: string
        maxLength: 4
        pattern: \w*\W*
        description: |
            Código do país do endereço no exterior, de 3 a 4 dígitos (campo codigo_pais do 
            envio). Só na exportação. Quando preenchido e sem cidade,
             o endereço é de exportação e a UF enviada ao gateway é EX, derivada pelo sistema 
            na montagem do envio, sem atributo uf.

      codigoPostal:
        type: string
        maxLength: 11
        pattern: \w*\W*
        description: |
            Código postal do endereço no exterior (campo codigo_postal do envio). Opcional.

      nomeMunicipioExterior:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Nome da cidade no exterior (campo nome_municipio do envio). Opcional.

      nomeProvincia:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Nome da província ou estado no exterior (campo nome_provincia do envio). 
            Opcional.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da pessoa (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a pessoa foi cadastrada.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa dona desta pessoa e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
      cidade:
        description: |
            Cidade do endereço, referência ao Municipio, que traz nome, UF e código IBGE 
            (campos codigo_municipio e uf do envio).
             A tela mostra cidade e UF e esconde o IBGE, que é obtido do Municipio buscado 
            por nome e UF. Não há atributos uf nem IBGE na pessoa.
             Opcional apenas porque na exportação o endereço não tem município brasileiro. 
            Para pessoa estrangeira a cidade é o registro Exterior (UF EX), junto dos campos 
            de exportação.

        allOf:
          - $ref: '#/definitions/IdReference'
      contatos:
        type: array
        items:
          $ref: '#/definitions/cadastros.Contato'
        description: |
            Lista de contatos da pessoa, com vários itens. Só existem dentro da pessoa, no 
            mesmo contexto. Os sócios do QSA da consulta de CNPJ entram aqui.

  cadastros.Servico:
    description: |
            Cadastro de serviço prestado, próprio de cada empresa e reutilizável na emissão. 
            Guarda o enquadramento fiscal padrão
             (código da LC 116, ISS e PIS/COFINS) e valores padrão que a nota pode 
            sobrescrever.
             Vive no contexto cadastros (domain.cadastros), que referencia a Empresa 
            (configuracao) e tem dependência mútua com ele, pois a Empresa referencia o 
            Municipio, que está em cadastros.

    type: object
    required:
      - nome
      - ativo
      - codigoServico
      - issRetido
      - tipoOperacaoIss
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Nome interno para reconhecer o serviço em telas e listas. Não vai no envio ao 
            gateway.

      codigoInterno:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Código do serviço no sistema da empresa, até 20 caracteres (campo codigo_interno 
            do envio). Opcional.

      ativo:
        type: boolean
        description: |
            Indica se o serviço pode ser escolhido em novas emissões. Serviço desativado 
            some das listas, mas permanece
             nas notas já emitidas, que guardam o que foi enviado.

      codigoServico:
        type: string
        maxLength: 6
        pattern: \w*\W*
        description: |
            Código do serviço da LC 116/2003, exatamente 6 dígitos (campo servico.codigo do 
            envio). Obrigatório.
             Texto para preservar zeros à esquerda.

      codigoTributacaoMunicipio:
        type: string
        maxLength: 3
        pattern: \w*\W*
        description: |
            Código de tributação do município, 3 dígitos (campo codigo_tributacao_municipio 
            do envio). Opcional.

      codigoNbs:
        type: string
        maxLength: 9
        pattern: \w*\W*
        description: |
            Nomenclatura Brasileira de Serviços, 9 dígitos (campo codigo_nbs do envio). 
            Opcional.

      descricaoCurta:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            Descrição de até 200 caracteres (campo descricao do envio), usada só no PDF. 
            Opcional.

      discriminacaoPadrao:
        type: string
        maxLength: 2000
        pattern: \w*\W*
        description: |
            Texto padrão da discriminação do serviço, até 2000 caracteres (campo 
            discriminacao do envio, obrigatório na nota).
             Quebra de linha só com \n. Opcional no cadastro, a nota pode informar a sua.

      valorPadrao:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor sugerido do serviço (valor_servicos do envio, mínimo 0.01 na nota). 
            Opcional, a nota pode alterar.

      aliquotaIss:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Alíquota do ISS em pontos percentuais, de 0 a 100 (5.00 significa 5%). Campo 
            aliquota_iss do envio. Opcional.

      issRetido:
        type: boolean
        description: |
            Indica se o ISS é retido pelo tomador (campo iss_retido do envio). Padrão não.

      tipoOperacaoIss:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Tipo da operação para o ISS (campo tributos_municipais.tipo_operacao do envio). 
            Padrão 1, tributável.

            Valores permitidos: 
              tributavel
                 Valor: 1
                 Texto: Tributável
              imunidade
                 Valor: 2
                 Texto: Imunidade
              exportacao
                 Valor: 3
                 Texto: Exportação
              naoIncidencia
                 Valor: 4
                 Texto: Não incidência
      cstPisCofins:
        type: string
        maxLength: 2
        pattern: \w*\W*
        description: |
            CST do PIS/COFINS, 2 dígitos (campo tributos_nacionais.cst do envio, obrigatório 
            na nota). Texto porque a lista é longa
             e vem da tabela de CST PIS/COFINS da documentação do IntegraNotas. Opcional no 
            cadastro, a nota informa se faltar.

      percentualTributosSimples:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Percentual aproximado de tributos do Simples Nacional (Lei 12.741/2012), em 
            pontos percentuais (13.75 significa 13,75%). Opcional. Vai nos tributos totais 
            da nota; o nome exato do campo no envio v2 precisa ser confirmado em 
            homologação.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do serviço (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o serviço foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa dona deste serviço e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  cadastros.Contato:
    description: |
            Contato de uma Pessoa, com tipo, nome, WhatsApp e e-mail. Uma pessoa tem vários. 
            Existe só dentro da pessoa e no mesmo contexto, por isso é detalhe da Pessoa 
            ([m]/[o]).
             Os sócios do QSA da consulta de CNPJ entram como contatos do tipo sócio. O 
            e-mail e o telefone principais ficam na própria Pessoa.
             Vive no contexto cadastros (domain.cadastros) e referencia a Empresa 
            (configuracao) como tenant.

    type: object
    required:
      - tipoContato
      - nome
      - id
      - dataCriacao
      - dataAtualizacao
      - pessoa
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipoContato:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Papel do contato perante a pessoa. Valores propostos pelo modelador (o usuário 
            não os definiu, a confirmar): socio, financeiro, comercial, fiscal e outro. 
            Obrigatório.

      nome:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome da pessoa de contato. Acréscimo do modelador, não listado pelo usuário: os 
            sócios do QSA entram como contatos e um contato sem nome não se identifica. 
            Obrigatório.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Número de WhatsApp do contato, só números. Opcional.

      email:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            E-mail do contato, até 60 caracteres. Opcional.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do contato (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o contato foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      pessoa:
        description: |
            Pessoa a quem o contato pertence. Apagar a pessoa apaga seus contatos.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona deste contato e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  cadastros.ImportacaoMunicipio:
    description: |
            Histórico dos envios do arquivo de cidades (CSV do IBGE) feitos pelo 
            administrador da plataforma. É o rastro de quem alterou a tabela de municípios e 
            quando, e guarda o relatório de cada importação (totais e resumo das linhas 
            rejeitadas). Regra da importação, detalhada em docs/carga-municipios.md: 
            atualiza ou insere pelo código IBGE e nunca apaga cidades, pois Pessoa e Empresa 
            as referenciam; linhas inválidas são rejeitadas e relatadas, sem adivinhar.
             Registro da plataforma, não de uma empresa: não tem empresa, não tem tenantKey e 
            não tem ambiente (não depende do gateway). Só o administrador da plataforma 
            envia; essa regra é da aplicação e o mapa não a expressa.
             Vive no contexto cadastros (domain.cadastros) e referencia o Usuario do contexto 
            usuarios, que já referencia configuracao, que por sua vez referencia cadastros. 
            É mais uma volta no ciclo de dependência entre contextos, como a dependência 
            mútua entre configuracao e cadastros: não é erro, pois entre contextos a relação 
            é sempre referência, mas quebra o princípio de modelar do mais independente para 
            o mais dependente.

    type: object
    required:
      - nomeArquivo
      - estado
      - dataHoraInicio
      - linhasLidas
      - linhasInseridas
      - linhasAtualizadas
      - linhasIguais
      - linhasRejeitadas
      - id
      - dataCriacao
      - dataAtualizacao
      - usuario
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nomeArquivo:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            Nome do arquivo enviado pelo administrador.

      codificacaoDetectada:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Codificação que a importação detectou no arquivo, UTF-8 ou Windows-1252. Útil 
            para depurar. Vazia se a importação falhou antes de ler o arquivo.

      separadorDetectado:
        type: string
        maxLength: 5
        pattern: \w*\W*
        description: |
            Separador de colunas que a importação detectou no arquivo (ponto e vírgula, 
            vírgula ou tabulação). Útil para depurar. Vazio se a importação falhou antes de 
            ler o arquivo.

      estado:
        type: string
        maxLength: 23
        pattern: \w*\W*
        description: |
            Estado da importação. Ciclo: nasce em em_andamento; termina em concluida 
            (nenhuma linha rejeitada), concluida_com_rejeicoes (terminou, mas ao menos uma 
            linha foi rejeitada) ou falhou (não conseguiu processar o arquivo). Os três 
            últimos são finais e preenchem dataHoraFim.

      dataHoraInicio:
        type: string
        format: date-time
        description: |
            Data e hora em que a importação começou.

      dataHoraFim:
        type: string
        format: date-time
        description: |
            Data e hora em que a importação terminou, com sucesso ou falha. Vazia enquanto 
            em_andamento.

      linhasLidas:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Total de linhas de dados lidas do arquivo (sem o cabeçalho). Deve ser igual à 
            soma de inseridas, atualizadas, iguais e rejeitadas.

      linhasInseridas:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Quantidade de cidades novas, cujo código IBGE ainda não existia na tabela.

      linhasAtualizadas:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Quantidade de cidades existentes cujo nome ou UF mudou.

      linhasIguais:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Quantidade de cidades existentes que já estavam idênticas ao arquivo, sem 
            alteração.

      linhasRejeitadas:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Quantidade de linhas rejeitadas (código fora do padrão, UF inválida, nome vazio 
            ou código repetido no arquivo).

      resumoRejeicoes:
        type: string
        maxLength: 4000
        pattern: \w*\W*
        description: |
            Resumo em texto das linhas rejeitadas, com o número da linha e o motivo de cada 
            uma. O detalhe completo pode ser truncado para caber no limite; os totais ficam 
            sempre exatos em linhasRejeitadas.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da importação (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi criado no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      usuario:
        description: |
            Administrador da plataforma que enviou o arquivo. O Usuario é global, sem 
            tenant. Só o administrador da plataforma envia; a regra é da aplicação e o mapa 
            não a expressa.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.Empresa:
    description: |
            Empresa usuária do sistema e tenant do modelo. Cada empresa só emite e só 
            enxerga as próprias notas.
             NUNCA é apagada, só DESATIVADA (situacao = desativada): a aplicação não deve 
            expor a remoção. Nasce no signup com o documento, o e-mail e o WhatsApp 
            informados, em situacao pendente_confirmacao, e fica ativa quando o usuário 
            clica no link do e-mail (ConfirmacaoCadastro).
             É identificada por um documento único (CNPJ ou CPF). Tem atividades 
            (AtividadeEmpresa) e quadro de sócios (QsaEmpresa) como detalhes ([m]/[o]).
             Regra de edição, da aplicação: o usuário da empresa só altera razaoSocial, 
            nomeFantasia e o endereço; o resto é alterável só pelo administrador da 
            plataforma ou suporte. É cadastrada no gateway IntegraNotas, onde se chama 
            "emitente", e o gateway devolve o token do emitente,
             separado por ambiente. Token, credenciais da prefeitura e certificado ficam no 
            cofre, aqui só há referência.
             Vive no contexto configuracao (domain.configuracao), sozinha. Há dependência 
            mútua com o contexto cadastros: a Empresa referencia o Municipio (cadastros), e 
            Pessoa e Servico (cadastros) referenciam a Empresa. Empresa e Municipio devem 
            ser modelados juntos.

    type: object
    required:
      - nomeFantasia
      - razaoSocial
      - documento
      - email
      - whatsapp
      - telefone
      - logradouro
      - numeroEndereco
      - bairro
      - cep
      - regimeTributario
      - situacao
      - nfseHabilitada
      - ultimoNumeroNfse
      - statusCadastro
      - situacaoCertificado
      - id
      - ambiente
      - dataCriacao
      - dataAtualizacao
      - municipio
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nomeFantasia:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Nome fantasia da empresa, de 2 a 60 caracteres (campo nome do cadastro no 
            gateway). Alterável pelo usuário da empresa.

      razaoSocial:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Razão social da empresa, de 2 a 60 caracteres (campo razao do cadastro no 
            gateway). Alterável pelo usuário da empresa.

      documento:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Documento da empresa, só dígitos, sem formatação: 14 dígitos é CNPJ e 11 dígitos 
            é CPF. É um ou outro, nunca os dois.
             No cadastro no gateway e no envio ao IntegraNotas o sistema o separa em cnpj ou 
            cpf conforme o tamanho. CPF é dado pessoal, sujeito a mascaramento nas 
            respostas. Obrigatório.
             Único por ambiente (o mesmo documento tem um registro por ambiente). Alterável 
            só pelo administrador da plataforma ou suporte.

      rgInscricaoEstadual:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Inscrição estadual da empresa, até 20 caracteres. Mesmo nome do campo da Pessoa. 
            Opcional. Alterável só pelo administrador da plataforma ou suporte.

      inscricaoMunicipal:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Inscrição municipal da empresa, de 1 a 20 caracteres (campo im do gateway). 
            Opcional. Alterável só pelo administrador da plataforma ou suporte.

      email:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            E-mail da empresa, até 60 caracteres. Obrigatório: várias integrações exigem 
            (IntegraNotas, bancos para boleto e PIX). É o e-mail informado no signup. 
            Alterável só pelo administrador da plataforma ou suporte.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            WhatsApp da empresa, até 20 caracteres. Obrigatório: necessário em cadastros de 
            integração como IntegraNotas e bancos para boleto e PIX. É o WhatsApp informado 
            no signup. Alterável só pelo administrador da plataforma ou suporte.

      telefone:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Telefone da empresa, de 6 a 14 dígitos, só números. Alterável só pelo 
            administrador da plataforma ou suporte.

      logradouro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Rua, avenida ou similar do endereço da empresa, de 1 a 60 caracteres (campo rua 
            do gateway). Alterável pelo usuário da empresa.

      numeroEndereco:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Número do imóvel, de 1 a 60 caracteres, texto porque aceita S/N (campo numero do 
            gateway). Alterável pelo usuário da empresa.

      complemento:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Complemento do endereço, até 60 caracteres. Opcional. Alterável pelo usuário da 
            empresa.

      bairro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Bairro do endereço, de 2 a 60 caracteres. Alterável pelo usuário da empresa.

      cep:
        type: string
        maxLength: 8
        pattern: \w*\W*
        description: |
            CEP do endereço, exatamente 8 dígitos sem hífen. Guardado como texto para 
            preservar zeros à esquerda. Alterável pelo usuário da empresa.

      regimeTributario:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime tributário da empresa (campo crt do gateway). Define o enquadramento 
            usado na emissão. Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              simplesNacional
                 Valor: 1
                 Texto: Simples Nacional
              simplesExcessoSublimite
                 Valor: 2
                 Texto: Simples Nacional com excesso de sublimite
              regimeNormal
                 Valor: 3
                 Texto: Regime Normal
              mei
                 Valor: 4
                 Texto: MEI
      regimeIbsCbs:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime de apuração do IBS e da CBS da empresa (campo regime_cibs do gateway), de 
            0 a 4. Opcional por decisão do usuário.
             O valor 0 significa não informado e a tag não é enviada. Alterável só pelo 
            administrador da plataforma ou suporte.

            Valores permitidos: 
              naoInformado
                 Valor: 0
                 Texto: Não informado, padrão, a tag não é enviada
              simplesOpcaoRegimeRegular
                 Valor: 1
                 Texto: Simples Nacional com opção pelo regime regular do IBS e da CBS (crt 1 ou 2)
              normalOpcaoSimplesPendenteSemRegular
                 Valor: 2
                 Texto: Regime Normal com opção pendente pelo Simples Nacional, sem regime regular do IBS e da CBS (crt 3)
              normalSublimitePendenteSemRegular
                 Valor: 3
                 Texto: Regime Normal com opção pendente pelo Simples Nacional com excesso de sublimite, sem regime regular do IBS e da CBS (crt 3)
              normalOpcaoSimplesPendenteComRegular
                 Valor: 4
                 Texto: Regime Normal com opção pendente pelo Simples Nacional, com regime regular do IBS e da CBS (crt 3)
      logo:
        type: string
        format: byte
        description: |
            Logotipo da empresa, imagem JPG ou PNG proporcional (como 100x100) de até 1 MB. 
            Opcional, enviado ao gateway em Base64. Alterável só pelo administrador da 
            plataforma ou suporte.

      urlWebhook:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            URL pública, de 1 a 200 caracteres, que recebe as notificações do gateway. 
            Registrada no cadastro da empresa no gateway
             e só aceita se responder HTTP 200. Opcional. Alterável só pelo administrador da 
            plataforma ou suporte.

      situacao:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação da conta da empresa NO SISTEMA (não confundir com statusCadastro, que é 
            o cadastro no gateway IntegraNotas). A empresa nasce pendente_confirmacao no 
            signup,
             vira ativa quando o usuário clica no link do e-mail (ou quando o suporte ativa) 
            e desativada quando o suporte a desativa à mão. Nunca é apagada. Alterável só 
            pelo administrador da plataforma ou suporte.

      dataConfirmacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o usuário confirmou o cadastro pelo link do e-mail. Vazia 
            enquanto pendente. Alterável só pelo administrador da plataforma ou suporte.

      referenciaCrm:
        type: string
        maxLength: 50
        pattern: \w*\W*
        description: |
            Identificador desta empresa como cliente no CRM da Marke. A cobrança é do CRM, 
            este sistema não processa pagamento. Opcional. Alterável só pelo administrador 
            da plataforma ou suporte.

      nfseHabilitada:
        type: boolean
        description: |
            Indica se a empresa habilitou a emissão de NFS-e. Ao habilitar, o sistema 
            cadastra o emitente no IntegraNotas (webhook e token do emitente, guardado no 
            cofre) e, se já houver certificado, envia-o. Padrão não (false). Alterável pelo 
            administrador da empresa e pela plataforma.

      serieNfse:
        type: string
        maxLength: 5
        pattern: \w*\W*
        description: |
            Série da DPS usada nas notas desta empresa, 1 a 5 dígitos. Informada ao 
            habilitar a emissão. Vai no campo serie do envio.

      ultimoNumeroNfse:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Último número da DPS já utilizado pela empresa (0 se nunca emitiu). O próximo 
            número é este mais 1, e o sistema o incrementa de forma atômica a cada nota. 
            Informado ao habilitar a emissão, para continuar a numeração de outro emissor. 
            Até 9 dígitos.

      statusCadastro:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação do cadastro da empresa NO GATEWAY (emitente no IntegraNotas), no 
            ambiente do registro. Não é a situação da conta no sistema (ver situacao). A 
            empresa nasce nao_cadastrado,
             vira cadastrado quando o gateway devolve o token, e erro quando o cadastro é 
            recusado. Alterável só pelo administrador da plataforma ou suporte.

      dataCadastroGateway:
        type: string
        format: date-time
        description: |
            Data e hora em que o gateway aceitou o cadastro e devolveu o token. Vazia 
            enquanto não cadastrado. Alterável só pelo administrador da plataforma ou 
            suporte.

      validadeCertificado:
        type: string
        format: date
        description: |
            Data de validade do certificado digital enviado ao gateway. Vazia enquanto não 
            houver certificado. Alterável só pelo administrador da plataforma ou suporte.

      situacaoCertificado:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação do certificado digital da empresa no gateway, no ambiente do registro. 
            Alterável só pelo administrador da plataforma ou suporte.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da empresa (UUID). Também é o identificador do tenant, 
            usado como chave de escopo
             da própria empresa (tenantKey) e referenciado pelo tenantKey das demais 
            entidades.

      ambiente:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Ambiente do gateway a que este registro pertence. Empresa (emitente no 
            IntegraNotas) e token são independentes por ambiente,
             então o mesmo documento (CNPJ ou CPF) tem um registro por ambiente e uma nota de 
            teste nunca se mistura com uma real.

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a empresa foi cadastrada no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      atividades:
        type: array
        items:
          $ref: '#/definitions/configuracao.AtividadeEmpresa'
        description: |
            Atividades econômicas (CNAE) da empresa: uma principal e várias secundárias. Só 
            existem dentro da empresa, no mesmo contexto. Alterável só pelo administrador da 
            plataforma ou suporte.

      qsa:
        type: array
        items:
          $ref: '#/definitions/configuracao.QsaEmpresa'
        description: |
            Quadro de sócios e administradores (QSA) da empresa, com vários itens. Só existe 
            dentro da empresa, no mesmo contexto. Alterável só pelo administrador da 
            plataforma ou suporte.

      municipio:
        description: |
            Município do endereço da empresa. Traz código IBGE, nome e UF, que não se 
            repetem aqui (campos cmun, municipio e uf do gateway). A empresa não pode usar o 
            registro Exterior (regra da aplicação). Alterável pelo usuário da empresa.

        allOf:
          - $ref: '#/definitions/IdReference'
  usuarios.Usuario:
    description: |
            Identidade de uma pessoa que entra no sistema. É global: uma pessoa pode ter 
            vínculo com várias empresas, por isso não tem tenantKey, e o isolamento por 
            empresa está no VinculoUsuario. Vive no contexto usuarios (domain.usuarios), que 
            depende de configuracao e cadastros.
             O e-mail é único no sistema inteiro (o mapa não expressa unicidade, ela é regra 
            de negócio e índice único no banco).
             NUNCA guarda a senha, só o hash. NUNCA guarda token.

    type: object
    required:
      - nome
      - email
      - ativo
      - administradorPlataforma
      - id
      - dataCriacao
      - dataAtualizacao
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 120
        pattern: \w*\W*
        description: |
            Nome da pessoa. No signup é o nome do responsável, o primeiro usuário da 
            empresa.

      email:
        type: string
        maxLength: 160
        pattern: \w*\W*
        description: |
            E-mail usado no login. Único no sistema, sem diferenciar maiúsculas de 
            minúsculas. No signup, nome, e-mail e WhatsApp do responsável viram dados do 
            Usuario.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            WhatsApp da pessoa, até 20 caracteres. Opcional: o primeiro usuário, do signup, 
            o terá; usuários criados depois podem não ter.

      ativo:
        type: boolean
        description: |
            Usuário inativo não consegue entrar nem renovar o acesso.

      administradorPlataforma:
        type: boolean
        description: |
            Indica o administrador da plataforma, que pode cadastrar empresas em modo 
            irrestrito. Necessário porque a Empresa é o tenant e carrega tenantKey no 
            próprio id.

      dataUltimoAcesso:
        type: string
        format: date-time
        description: |
            Data e hora do último login bem-sucedido. Vazia se nunca entrou.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi gravado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

  configuracao.AtividadeEmpresa:
    description: |
            Atividade econômica (CNAE) de uma Empresa, com tipo, código CNAE e descrição. 
            Uma empresa tem uma atividade principal e várias secundárias. A regra de no 
            máximo uma principal por empresa é da aplicação.
             Existe só dentro da empresa e no mesmo contexto, por isso é detalhe da Empresa 
            ([m]/[o]). O tenant é a própria empresa. Não tem ambiente: herda o da Empresa.
             Vive no contexto configuracao (domain.configuracao).

    type: object
    required:
      - tipo
      - codigoCnae
      - descricao
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipo:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Se a atividade é a principal ou uma secundária da empresa. No máximo uma 
            principal por empresa (regra da aplicação). Obrigatório.

      codigoCnae:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            Código CNAE da atividade, 7 dígitos, só números, sem formatação. Guardado como 
            texto para preservar zeros à esquerda. Obrigatório.

      descricao:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Descrição da atividade conforme a tabela CNAE, até 300 caracteres. Obrigatório.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da atividade (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a atividade foi cadastrada.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa a quem a atividade pertence e tenant do registro. Apagar a empresa apaga 
            suas atividades. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.QsaEmpresa:
    description: |
            Item do quadro de sócios e administradores (QSA) de uma Empresa, com nome, CPF, 
            qualificação e data de entrada na sociedade. Uma empresa tem vários.
             Existe só dentro da empresa e no mesmo contexto, por isso é detalhe da Empresa 
            ([m]/[o]). O tenant é a própria empresa. Não tem ambiente: herda o da Empresa.
             Vive no contexto configuracao (domain.configuracao).

    type: object
    required:
      - nome
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome do sócio ou administrador. Obrigatório.

      cpf:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            CPF do sócio, opcional. NÃO se valida como 11 dígitos: a consulta pública de 
            CNPJ pode devolver o CPF do sócio mascarado (a confirmar ao ler a API), então o 
            valor é guardado como veio, até 14 caracteres.
             Dado pessoal, sujeito a mascaramento nas respostas.

      qualificacao:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Qualificação do sócio na sociedade, como Sócio-Administrador, até 100 
            caracteres. Opcional.

      dataEntradaSociedade:
        type: string
        format: date
        description: |
            Data em que o sócio entrou na sociedade. Opcional.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do item do QSA (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o item foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa a quem o sócio pertence e tenant do registro. Apagar a empresa apaga seu 
            QSA. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'

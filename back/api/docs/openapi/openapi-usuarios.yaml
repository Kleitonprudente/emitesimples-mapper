definitions:
  IdReference:
    type: object
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 2147483647
        format: int32
  CountResult:
    type: object
    properties:
      count:
        type: integer
        minimum: 0
        maximum: 2147483647
        format: int32
  ErrorResponse:
    type: object
    properties:
      code:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int32
        description: |
            Código do erro
      message:
        type: string
        description: |
            Mensagem resumida sobre o erro
      description:
        type: string
        description: |
            Detalhes para melhor entendimento do erro
  SumResult:
    type: object
    properties:
      sum:
        type: number
        minimum: 0.0
        maximum: 999999999999.99
        format: double
  usuarios.Usuario:
    description: |
            Identidade de uma pessoa que entra no sistema. É global: uma pessoa pode ter 
            vínculo com várias empresas, por isso não tem tenantKey, e o isolamento por 
            empresa está no VinculoUsuario. Vive no contexto usuarios (domain.usuarios), que 
            depende de configuracao e cadastros.
             O e-mail é único no sistema inteiro (o mapa não expressa unicidade, ela é regra 
            de negócio e índice único no banco).
             NUNCA guarda a senha, só o hash. NUNCA guarda token.

    type: object
    required:
      - nome
      - email
      - ativo
      - administradorPlataforma
      - id
      - dataCriacao
      - dataAtualizacao
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 120
        pattern: \w*\W*
        description: |
            Nome da pessoa. No signup é o nome do responsável, o primeiro usuário da 
            empresa.

      email:
        type: string
        maxLength: 160
        pattern: \w*\W*
        description: |
            E-mail usado no login. Único no sistema, sem diferenciar maiúsculas de 
            minúsculas. No signup, nome, e-mail e WhatsApp do responsável viram dados do 
            Usuario.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            WhatsApp da pessoa, até 20 caracteres. Opcional: o primeiro usuário, do signup, 
            o terá; usuários criados depois podem não ter.

      ativo:
        type: boolean
        description: |
            Usuário inativo não consegue entrar nem renovar o acesso.

      administradorPlataforma:
        type: boolean
        description: |
            Indica o administrador da plataforma, que pode cadastrar empresas em modo 
            irrestrito. Necessário porque a Empresa é o tenant e carrega tenantKey no 
            próprio id.

      dataUltimoAcesso:
        type: string
        format: date-time
        description: |
            Data e hora do último login bem-sucedido. Vazia se nunca entrou.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi gravado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

  usuarios.VinculoUsuario:
    description: |
            Liga um Usuario a uma Empresa com um papel. É aqui que está o isolamento: o 
            usuário só enxerga as empresas em que tem vínculo ativo, e a empresa do token 
            vem daqui.
             Unicidade: um usuário tem no máximo um vínculo por empresa (par usuario, empresa 
            único).
             Papel para scopes: ADMINISTRADOR = consultar, preparar, emitir, cancelar; 
            OPERADOR = consultar, preparar, emitir e, SÓ se o administrador delegar 
            (podeCancelarNfse), cancelar; CONSULTA = consultar. Emitir e cancelar exigem 
            confirmação humana, regra de fluxo fora deste mapa.

    type: object
    required:
      - papel
      - podeCancelarNfse
      - ativo
      - id
      - dataCriacao
      - dataAtualizacao
      - usuario
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      papel:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Papel do usuário nesta empresa. Mapeamento para scopes: ADMINISTRADOR = 
            consultar, preparar, emitir, cancelar; OPERADOR = consultar, preparar, emitir e 
            cancelar só com a permissão delegada (podeCancelarNfse); CONSULTA = consultar.

            Valores permitidos: 
              ADMINISTRADOR
                 Valor: ADMINISTRADOR
                 Texto: Administrador - Pode consultar, preparar, emitir e cancelar notas nesta empresa. Emitir e cancelar exigem confirmação humana.
              OPERADOR
                 Valor: OPERADOR
                 Texto: Operador - Pode consultar, preparar e emitir notas. Só cancela se o administrador delegar a permissão (podeCancelarNfse).
              CONSULTA
                 Valor: CONSULTA
                 Texto: Consulta - Só leitura: pode consultar, e nunca prepara, emite nem cancela. É o papel padrão.
        enum:
          - ADMINISTRADOR
          - OPERADOR
          - CONSULTA
      podeCancelarNfse:
        type: boolean
        description: |
            Permissão delegada pelo administrador para o operador cancelar NFS-e nesta 
            empresa. O administrador sempre pode cancelar, com ou sem este campo; o operador 
            só cancela se for verdadeiro; o papel CONSULTA nunca cancela. Padrão não.
             Divergência de código conhecida: o código atual deixa o operador cancelar sem 
            esta delegação, a corrigir depois.

      ativo:
        type: boolean
        description: |
            Vínculo desativado tira o acesso do usuário a esta empresa sem apagar o 
            histórico.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi gravado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      usuario:
        description: |
            Usuário vinculado.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa do vínculo e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  usuarios.ClienteAcesso:
    description: |
            Credencial de máquina para os agentes do próprio usuário (fase 1), vinculada a 
            uma única empresa. Troca clientId e segredo por um JWT de acesso com a claim da 
            empresa e os scopes permitidos. Vive no contexto usuarios (domain.usuarios), que 
            depende de configuracao e cadastros.
             Não é cliente OAuth de terceiros: registro dinâmico e consentimento ficam para a 
            fase 2.
             O clientId é único no sistema. NUNCA guarda o segredo, só o hash, e NUNCA guarda 
            token.

    type: object
    required:
      - nome
      - clientId
      - scopes
      - ativo
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 120
        pattern: \w*\W*
        description: |
            Nome que identifica o agente ou a integração, por exemplo Agente de conciliação.

      clientId:
        type: string
        maxLength: 64
        pattern: \w*\W*
        description: |
            Identificador público do cliente (clientId). Único no sistema. Não é segredo.

      scopes:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Lista dos scopes permitidos, separados por espaço, entre consultar, preparar, 
            emitir e cancelar (formato da claim scope do JWT). Texto em vez de entidade 
            filha: o conjunto é fixo e pequeno, não tem ciclo de vida próprio e vai direto 
            para a claim. Emitir e cancelar exigem confirmação humana, regra de fluxo fora 
            deste mapa.

      ativo:
        type: boolean
        description: |
            Cliente inativo não obtém token.

      dataUltimoUso:
        type: string
        format: date-time
        description: |
            Data e hora da última troca de credencial por token. Vazia se nunca usado.

      dataExpiracao:
        type: string
        format: date-time
        description: |
            Data e hora a partir da qual o cliente deixa de valer. Vazia significa sem 
            expiração.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi gravado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Única empresa a que o cliente dá acesso e tenant do registro. Todo acesso é 
            filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  usuarios.TokenRenovacao:
    description: |
            Registro do token de renovação do login, que permite um JWT de acesso curto. 
            Guarda só o hash do token e o estado, para rotação (cada uso gera um novo e 
            marca o anterior) e detecção de reuso (token já usado ou revogado reapresentado 
            derruba a sessão).
             NUNCA guarda o token, só o hash. O JWT de acesso não é guardado em lugar nenhum.

    type: object
    required:
      - dataExpiracao
      - usado
      - revogado
      - id
      - dataCriacao
      - dataAtualizacao
      - usuario
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      dataExpiracao:
        type: string
        format: date-time
        description: |
            Data e hora em que o token deixa de valer.

      usado:
        type: boolean
        description: |
            Indica que o token já foi trocado por um novo (rotação). Reapresentá-lo é reuso 
            e indica vazamento.

      revogado:
        type: boolean
        description: |
            Indica revogação explícita, por logout, troca de senha ou detecção de reuso.

      dataUso:
        type: string
        format: date-time
        description: |
            Data e hora em que o token foi trocado por um novo. Vazia enquanto não usado.

      dataRevogacao:
        type: string
        format: date-time
        description: |
            Data e hora da revogação. Vazia enquanto não revogado.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi gravado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      usuario:
        description: |
            Usuário dono da sessão.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa escolhida na sessão e tenant do registro. O JWT renovado carrega a claim 
            desta empresa.

        allOf:
          - $ref: '#/definitions/IdReference'
  usuarios.ConfirmacaoCadastro:
    description: |
            Confirmação do signup por link de e-mail. O link enviado ao usuário leva o 
            token; o sistema guarda SÓ o hash do token, nunca o token. Ao confirmar, a 
            empresa passa de PENDENTE_CONFIRMACAO para ATIVA e a dataConfirmacao dela é 
            preenchida.
             O endpoint de confirmação é PÚBLICO (o usuário ainda não tem sessão): esta 
            entidade NÃO deve ter recurso REST exposto, é regra da aplicação escrita à mão.

    type: object
    required:
      - email
      - dataExpiracao
      - estado
      - id
      - dataCriacao
      - dataAtualizacao
      - usuario
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      email:
        type: string
        maxLength: 160
        pattern: \w*\W*
        description: |
            Endereço de e-mail para onde o link de confirmação foi enviado.

      dataExpiracao:
        type: string
        format: date-time
        description: |
            Data e hora em que o link deixa de valer.

      dataConfirmacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o usuário clicou no link. Vazia enquanto pendente.

      estado:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Estado da confirmação: PENDENTE até o clique, CONFIRMADO depois dele, EXPIRADO 
            se a dataExpiracao passou sem clique.

            Valores permitidos: 
              PENDENTE
                 Valor: PENDENTE
                 Texto: Pendente - Estado inicial e padrão: aguardando o clique do usuário no link enviado por e-mail. dataConfirmacao fica vazia.
              CONFIRMADO
                 Valor: CONFIRMADO
                 Texto: Confirmado - O link foi usado: a empresa foi ativada e a dataConfirmacao preenchida.
              EXPIRADO
                 Valor: EXPIRADO
                 Texto: Expirado - A dataExpiracao passou sem o clique no link: a confirmação não vale mais.
        enum:
          - PENDENTE
          - CONFIRMADO
          - EXPIRADO
      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi gravado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      usuario:
        description: |
            Usuário a quem o link foi enviado, o responsável do signup.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa a ser ativada pela confirmação, e tenant do registro.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.Empresa:
    description: |
            Empresa usuária do sistema e tenant do modelo. Cada empresa só emite e só 
            enxerga as próprias notas.
             NUNCA é apagada, só DESATIVADA (situacao = DESATIVADA): a aplicação não deve 
            expor a remoção. Nasce no signup com o documento, o e-mail e o WhatsApp 
            informados, em situacao PENDENTE_CONFIRMACAO, e fica ATIVA quando o usuário 
            clica no link do e-mail (ConfirmacaoCadastro).
             É identificada por um documento único (CNPJ ou CPF). Tem atividades 
            (AtividadeEmpresa) e quadro de sócios (QsaEmpresa) como detalhes ([m]/[o]).
             Regra de edição, da aplicação: o usuário da empresa só altera razaoSocial, 
            nomeFantasia e o endereço; o resto é alterável só pelo administrador da 
            plataforma ou suporte. É cadastrada no gateway IntegraNotas, onde se chama 
            "emitente", e o gateway devolve o token do emitente,
             separado por ambiente. Token, credenciais da prefeitura e certificado ficam no 
            cofre, aqui só há referência.
             Vive no contexto configuracao (domain.configuracao), sozinha. Há dependência 
            mútua com o contexto cadastros: a Empresa referencia o Municipio (cadastros), e 
            Pessoa e Servico (cadastros) referenciam a Empresa. Empresa e Municipio devem 
            ser modelados juntos.

    type: object
    required:
      - nomeFantasia
      - razaoSocial
      - documento
      - email
      - whatsapp
      - telefone
      - logradouro
      - numeroEndereco
      - bairro
      - cep
      - regimeTributario
      - situacao
      - nfseHabilitada
      - ultimoNumeroNfse
      - statusCadastro
      - situacaoCertificado
      - id
      - ambiente
      - dataCriacao
      - dataAtualizacao
      - municipio
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nomeFantasia:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Nome fantasia da empresa, de 2 a 60 caracteres (campo nome do cadastro no 
            gateway). Alterável pelo usuário da empresa.

      razaoSocial:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Razão social da empresa, de 2 a 60 caracteres (campo razao do cadastro no 
            gateway). Alterável pelo usuário da empresa.

      documento:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Documento da empresa, só dígitos, sem formatação: 14 dígitos é CNPJ e 11 dígitos 
            é CPF. É um ou outro, nunca os dois.
             No cadastro no gateway e no envio ao IntegraNotas o sistema o separa em cnpj ou 
            cpf conforme o tamanho. CPF é dado pessoal, sujeito a mascaramento nas 
            respostas. Obrigatório.
             Único por ambiente (o mesmo documento tem um registro por ambiente). Alterável 
            só pelo administrador da plataforma ou suporte.

      rgInscricaoEstadual:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Inscrição estadual da empresa, até 20 caracteres. Mesmo nome do campo da Pessoa. 
            Opcional. Alterável só pelo administrador da plataforma ou suporte.

      inscricaoMunicipal:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Inscrição municipal da empresa, de 1 a 20 caracteres (campo im do gateway). 
            Opcional. Alterável só pelo administrador da plataforma ou suporte.

      email:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            E-mail da empresa, até 60 caracteres. Obrigatório: várias integrações exigem 
            (IntegraNotas, bancos para boleto e PIX). É o e-mail informado no signup. 
            Alterável só pelo administrador da plataforma ou suporte.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            WhatsApp da empresa, até 20 caracteres. Obrigatório: necessário em cadastros de 
            integração como IntegraNotas e bancos para boleto e PIX. É o WhatsApp informado 
            no signup. Alterável só pelo administrador da plataforma ou suporte.

      telefone:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Telefone da empresa, de 6 a 14 dígitos, só números. Alterável só pelo 
            administrador da plataforma ou suporte.

      logradouro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Rua, avenida ou similar do endereço da empresa, de 1 a 60 caracteres (campo rua 
            do gateway). Alterável pelo usuário da empresa.

      numeroEndereco:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Número do imóvel, de 1 a 60 caracteres, texto porque aceita S/N (campo numero do 
            gateway). Alterável pelo usuário da empresa.

      complemento:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Complemento do endereço, até 60 caracteres. Opcional. Alterável pelo usuário da 
            empresa.

      bairro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Bairro do endereço, de 2 a 60 caracteres. Alterável pelo usuário da empresa.

      cep:
        type: string
        maxLength: 8
        pattern: \w*\W*
        description: |
            CEP do endereço, exatamente 8 dígitos sem hífen. Guardado como texto para 
            preservar zeros à esquerda. Alterável pelo usuário da empresa.

      regimeTributario:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime tributário da empresa (campo crt do gateway). Define o enquadramento 
            usado na emissão. Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              SIMPLES_NACIONAL
                 Valor: 1
                 Texto: Simples Nacional - Empresa optante pelo Simples Nacional. Código gravado e enviado ao gateway (crt): 1.
              SIMPLES_EXCESSO_SUBLIMITE
                 Valor: 2
                 Texto: Simples Nacional com excesso de sublimite - Simples Nacional com excesso de sublimite de receita. Código gravado e enviado ao gateway (crt): 2.
              REGIME_NORMAL
                 Valor: 3
                 Texto: Regime Normal - Empresa no regime normal (lucro presumido ou real). Código gravado e enviado ao gateway (crt): 3.
              MEI
                 Valor: 4
                 Texto: MEI - Microempreendedor Individual. Código gravado e enviado ao gateway (crt): 4.
      regimeIbsCbs:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime de apuração do IBS e da CBS da empresa (campo regime_cibs do gateway), de 
            0 a 4. Opcional por decisão do usuário.
             O valor 0 significa não informado e a tag não é enviada. Alterável só pelo 
            administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_INFORMADO
                 Valor: 0
                 Texto: Não informado - Não informado, padrão: a tag regime_cibs não é enviada. Código gravado: 0.
              SIMPLES_OPCAO_REGIME_REGULAR
                 Valor: 1
                 Texto: Simples Nacional com opção pelo regime regular - Simples Nacional com opção pelo regime regular do IBS e da CBS (crt 1 ou 2). Código gravado e enviado ao gateway: 1.
              NORMAL_OPCAO_SIMPLES_PENDENTE_SEM_REGULAR
                 Valor: 2
                 Texto: Regime Normal, opção pelo Simples pendente, sem regime regular - Regime Normal com opção pendente pelo Simples Nacional, sem regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 2.
              NORMAL_SUBLIMITE_PENDENTE_SEM_REGULAR
                 Valor: 3
                 Texto: Regime Normal, excesso de sublimite pendente, sem regime regular - Regime Normal com opção pendente pelo Simples Nacional com excesso de sublimite, sem regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 3.
              NORMAL_OPCAO_SIMPLES_PENDENTE_COM_REGULAR
                 Valor: 4
                 Texto: Regime Normal, opção pelo Simples pendente, com regime regular - Regime Normal com opção pendente pelo Simples Nacional, com regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 4.
      logo:
        type: string
        format: byte
        description: |
            Logotipo da empresa, imagem JPG ou PNG proporcional (como 100x100) de até 1 MB. 
            Opcional, enviado ao gateway em Base64. Alterável só pelo administrador da 
            plataforma ou suporte.

      urlWebhook:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            URL pública, de 1 a 200 caracteres, que recebe as notificações do gateway. 
            Registrada no cadastro da empresa no gateway
             e só aceita se responder HTTP 200. Opcional. Alterável só pelo administrador da 
            plataforma ou suporte.

      situacao:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação da conta da empresa NO SISTEMA (não confundir com statusCadastro, que é 
            o cadastro no gateway IntegraNotas). A empresa nasce PENDENTE_CONFIRMACAO no 
            signup,
             vira ATIVA quando o usuário clica no link do e-mail (ou quando o suporte ativa) 
            e DESATIVADA quando o suporte a desativa à mão. Nunca é apagada. Alterável só 
            pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              PENDENTE_CONFIRMACAO
                 Valor: PENDENTE_CONFIRMACAO
                 Texto: Pendente de confirmação - Estado inicial e padrão: a empresa nasce assim no signup, aguardando o clique no link de confirmação enviado por e-mail.
              ATIVA
                 Valor: ATIVA
                 Texto: Ativa - Conta ativa, depois do clique no link do e-mail ou quando o suporte a ativa.
              DESATIVADA
                 Valor: DESATIVADA
                 Texto: Desativada - Conta desativada à mão pelo suporte, com motivo obrigatório. A empresa nunca é apagada.
        enum:
          - PENDENTE_CONFIRMACAO
          - ATIVA
          - DESATIVADA
      dataConfirmacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o usuário confirmou o cadastro pelo link do e-mail. Vazia 
            enquanto pendente. Alterável só pelo administrador da plataforma ou suporte.

      referenciaCrm:
        type: string
        maxLength: 50
        pattern: \w*\W*
        description: |
            Identificador desta empresa como cliente no CRM da Marke. A cobrança é do CRM, 
            este sistema não processa pagamento. Opcional. Alterável só pelo administrador 
            da plataforma ou suporte.

      nfseHabilitada:
        type: boolean
        description: |
            Indica se a empresa habilitou a emissão de NFS-e. Ao habilitar, o sistema 
            cadastra o emitente no IntegraNotas (webhook e token do emitente, guardado no 
            cofre) e, se já houver certificado, envia-o. Padrão não (false). Alterável pelo 
            administrador da empresa e pela plataforma.

      serieNfse:
        type: string
        maxLength: 5
        pattern: \w*\W*
        description: |
            Série da DPS usada nas notas desta empresa, 1 a 5 dígitos. Informada ao 
            habilitar a emissão. Vai no campo serie do envio.

      ultimoNumeroNfse:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Último número da DPS já utilizado pela empresa (0 se nunca emitiu). O próximo 
            número é este mais 1, e o sistema o incrementa de forma atômica a cada nota. 
            Informado ao habilitar a emissão, para continuar a numeração de outro emissor. 
            Até 9 dígitos.

      statusCadastro:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação do cadastro da empresa NO GATEWAY (emitente no IntegraNotas), no 
            ambiente do registro. Não é a situação da conta no sistema (ver situacao). A 
            empresa nasce NAO_CADASTRADO,
             vira CADASTRADO quando o gateway devolve o token, e ERRO quando o cadastro é 
            recusado. Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_CADASTRADO
                 Valor: NAO_CADASTRADO
                 Texto: Não cadastrado - A empresa ainda não foi cadastrada no gateway. É o estado inicial e o padrão.
              CADASTRADO
                 Valor: CADASTRADO
                 Texto: Cadastrado - Cadastro aceito pelo gateway, que devolveu o token do emitente (nome no IntegraNotas), guardado no cofre.
              ERRO
                 Valor: ERRO
                 Texto: Erro no cadastro - Cadastro recusado pelo gateway.
        enum:
          - NAO_CADASTRADO
          - CADASTRADO
          - ERRO
      dataCadastroGateway:
        type: string
        format: date-time
        description: |
            Data e hora em que o gateway aceitou o cadastro e devolveu o token. Vazia 
            enquanto não cadastrado. Alterável só pelo administrador da plataforma ou 
            suporte.

      validadeCertificado:
        type: string
        format: date
        description: |
            Data de validade do certificado digital enviado ao gateway. Vazia enquanto não 
            houver certificado. Alterável só pelo administrador da plataforma ou suporte.

      situacaoCertificado:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação do certificado digital da empresa no gateway, no ambiente do registro. 
            Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_ENVIADO
                 Valor: NAO_ENVIADO
                 Texto: Não enviado - Nenhum certificado foi enviado ao gateway. É o estado inicial e o padrão.
              VALIDO
                 Valor: VALIDO
                 Texto: Válido - Certificado aceito pelo gateway e dentro da validade.
              VENCIDO
                 Valor: VENCIDO
                 Texto: Vencido - Certificado com a validade vencida (erro 5011 do gateway).
              INVALIDO
                 Valor: INVALIDO
                 Texto: Inválido - Certificado corrompido ou enviado com senha errada (erro 5003 do gateway).
              NAO_PERTENCE
                 Valor: NAO_PERTENCE
                 Texto: Não pertence à empresa - Certificado que não pertence ao documento (CNPJ ou CPF) da empresa (erro 5029 do gateway).
        enum:
          - NAO_ENVIADO
          - VALIDO
          - VENCIDO
          - INVALIDO
          - NAO_PERTENCE
      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da empresa (UUID). Também é o identificador do tenant, 
            usado como chave de escopo
             da própria empresa (tenantKey) e referenciado pelo tenantKey das demais 
            entidades.

      ambiente:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Ambiente do gateway a que este registro pertence. Empresa (emitente no 
            IntegraNotas) e token são independentes por ambiente,
             então o mesmo documento (CNPJ ou CPF) tem um registro por ambiente e uma nota de 
            teste nunca se mistura com uma real.

            Valores permitidos: 
              HOMOLOGACAO
                 Valor: HOMOLOGACAO
                 Texto: Homologação - Ambiente de testes do gateway. É o padrão. Nada emitido aqui tem validade fiscal e uma nota de teste nunca se mistura com uma real.
              PRODUCAO
                 Valor: PRODUCAO
                 Texto: Produção - Ambiente real do gateway. As notas emitidas aqui têm validade fiscal.
        enum:
          - HOMOLOGACAO
          - PRODUCAO
      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a empresa foi cadastrada no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      atividades:
        type: array
        items:
          $ref: '#/definitions/configuracao.AtividadeEmpresa'
        description: |
            Atividades econômicas (CNAE) da empresa: uma principal e várias secundárias. Só 
            existem dentro da empresa, no mesmo contexto. Alterável só pelo administrador da 
            plataforma ou suporte.

      qsa:
        type: array
        items:
          $ref: '#/definitions/configuracao.QsaEmpresa'
        description: |
            Quadro de sócios e administradores (QSA) da empresa, com vários itens. Só existe 
            dentro da empresa, no mesmo contexto. Alterável só pelo administrador da 
            plataforma ou suporte.

      municipio:
        description: |
            Município do endereço da empresa. Traz código IBGE, nome e UF, que não se 
            repetem aqui (campos cmun, municipio e uf do gateway). A empresa não pode usar o 
            registro Exterior (regra da aplicação). Alterável pelo usuário da empresa.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.AtividadeEmpresa:
    description: |
            Atividade econômica (CNAE) de uma Empresa, com tipo, código CNAE e descrição. 
            Uma empresa tem uma atividade principal e várias secundárias. A regra de no 
            máximo uma principal por empresa é da aplicação.
             Existe só dentro da empresa e no mesmo contexto, por isso é detalhe da Empresa 
            ([m]/[o]). O tenant é a própria empresa. Não tem ambiente: herda o da Empresa.
             Vive no contexto configuracao (domain.configuracao).

    type: object
    required:
      - tipo
      - codigoCnae
      - descricao
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipo:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Se a atividade é a principal ou uma secundária da empresa. No máximo uma 
            principal por empresa (regra da aplicação). Obrigatório.

            Valores permitidos: 
              PRINCIPAL
                 Valor: PRINCIPAL
                 Texto: Principal - Atividade econômica principal da empresa. No máximo uma por empresa (regra da aplicação).
              SECUNDARIA
                 Valor: SECUNDARIA
                 Texto: Secundária - Atividade econômica secundária da empresa. Uma empresa pode ter várias.
        enum:
          - PRINCIPAL
          - SECUNDARIA
      codigoCnae:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            Código CNAE da atividade, 7 dígitos, só números, sem formatação. Guardado como 
            texto para preservar zeros à esquerda. Obrigatório.

      descricao:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Descrição da atividade conforme a tabela CNAE, até 300 caracteres. Obrigatório.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da atividade (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a atividade foi cadastrada.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa a quem a atividade pertence e tenant do registro. Apagar a empresa apaga 
            suas atividades. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.QsaEmpresa:
    description: |
            Item do quadro de sócios e administradores (QSA) de uma Empresa, com nome, CPF, 
            qualificação e data de entrada na sociedade. Uma empresa tem vários.
             Existe só dentro da empresa e no mesmo contexto, por isso é detalhe da Empresa 
            ([m]/[o]). O tenant é a própria empresa. Não tem ambiente: herda o da Empresa.
             Vive no contexto configuracao (domain.configuracao).

    type: object
    required:
      - nome
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome do sócio ou administrador. Obrigatório.

      cpf:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            CPF do sócio, opcional. NÃO se valida como 11 dígitos: a consulta pública de 
            CNPJ pode devolver o CPF do sócio mascarado (a confirmar ao ler a API), então o 
            valor é guardado como veio, até 14 caracteres.
             Dado pessoal, sujeito a mascaramento nas respostas.

      qualificacao:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Qualificação do sócio na sociedade, como Sócio-Administrador, até 100 
            caracteres. Opcional.

      dataEntradaSociedade:
        type: string
        format: date
        description: |
            Data em que o sócio entrou na sociedade. Opcional.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do item do QSA (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o item foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa a quem o sócio pertence e tenant do registro. Apagar a empresa apaga seu 
            QSA. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  cadastros.Municipio:
    description: |
            Município brasileiro identificado pelo código IBGE de 7 dígitos, exceto o 
            registro especial Exterior (UF EX), que não tem IBGE e carrega o código 0 da 
            tabela oficial; esse 0 nunca é enviado ao IntegraNotas (para pessoa no exterior 
            o envio manda uf = EX e omite o código do município). Dado de referência 
            compartilhado:
             endereço de Empresa aponta para ele, e a Pessoa o referencia por cidade e UF 
            (relação cidade): a tela mostra cidade e UF e esconde o IBGE, que está direto 
            aqui.
             O par (nome, UF) é único, regra documentada e não expressa no mapa. O Municipio 
            é buscado por nome e UF. Todo registro tem código: o IBGE de 7 dígitos ou, no 
            Exterior, o 0.
             Vive no contexto cadastros (domain.cadastros). Há dependência mútua entre os 
            contextos configuracao e cadastros:
             a Empresa (configuracao) referencia o Municipio, e Pessoa e Servico (cadastros) 
            referenciam a Empresa.
             Municipio e Empresa devem ser modelados juntos.

    type: object
    required:
      - codigoIbge
      - nome
      - uf
      - id
      - dataCriacao
      - dataAtualizacao
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      codigoIbge:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            Código do município no IBGE, 7 dígitos numéricos (inclui o dígito verificador), 
            exceto o registro especial Exterior (UF EX),
             que não tem IBGE e carrega o código 0 da tabela oficial. Esse 0 nunca é enviado 
            ao IntegraNotas (para pessoa no exterior o envio manda uf = EX e omite o código 
            do município).
             É único: não há dois municípios com o mesmo código. Guardado como texto para 
            preservar o formato.

      nome:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Nome oficial do município, como publicado pelo IBGE. O registro Exterior tem o 
            nome Exterior (o nome do IBGE vem vazio no arquivo; decisão provisória do 
            usuário, a confirmar).

      uf:
        type: string
        maxLength: 2
        pattern: \w*\W*
        description: |
            Sigla da unidade federativa do município, com 2 letras maiúsculas (ex: SP). 
            Valem as 27 UFs do Brasil mais EX (exterior).

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID). O código IBGE é a chave de negócio; 
            este campo é a chave técnica.

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o município foi cadastrado no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.


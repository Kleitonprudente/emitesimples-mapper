swagger: '2.0'
info:
  version: v1
  title: Emitesimples API Usuários
  description: Contexto que depende de configuracao, com Usuario, VinculoUsuario, ClienteAcesso, TokenRenovacao e ConfirmacaoCadastro (a confirmação do signup por link de e-mail). Nenhum contexto anterior o referencia (a ImportacaoMunicipio, de cadastros, guarda só o idUsuario). Entre contextos a relação é sempre referência.
host: localhost:8080
securityDefinitions:
  usuarios_auth:
    type: oauth2
    tokenUrl: http://localhost:8080/token
    flow: application
    scopes:
      write: Permite modificar entidades na sua conta.
      read: Permite ler entidades na sua conta.
security:
  - usuarios_auth:
    - write
    - read
schemes:
  - https
basePath: /usuarios
tags:
- name: Usuario
  description: |
            Identidade de uma pessoa que entra no sistema. É global: uma pessoa pode ter 
            vínculo com várias empresas, por isso não tem tenantKey, e o isolamento por 
            empresa está no VinculoUsuario. Vive no contexto usuarios (domain.usuarios), que 
            depende de configuracao e cadastros.
             O e-mail é único no sistema inteiro (o mapa não expressa unicidade, ela é regra 
            de negócio e índice único no banco).
             NUNCA guarda a senha, só o hash. NUNCA guarda token.

- name: VinculoUsuario
  description: |
            Liga um Usuario a uma Empresa com um papel. É aqui que está o isolamento: o 
            usuário só enxerga as empresas em que tem vínculo ativo, e a empresa do token 
            vem daqui.
             Unicidade: um usuário tem no máximo um vínculo por empresa (par usuario, empresa 
            único).
             Papel para scopes: ADMINISTRADOR = consultar, preparar, emitir, cancelar; 
            OPERADOR = consultar, preparar, emitir e, SÓ se o administrador delegar 
            (podeCancelarNfse), cancelar; CONSULTA = consultar. Emitir e cancelar exigem 
            confirmação humana, regra de fluxo fora deste mapa.

- name: ClienteAcesso
  description: |
            Credencial de máquina para os agentes do próprio usuário (fase 1), vinculada a 
            uma única empresa. Troca clientId e segredo por um JWT de acesso com a claim da 
            empresa e os scopes permitidos. Vive no contexto usuarios (domain.usuarios), que 
            depende de configuracao e cadastros.
             Não é cliente OAuth de terceiros: registro dinâmico e consentimento ficam para a 
            fase 2.
             O clientId é único no sistema. NUNCA guarda o segredo, só o hash, e NUNCA guarda 
            token.

- name: TokenRenovacao
  description: |
            Registro do token de renovação do login, que permite um JWT de acesso curto. 
            Guarda só o hash do token e o estado, para rotação (cada uso gera um novo e 
            marca o anterior) e detecção de reuso (token já usado ou revogado reapresentado 
            derruba a sessão).
             NUNCA guarda o token, só o hash. O JWT de acesso não é guardado em lugar nenhum.

- name: ConfirmacaoCadastro
  description: |
            Confirmação do signup por link de e-mail. O link enviado ao usuário leva o 
            token; o sistema guarda SÓ o hash do token, nunca o token. Ao confirmar, a 
            empresa passa de PENDENTE_CONFIRMACAO para ATIVA e a dataConfirmacao dela é 
            preenchida.
             O endpoint de confirmação é PÚBLICO (o usuário ainda não tem sessão): esta 
            entidade NÃO deve ter recurso REST exposto, é regra da aplicação escrita à mão.

paths:

swagger: '2.0'
info:
  version: v1
  title: Emitesimples API Admin
  description: Contexto de administração e suporte da plataforma, que depende de configuracao (Empresa) e usuarios (Usuario); nenhum outro contexto o referencia. Reúne Plano, AssinaturaEmpresa, FaturaCrm e HistoricoSituacaoEmpresa. A cobrança é do CRM (PerfexCRM da Marke) e este sistema não processa pagamento. EM ABERTO: se o suporte é o mesmo papel do administrador da plataforma ou um papel separado, os limites do plano, como o CRM comunica as faturas e o log de sincronização com o CRM.
host: localhost:8080
securityDefinitions:
  admin_auth:
    type: oauth2
    tokenUrl: http://localhost:8080/token
    flow: application
    scopes:
      write: Permite modificar entidades na sua conta.
      read: Permite ler entidades na sua conta.
security:
  - admin_auth:
    - write
    - read
schemes:
  - https
basePath: /admin
tags:
- name: Plano
  description: |
            Catálogo de planos da plataforma, criado e mantido pelo suporte. É dado GLOBAL: 
            não pertence a uma empresa (sem tenant) e não tem ambiente. A cobrança é do CRM 
            (PerfexCRM da Marke): o valor é o que o CRM cobra, e este sistema não processa 
            pagamento. Um plano é desativado, nunca apagado.
             EM ABERTO: o que o plano limita (notas por mês, usuários) e se há período de 
            teste ainda não foi respondido pelo usuário, por isso nenhum limite foi 
            modelado. Os limites entram depois por migração. A periodicidade é PROVISÓRIA.

- name: AssinaturaEmpresa
  description: |
            Vínculo de uma empresa a um plano, feito pelo suporte. Não tem ambiente: herda a 
            situação da empresa.
             Regra da aplicação (o mapa não a expressa, e o banco a reforça com índice 
            parcial): no máximo UMA assinatura ativa por empresa. Trocar de plano encerra a 
            assinatura anterior (preenche dataFim) e cria outra; nada é apagado.
             A cobrança é do CRM: a assinatura é enviada ao CRM, e a referenciaCrm guarda o 
            id dela lá.

- name: FaturaCrm
  description: |
            Fatura RECEBIDA do CRM (PerfexCRM da Marke). É dado do CRM: só a sincronização a 
            escreve, e o usuário da empresa apenas LÊ as suas. Este sistema não processa 
            pagamento; o linkFatura leva a empresa a pagar no CRM. Não tem ambiente: herda a 
            situação da empresa.
             EM ABERTO: como o CRM se comunica com o sistema (webhook ou consulta periódica) 
            não foi definido. O estado é PROVISÓRIO: espelha o estado no CRM e o mapeamento 
            exato ainda não foi definido. O log de sincronização com o CRM não foi modelado; 
            é pendência.

- name: HistoricoSituacaoEmpresa
  description: |
            Auditoria de cada mudança da situação da conta da empresa. É IMUTÁVEL: o 
            registro nunca é editado nem apagado (regra da aplicação). Responde quem mudou, 
            quando e por quê. Não tem ambiente: herda a situação da empresa.
             Quando a mudança é automática, por exemplo a confirmação pelo link do e-mail, o 
            responsável fica vazio.


swagger: '2.0'
info:
  version: v1
  title: Emitesimples API Financeiro
  description: Contexto de contas a receber, contas a pagar, caixa/bancos e extrato (docs/financeiro). Depende só de configuracao (Empresa); nenhum outro contexto o referencia.
Fase 1: ContaFinanceira, CategoriaFinanceira, CondicaoPagamento, ConfiguracaoFinanceira (uma por empresa) e Banco (global, sem empresa). Fase 2: Titulo (contas a receber e a pagar). Fase 3: Movimento (livro de movimentos).
Titulo (Fase 2) e Movimento (livro imutável, Fase 3) não têm CRUD gerado: só serviços escritos à mão (pacote financeiroop) gravam neles.
Fase 6: LembreteCobranca e CobrancaEnviada (cobrança por e-mail). Fase 7: CredencialCobranca, CobrancaDestino (global, sem empresa) e Cobranca (boleto, Pix, link). Nenhuma tem CRUD gerado.
A pessoa do título é guardada como idPessoa (referência bruta, sem relação com cadastros), para o histórico sobreviver a mudanças no cadastro.
host: localhost:8080
securityDefinitions:
  financeiro_auth:
    type: oauth2
    tokenUrl: http://localhost:8080/token
    flow: application
    scopes:
      write: Permite modificar entidades na sua conta.
      read: Permite ler entidades na sua conta.
security:
  - financeiro_auth:
    - write
    - read
schemes:
  - https
basePath: /financeiro
tags:
- name: Banco
  description: |
            Banco do cadastro público do Banco Central. Dado de referência GLOBAL, 
            compartilhado por todas as empresas: não tem empresa nem RLS.
             A ContaFinanceira guarda só o código do banco (codigoBanco), que precisa existir 
            aqui.
             Regras documentadas e não expressas no mapa (docs/financeiro/README.md, F1-H5): 
            o código é único, sem zeros à esquerda.
             Mantido pelo administrador da plataforma; a carga pelo CSV do Banco Central (que 
            nunca apaga nem desmarca banco) está pendente.
             Vive no contexto financeiro (domain.financeiro).

- name: ContaFinanceira
  description: |
            Onde o dinheiro da empresa está: o caixa da loja, uma conta no banco ou uma 
            carteira digital. Cada movimento do livro (Fase 3) acontece em uma conta.
             O saldo NUNCA é guardado: é sempre calculado como saldo inicial mais a soma do 
            livro até a data.
             Regras documentadas e não expressas no mapa (docs/financeiro/README.md, F1-H1), 
            implementadas na migração e em listener à mão:
             o nome é único por empresa; o código do banco, quando informado, existe no 
            cadastro de Banco; a data do saldo inicial não é futura;
             cada forma tem no máximo uma conta padrão e, ao marcar outra, a anterior é 
            desmarcada na mesma transação;
             conta com movimentos tem saldo inicial e data travados (Fase 3). Nunca se apaga: 
            só se desativa. Escrita só do administrador da empresa.
             Vive no contexto financeiro (domain.financeiro), que referencia a Empresa 
            (configuracao).

- name: CategoriaFinanceira
  description: |
            Classifica receitas e despesas para relatórios. Hierarquia de UM nível: uma 
            categoria de topo (sem pai) agrupa filhas; o pai é só agrupador.
             Título, movimento avulso e categoria padrão da configuração só usam categoria 
            SEM filhas (folha). Nome exibido "Pai › Filha".
             Regras documentadas e não expressas no mapa (docs/financeiro/README.md, F1-H2), 
            implementadas na migração (trigger) e em listener à mão:
             nome único por empresa e tipo; o pai é da mesma empresa, do mesmo tipo, ativo e 
            de topo; ninguém é pai de si mesmo;
             quem tem filhas não vira filha nem muda de tipo; só vira pai a categoria fora de 
            uso (não é padrão da configuração e, nas Fases 2 e 3,
             não tem título nem movimento); inativar pai com filha ativa e ativar filha sob 
            pai inativo são recusados; as dicas perdem os sinais < e >.
             Nunca se apaga: só se desativa. Escrita só do administrador da empresa.

- name: CondicaoPagamento
  description: |
            Modelo de parcelamento reutilizável: forma, número de parcelas, dias até a 
            primeira parcela e intervalo entre as parcelas.
             Usada principalmente para gerar títulos a partir da nota fiscal (Fase 5). Não 
            existe condição padrão global: quem usa guarda a sua.
             Regras documentadas e não expressas no mapa (docs/financeiro/README.md, F1-H3), 
            implementadas na migração:
             nome único por empresa; parcelas de 1 a 48; intervalo e dias até a primeira 
            parcela de 0 a 365;
             receber na emissão só com 1 parcela e 0 dias, e exige conta padrão ativa da 
            forma (trigger).
             Nunca se apaga: só se desativa. Escrita só do administrador da empresa.

- name: ConfiguracaoFinanceira
  description: |
            Parâmetros do financeiro da empresa: multa, juros e carência dos atrasos, 
            lembretes de cobrança e os padrões que pré-preenchem o título novo.
             Uma linha por empresa, criada pelos padrões iniciais (POST 
            /api/financeiro/padroes); nunca se cria pelo CRUD (POST negado) e nunca se 
            apaga.
             Os padrões só pré-preenchem o formulário: a pessoa pode apagar.
             Regras documentadas e não expressas no mapa (docs/financeiro/README.md, F1-H4), 
            implementadas na migração:
             uma linha por empresa; multa e juros de 0 a 999,99; carência de 0 a 365 dias; 
            lembrete antes de 0 a 30 dias;
             lembretes depois com até 5 números de 1 ou 2 dígitos separados por vírgula; 
            categoria padrão ativa, do tipo certo e sem filhas (trigger).
             Escrita só do administrador da empresa.

- name: Titulo
  description: |
            A promessa de receber ou pagar um valor numa data: uma conta a receber ou a 
            pagar. Uma linha por parcela; as parcelas (ou recorrências)
             de um mesmo lançamento manual compartilham o idLancamento. O saldo (valor menos 
            quitado) e o "vencido" são calculados, nunca gravados.
             O título só muda de situação quando o livro de movimentos grava uma baixa (Fase 
            3) ou quando é cancelado.
             NÃO tem CRUD gerado: só os serviços escritos à mão (pacote financeiroop) gravam 
            aqui, com as regras de docs/financeiro/README.md (F2-H1 a F2-H6):
             parcelado e recorrente excludentes; rateio com o resíduo na última parcela; 
            pessoa com o papel certo; categoria ativa, do tipo certo e sem filhas;
             edição só em aberto ou parcial e valor só em título manual sem baixa; 
            cancelamento recusado com baixa.
             A pessoa é guardada como idPessoa (referência bruta), para o histórico 
            sobreviver a mudanças no cadastro. Nunca se apaga: cancela-se.
             Vive no contexto financeiro (domain.financeiro), que referencia a Empresa 
            (configuracao).

- name: Movimento
  description: |
            O livro de movimentos: o dinheiro de fato entrando ou saindo de uma conta numa 
            data (uma linha do extrato). O coração do financeiro.
             IMUTÁVEL: o banco recusa UPDATE e DELETE; erro se corrige com estorno (uma linha 
            nova, de sentido inverso). Não tem CRUD gerado:
             só o LivroDeMovimentos (pacote financeiroop) grava aqui (baixar, estornar, 
            lançar avulso, transferir), com as regras de
             docs/financeiro/README.md (F3-H1 a F3-H8). O valor é sempre maior que zero e o 
            sentido dá o sinal; numa linha de baixa,
             valor = quitado + juros + multa − desconto; numa linha sem título, as quatro são 
            zero. A data nunca é futura nem anterior à abertura da conta.
             O saldo de uma conta é sempre calculado: saldo inicial mais a soma do livro. 
            Vive no contexto financeiro (domain.financeiro).

- name: LembreteCobranca
  description: |
            Marca de que um lembrete automático de cobrança já saiu para um título 
            (docs/financeiro/README.md, 9.3, Fase 6; referência §9.1): cada aviso sai UMA 
            vez.
             O job diário (9h, por empresa, só com lembretesAtivos na configuração) grava 
            aqui antes de enviar; o índice único (título, tipo, dias) impede repetir.
             Não tem CRUD gerado: só o serviço de cobrança (financeiroop) grava. Vive no 
            contexto financeiro (domain.financeiro).

- name: CobrancaEnviada
  description: |
            Registro de cada cobrança por e-mail (manual ou lembrete) mandada a um cliente 
            (docs/financeiro/README.md, 9.3, Fase 6; referência §9.1).
             No máximo UMA por cliente por dia: o índice único (empresa, idPessoa, dia) 
            reserva o dia ANTES de mandar o e-mail; se o envio falha, a reserva é apagada.
             Não tem CRUD gerado: só o serviço de cobrança (financeiroop) grava. A pessoa é 
            guardada como idPessoa (como no Título).

- name: CredencialCobranca
  description: |
            Integração de uma conta financeira com um provedor de cobrança (boleto, Pix, 
            link): docs/financeiro/README.md, 9.5, Fase 7; referência §9.2.
             Uma por conta. O token e o segredo do webhook NUNCA ficam aqui: só a referência 
            ao cofre de segredos (SegredoService), como o token da Empresa.
             O sellerId é único no sistema inteiro: o dinheiro nunca pode cair na conta 
            errada. Não tem CRUD gerado: a tela de integração (financeiroop) grava.

- name: CobrancaDestino
  description: |
            Tabela GLOBAL (sem tenant) que acha a empresa quando o webhook do provedor chega 
            sem sessão (docs/financeiro/README.md, 9.5, Fase 7; referência §9.2).
             Guarda só o hash SHA-256 do segredo do webhook, nunca o segredo. O webhook só 
            identifica a cobrança: quem muda o estado é o sincronizador, que sempre consulta 
            o provedor.
             Não tem CRUD gerado: só a integração (financeiroop) grava.

- name: Cobranca
  description: |
            Uma cobrança gerada num provedor (boleto, Pix ou link de pagamento) para o saldo 
            de um título a receber (docs/financeiro/README.md, 9.5, Fase 7; referência 
            §9.2).
             UMA cobrança viva por título (índice parcial em CRIANDO, AGUARDANDO e INCERTA). 
            A chamada ao provedor fica FORA da transação e nunca é repetida sozinha: sem 
            resposta, INCERTA.
             Só o sincronizador muda o estado depois de criada; o pagamento dá a baixa pelo 
            livro (idempotente por idBaixaMovimento), excedente vira juros e a tarifa vira 
            saída avulsa.
             Não tem CRUD gerado: só os serviços da financeiroop gravam.


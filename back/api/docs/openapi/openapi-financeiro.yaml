  financeiro.Banco:
    description: |
            Banco do cadastro público do Banco Central. Dado de referência GLOBAL, 
            compartilhado por todas as empresas: não tem empresa nem RLS.
             A ContaFinanceira guarda só o código do banco (codigoBanco), que precisa existir 
            aqui.
             Regras documentadas e não expressas no mapa (docs/financeiro/README.md, F1-H5): 
            o código é único, sem zeros à esquerda.
             Mantido pelo administrador da plataforma; a carga pelo CSV do Banco Central (que 
            nunca apaga nem desmarca banco) está pendente.
             Vive no contexto financeiro (domain.financeiro).

    type: object
    required:
      - codigo
      - nome
      - participaCompe
      - integradoGateway
      - id
      - dataCriacao
      - dataAtualizacao
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      codigo:
        type: string
        maxLength: 4
        pattern: \w*\W*
        description: |
            Código do banco no Banco Central (COMPE), sem zeros à esquerda (ex.: 1, 341). 
            Único.

      ispb:
        type: string
        maxLength: 8
        pattern: \w*\W*
        description: |
            Identificador do banco no Sistema de Pagamentos Brasileiro, 8 dígitos.

      nome:
        type: string
        maxLength: 120
        pattern: \w*\W*
        description: |
            Nome reduzido do banco.

      nomeExtenso:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            Nome completo do banco no cadastro do Banco Central.

      participaCompe:
        type: boolean
        description: |
            Se o banco participa da compensação de cheques e boletos (COMPE).

      integradoGateway:
        type: boolean
        description: |
            Se o banco aceita cobrança pelo gateway de cobrança (Fase 7).

      urlPassoAPasso:
        type: string
        maxLength: 500
        pattern: \w*\W*
        description: |
            Link https de ajuda para integrar a cobrança deste banco. Opcional.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do banco (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o banco foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

  financeiro.ContaFinanceira:
    description: |
            Onde o dinheiro da empresa está: o caixa da loja, uma conta no banco ou uma 
            carteira digital. Cada movimento do livro (Fase 3) acontece em uma conta.
             O saldo NUNCA é guardado: é sempre calculado como saldo inicial mais a soma do 
            livro até a data.
             Regras documentadas e não expressas no mapa (docs/financeiro/README.md, F1-H1), 
            implementadas na migração e em listener à mão:
             o nome é único por empresa; o código do banco, quando informado, existe no 
            cadastro de Banco; a data do saldo inicial não é futura;
             cada forma tem no máximo uma conta padrão e, ao marcar outra, a anterior é 
            desmarcada na mesma transação;
             conta com movimentos tem saldo inicial e data travados (Fase 3). Nunca se apaga: 
            só se desativa. Escrita só do administrador da empresa.
             Vive no contexto financeiro (domain.financeiro), que referencia a Empresa 
            (configuracao).

    type: object
    required:
      - nome
      - tipo
      - ativo
      - saldoInicial
      - dataSaldoInicial
      - padraoDinheiro
      - padraoPix
      - padraoBoleto
      - padraoCartao
      - padraoTransferencia
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Nome da conta, único na empresa (ex.: Caixa, Banco do Brasil, Carteira Pix).

      tipo:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Tipo da conta: CAIXA, BANCO ou CARTEIRA. Valores documentados em values.

            Valores permitidos: 
              CAIXA
                 Valor: CAIXA
                 Texto: Caixa - Dinheiro em espécie guardado na empresa.
              BANCO
                 Valor: BANCO
                 Texto: Conta em banco - Conta corrente ou de pagamento em um banco; pode informar código do banco e agência.
              CARTEIRA
                 Valor: CARTEIRA
                 Texto: Carteira digital - Saldo em carteira digital ou maquininha.
        enum:
          - CAIXA
          - BANCO
          - CARTEIRA
      ativo:
        type: boolean
        description: |
            Conta inativa não recebe movimento novo ("A conta X está inativa."), mas 
            continua no histórico e no extrato.

      codigoBanco:
        type: string
        maxLength: 4
        pattern: \w*\W*
        description: |
            Código do banco no Banco Central, sem zeros à esquerda (ex.: 1, 341). Opcional; 
            quando informado, precisa existir no cadastro de Banco.

      agencia:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Agência bancária, só letras, números e hífen. Opcional.

      dadosDoBanco:
        type: string
        maxLength: 150
        pattern: \w*\W*
        description: |
            Texto livre com o número da conta, chave Pix etc., usado no "como pagar" do 
            e-mail de cobrança (Fase 6). Opcional.

      saldoInicial:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Saldo na data de abertura. Pode ser negativo (conta no cheque especial); teto de 
            R$ 999.999.999,99 para mais ou para menos.
             Travado quando a conta tiver movimentos (Fase 3).

      dataSaldoInicial:
        type: string
        format: date
        description: |
            Data de abertura da conta. Não pode ser futura; nenhum movimento pode ter data 
            anterior a ela. Travada quando a conta tiver movimentos (Fase 3).

      padraoDinheiro:
        type: boolean
        description: |
            Conta padrão da forma DINHEIRO. No máximo uma conta da empresa por forma; marcar 
            esta desmarca a anterior.

      padraoPix:
        type: boolean
        description: |
            Conta padrão da forma PIX. No máximo uma conta da empresa por forma; marcar esta 
            desmarca a anterior.

      padraoBoleto:
        type: boolean
        description: |
            Conta padrão da forma BOLETO. No máximo uma conta da empresa por forma; marcar 
            esta desmarca a anterior.

      padraoCartao:
        type: boolean
        description: |
            Conta padrão da forma CARTAO. No máximo uma conta da empresa por forma; marcar 
            esta desmarca a anterior.

      padraoTransferencia:
        type: boolean
        description: |
            Conta padrão da forma TRANSFERENCIA. No máximo uma conta da empresa por forma; 
            marcar esta desmarca a anterior.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da conta (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a conta foi cadastrada.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa dona desta conta e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  financeiro.CategoriaFinanceira:
    description: |
            Classifica receitas e despesas para relatórios. Hierarquia de UM nível: uma 
            categoria de topo (sem pai) agrupa filhas; o pai é só agrupador.
             Título, movimento avulso e categoria padrão da configuração só usam categoria 
            SEM filhas (folha). Nome exibido "Pai › Filha".
             Regras documentadas e não expressas no mapa (docs/financeiro/README.md, F1-H2), 
            implementadas na migração (trigger) e em listener à mão:
             nome único por empresa e tipo; o pai é da mesma empresa, do mesmo tipo, ativo e 
            de topo; ninguém é pai de si mesmo;
             quem tem filhas não vira filha nem muda de tipo; só vira pai a categoria fora de 
            uso (não é padrão da configuração e, nas Fases 2 e 3,
             não tem título nem movimento); inativar pai com filha ativa e ativar filha sob 
            pai inativo são recusados; as dicas perdem os sinais < e >.
             Nunca se apaga: só se desativa. Escrita só do administrador da empresa.

    type: object
    required:
      - nome
      - tipo
      - ativo
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Nome da categoria, único na empresa dentro do mesmo tipo (ex.: Aluguel, 
            Prestação de serviços).

      tipo:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            RECEITA ou DESPESA. Título a receber usa receita; título a pagar usa despesa. 
            Valores documentados em values.

            Valores permitidos: 
              RECEITA
                 Valor: RECEITA
                 Texto: Receita - Dinheiro que entra: classifica títulos a receber e entradas avulsas.
              DESPESA
                 Valor: DESPESA
                 Texto: Despesa - Dinheiro que sai: classifica títulos a pagar e saídas avulsas.
        enum:
          - RECEITA
          - DESPESA
      dicas:
        type: string
        maxLength: 500
        pattern: \w*\W*
        description: |
            Palavras separadas por vírgula, ponto e vírgula ou quebra de linha, usadas para 
            sugerir a categoria pela descrição do título.
             Os sinais < e > são removidos ao gravar. Não escreva dado pessoal. Opcional.

      ativo:
        type: boolean
        description: |
            Categoria inativa não pode ser escolhida em lançamento novo. Pai com filha ativa 
            não se inativa ("Inative as filhas antes.").

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da categoria (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a categoria foi cadastrada.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      categoriaPai:
        description: |
            Categoria de topo que agrupa esta. Vazio = categoria de topo. Mesma empresa, 
            mesmo tipo, ativa e sem pai; o pai não se apaga enquanto tiver filha.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona desta categoria e tenant do registro. Todo acesso é filtrado por 
            ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  financeiro.CondicaoPagamento:
    description: |
            Modelo de parcelamento reutilizável: forma, número de parcelas, dias até a 
            primeira parcela e intervalo entre as parcelas.
             Usada principalmente para gerar títulos a partir da nota fiscal (Fase 5). Não 
            existe condição padrão global: quem usa guarda a sua.
             Regras documentadas e não expressas no mapa (docs/financeiro/README.md, F1-H3), 
            implementadas na migração:
             nome único por empresa; parcelas de 1 a 48; intervalo e dias até a primeira 
            parcela de 0 a 365;
             receber na emissão só com 1 parcela e 0 dias, e exige conta padrão ativa da 
            forma (trigger).
             Nunca se apaga: só se desativa. Escrita só do administrador da empresa.

    type: object
    required:
      - nome
      - forma
      - ativo
      - parcelas
      - diasPrimeiroVencimento
      - intervaloDias
      - receberNaEmissao
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Nome da condição, único na empresa (ex.: Boleto 3x 30/60/90).

      forma:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Como o dinheiro entra: DINHEIRO, PIX, BOLETO, CARTAO ou TRANSFERENCIA. Vira a 
            forma prevista dos títulos gerados. Valores documentados em values.

            Valores permitidos: 
              DINHEIRO
                 Valor: DINHEIRO
                 Texto: Dinheiro - Pagamento em espécie.
              PIX
                 Valor: PIX
                 Texto: Pix - Pagamento instantâneo Pix.
              BOLETO
                 Valor: BOLETO
                 Texto: Boleto - Boleto bancário.
              CARTAO
                 Valor: CARTAO
                 Texto: Cartão - Cartão de crédito ou débito.
              TRANSFERENCIA
                 Valor: TRANSFERENCIA
                 Texto: Transferência - Transferência bancária (TED, DOC ou entre contas).
        enum:
          - DINHEIRO
          - PIX
          - BOLETO
          - CARTAO
          - TRANSFERENCIA
      ativo:
        type: boolean
        description: |
            Condição inativa não é oferecida em documento novo.

      parcelas:
        type: integer
        minimum: 0
        maximum: 99
        format: int32
        description: |
            Número de parcelas, de 1 a 48.

      diasPrimeiroVencimento:
        type: integer
        minimum: 0
        maximum: 999
        format: int32
        description: |
            Dias da data-base (emissão do documento) até o vencimento da primeira parcela, 
            de 0 a 365. 0 = à vista.

      intervaloDias:
        type: integer
        minimum: 0
        maximum: 999
        format: int32
        description: |
            Dias entre uma parcela e a próxima, de 0 a 365.

      receberNaEmissao:
        type: boolean
        description: |
            Já dá a baixa no ato (venda à vista), na conta padrão da forma. Só vale com 1 
            parcela e 0 dias, e exige conta padrão ativa da forma.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da condição (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a condição foi cadastrada.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa dona desta condição e tenant do registro. Todo acesso é filtrado por 
            ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  financeiro.ConfiguracaoFinanceira:
    description: |
            Parâmetros do financeiro da empresa: multa, juros e carência dos atrasos, 
            lembretes de cobrança e os padrões que pré-preenchem o título novo.
             Uma linha por empresa, criada pelos padrões iniciais (POST 
            /api/financeiro/padroes); nunca se cria pelo CRUD (POST negado) e nunca se 
            apaga.
             Os padrões só pré-preenchem o formulário: a pessoa pode apagar.
             Regras documentadas e não expressas no mapa (docs/financeiro/README.md, F1-H4), 
            implementadas na migração:
             uma linha por empresa; multa e juros de 0 a 999,99; carência de 0 a 365 dias; 
            lembrete antes de 0 a 30 dias;
             lembretes depois com até 5 números de 1 ou 2 dígitos separados por vírgula; 
            categoria padrão ativa, do tipo certo e sem filhas (trigger).
             Escrita só do administrador da empresa.

    type: object
    required:
      - multaPercentual
      - jurosMensalPercentual
      - carenciaDias
      - lembretesAtivos
      - lembreteDiasAntes
      - vencimentoPadraoDias
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      multaPercentual:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Multa única sobre o valor quitado com atraso, de 0 a 999,99. Padrão 2,00. O 
            título pode ter a sua.

      jurosMensalPercentual:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Juros simples ao mês (mês de 30 dias) sobre o valor quitado com atraso, de 0 a 
            999,99. Padrão 1,00. O título pode ter o seu.

      carenciaDias:
        type: integer
        minimum: 0
        maximum: 999
        format: int32
        description: |
            Até o vencimento mais estes dias não se cobra multa nem juros, de 0 a 365. 
            Padrão 2.

      lembretesAtivos:
        type: boolean
        description: |
            Liga os e-mails automáticos de cobrança (Fase 6). Desligado por padrão.

      lembreteDiasAntes:
        type: integer
        minimum: 0
        maximum: 99
        format: int32
        description: |
            Quantos dias antes do vencimento sai o lembrete, de 0 a 30. Padrão 3.

      lembreteDiasDepois:
        type: string
        maxLength: 40
        pattern: \w*\W*
        description: |
            Dias após o vencimento em que sai um lembrete: até 5 números de 1 ou 2 dígitos 
            separados por vírgula. Padrão "1,7,15".

      vencimentoPadraoDias:
        type: integer
        minimum: 0
        maximum: 999
        format: int32
        description: |
            Só no título a receber: pré-preenche o vencimento com hoje mais estes dias. 
            Padrão 0.

      observacaoPadraoReceber:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            Pré-preenche a observação (instruções de pagamento) do título a receber. 
            Opcional.

      formaPrevistaPadraoReceber:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Pré-preenche a forma prevista do título a receber: DINHEIRO, PIX, BOLETO, CARTAO 
            ou TRANSFERENCIA. Opcional. Valores documentados em values.

            Valores permitidos: 
              DINHEIRO
                 Valor: DINHEIRO
                 Texto: Dinheiro - Pagamento em espécie.
              PIX
                 Valor: PIX
                 Texto: Pix - Pagamento instantâneo Pix.
              BOLETO
                 Valor: BOLETO
                 Texto: Boleto - Boleto bancário.
              CARTAO
                 Valor: CARTAO
                 Texto: Cartão - Cartão de crédito ou débito.
              TRANSFERENCIA
                 Valor: TRANSFERENCIA
                 Texto: Transferência - Transferência bancária (TED, DOC ou entre contas).
        enum:
          - DINHEIRO
          - PIX
          - BOLETO
          - CARTAO
          - TRANSFERENCIA
      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da configuração (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a configuração foi criada.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      categoriaPadraoReceita:
        description: |
            Pré-preenche a categoria do título a receber. Ativa, do tipo RECEITA e sem 
            filhas. Opcional.

        allOf:
          - $ref: '#/definitions/IdReference'
      categoriaPadraoDespesa:
        description: |
            Pré-preenche a categoria do título a pagar. Ativa, do tipo DESPESA e sem filhas. 
            Opcional.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona desta configuração e tenant do registro (uma linha por empresa). 
            Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  financeiro.Titulo:
    description: |
            A promessa de receber ou pagar um valor numa data: uma conta a receber ou a 
            pagar. Uma linha por parcela; as parcelas (ou recorrências)
             de um mesmo lançamento manual compartilham o idLancamento. O saldo (valor menos 
            quitado) e o "vencido" são calculados, nunca gravados.
             O título só muda de situação quando o livro de movimentos grava uma baixa (Fase 
            3) ou quando é cancelado.
             NÃO tem CRUD gerado: só os serviços escritos à mão (pacote financeiroop) gravam 
            aqui, com as regras de docs/financeiro/README.md (F2-H1 a F2-H6):
             parcelado e recorrente excludentes; rateio com o resíduo na última parcela; 
            pessoa com o papel certo; categoria ativa, do tipo certo e sem filhas;
             edição só em aberto ou parcial e valor só em título manual sem baixa; 
            cancelamento recusado com baixa.
             A pessoa é guardada como idPessoa (referência bruta), para o histórico 
            sobreviver a mudanças no cadastro. Nunca se apaga: cancela-se.
             Vive no contexto financeiro (domain.financeiro), que referencia a Empresa 
            (configuracao).

    type: object
    required:
      - tipo
      - descricao
      - valor
      - quitado
      - vencimento
      - parcela
      - totalParcelas
      - origemTipo
      - situacao
      - paraRevisao
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipo:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            RECEBER (conta a receber, de um cliente) ou PAGAR (conta a pagar, a um 
            fornecedor). Não muda depois de lançado. Valores documentados em values.

            Valores permitidos: 
              RECEBER
                 Valor: RECEBER
                 Texto: A receber - Dinheiro que a empresa vai receber; a baixa é um recebimento (entrada) e usa categoria de receita.
              PAGAR
                 Valor: PAGAR
                 Texto: A pagar - Dinheiro que a empresa vai pagar; a baixa é um pagamento (saída) e usa categoria de despesa.
        enum:
          - RECEBER
          - PAGAR
      descricao:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            O que é a conta (ex.: Aluguel de março, Serviço de manutenção).

      observacao:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            Instruções de pagamento; vai impressa no boleto (Fase 7). Opcional.

      idPessoa:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do cliente (a receber) ou do fornecedor (a pagar) do cadastro de Pessoa, 
            guardado como referência bruta, sem relação,
             para o histórico sobreviver a mudanças no cadastro. Validado ao lançar: existe 
            na empresa e tem o papel certo. Opcional.

      valor:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor desta parcela, maior que zero e até R$ 999.999.999,99. Só muda em título 
            manual, aberto e sem baixa.

      quitado:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Quanto do valor já foi quitado pelas baixas, de zero até o valor. SÓ o livro de 
            movimentos altera (Fase 3).

      multaPercentual:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Sobrescreve a multa da configuração só para este título, de 0 a 999,99. Vazio = 
            a da configuração.

      jurosMensalPercentual:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Sobrescreve os juros da configuração só para este título, de 0 a 999,99. Vazio = 
            os da configuração.

      vencimento:
        type: string
        format: date
        description: |
            Data em que a parcela vence. Vencido = situação aberta ou parcial e vencimento 
            antes de hoje (fuso America/Sao_Paulo).

      formaPrevista:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Como se espera receber ou pagar: DINHEIRO, PIX, BOLETO, CARTAO ou TRANSFERENCIA. 
            Informativo (na Fase 7, boleto e Pix podem gerar cobrança). Opcional. Valores 
            documentados em values.

            Valores permitidos: 
              DINHEIRO
                 Valor: DINHEIRO
                 Texto: Dinheiro - Pagamento em espécie.
              PIX
                 Valor: PIX
                 Texto: Pix - Pagamento instantâneo Pix.
              BOLETO
                 Valor: BOLETO
                 Texto: Boleto - Boleto bancário.
              CARTAO
                 Valor: CARTAO
                 Texto: Cartão - Cartão de crédito ou débito.
              TRANSFERENCIA
                 Valor: TRANSFERENCIA
                 Texto: Transferência - Transferência bancária (TED, DOC ou entre contas).
        enum:
          - DINHEIRO
          - PIX
          - BOLETO
          - CARTAO
          - TRANSFERENCIA
      parcela:
        type: integer
        minimum: 0
        maximum: 99
        format: int32
        description: |
            Número desta parcela no lançamento, a partir de 1.

      totalParcelas:
        type: integer
        minimum: 0
        maximum: 99
        format: int32
        description: |
            Quantos títulos o lançamento gerou; nunca menor que a parcela. Exibido como 
            "2/3".

      idLancamento:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            UUID comum às parcelas (ou recorrências) geradas num mesmo lançamento. Acréscimo 
            à referência (decisão B1 de docs/financeiro).

      origemTipo:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            De onde o título veio: MANUAL (lançado à mão) ou NFSE (gerado pela nota fiscal, 
            Fase 5). Valores documentados em values.

            Valores permitidos: 
              MANUAL
                 Valor: MANUAL
                 Texto: Lançado à mão - Lançado por uma pessoa na tela ou pela API. Só título manual tem o valor editável.
              NFSE
                 Valor: NFSE
                 Texto: Nota fiscal de serviço - Gerado pela NFS-e autorizada (Fase 5); idOrigem e origemNumero identificam a nota.
        enum:
          - MANUAL
          - NFSE
      idOrigem:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do documento que gerou o título (ex.: a nota). Com ele, (empresa, origem, 
            documento, parcela) é único: o documento não gera duas vezes.

      origemNumero:
        type: string
        maxLength: 40
        pattern: \w*\W*
        description: |
            Número legível do documento de origem (ex.: número da nota).

      situacao:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            ABERTO (padrão), PARCIAL, PAGO ou CANCELADO. Muda pela baixa ou estorno no livro 
            (Fase 3) ou pelo cancelamento. Valores documentados em values.

            Valores permitidos: 
              ABERTO
                 Valor: ABERTO
                 Texto: Aberto - Nada quitado ainda. Aceita baixa e edição. Cor azul.
              PARCIAL
                 Valor: PARCIAL
                 Texto: Parcial - Parte do valor quitada. Aceita nova baixa e edição (menos o valor). Cor âmbar.
              PAGO
                 Valor: PAGO
                 Texto: Pago - Quitado por inteiro. Não aceita baixa nem edição; volta a aberto ou parcial só pelo estorno. Cor verde.
              CANCELADO
                 Valor: CANCELADO
                 Texto: Cancelado - Desistiu-se do título (sem baixa). Não aceita baixa nem edição. Cor cinza.
        enum:
          - ABERTO
          - PARCIAL
          - PAGO
          - CANCELADO
      paraRevisao:
        type: boolean
        description: |
            O documento de origem foi cancelado com o título já baixado: alguém precisa 
            decidir (estornar ou registrar devolução). Fase 5.

      canceladoEm:
        type: string
        format: date-time
        description: |
            Data e hora do cancelamento. Preenchida só com a situação CANCELADO.

      aprovadoEm:
        type: string
        format: date-time
        description: |
            Quando o título foi aprovado. Vazio = aguardando aprovação: não aceita baixa nem 
            entra em lembretes. Lançado por pessoa, nasce aprovado.

      idAprovadoPor:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do usuário que aprovou (referência bruta de auditoria, sem relação com o 
            contexto usuarios).

      idCriadoPor:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do usuário que lançou (referência bruta de auditoria, sem relação com o 
            contexto usuarios).

      idCriadoPorCliente:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do cliente de acesso (agente) que lançou o título, ou vazio quando foi uma 
            pessoa (referência bruta, CN-REL-002; docs/financeiro/README.md, 9.4, B3).
             Título de agente nasce sem aprovação: não aceita baixa até uma pessoa aprovar. 
            No máximo 20 rascunhos pendentes por usuário dono do agente.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do título (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o título foi lançado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      categoria:
        description: |
            Categoria do título: ativa, do tipo certo (a receber usa receita; a pagar, 
            despesa) e sem filhas. Opcional.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona deste título e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  financeiro.Movimento:
    description: |
            O livro de movimentos: o dinheiro de fato entrando ou saindo de uma conta numa 
            data (uma linha do extrato). O coração do financeiro.
             IMUTÁVEL: o banco recusa UPDATE e DELETE; erro se corrige com estorno (uma linha 
            nova, de sentido inverso). Não tem CRUD gerado:
             só o LivroDeMovimentos (pacote financeiroop) grava aqui (baixar, estornar, 
            lançar avulso, transferir), com as regras de
             docs/financeiro/README.md (F3-H1 a F3-H8). O valor é sempre maior que zero e o 
            sentido dá o sinal; numa linha de baixa,
             valor = quitado + juros + multa − desconto; numa linha sem título, as quatro são 
            zero. A data nunca é futura nem anterior à abertura da conta.
             O saldo de uma conta é sempre calculado: saldo inicial mais a soma do livro. 
            Vive no contexto financeiro (domain.financeiro).

    type: object
    required:
      - tipo
      - sentido
      - data
      - valor
      - quitado
      - juros
      - multa
      - desconto
      - id
      - dataCriacao
      - conta
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipo:
        type: string
        maxLength: 24
        pattern: \w*\W*
        description: |
            O que a linha é: baixa de título, dinheiro avulso, perna de transferência ou 
            estorno. Valores documentados em values.

            Valores permitidos: 
              RECEBIMENTO
                 Valor: RECEBIMENTO
                 Texto: Recebimento - Baixa de título a receber (entrada); sempre com título.
              PAGAMENTO
                 Valor: PAGAMENTO
                 Texto: Pagamento - Baixa de título a pagar (saída); sempre com título.
              ENTRADA_AVULSA
                 Valor: ENTRADA_AVULSA
                 Texto: Entrada avulsa - Dinheiro que entra sem título (ex.: aporte do sócio).
              SAIDA_AVULSA
                 Valor: SAIDA_AVULSA
                 Texto: Saída avulsa - Dinheiro que sai sem título (ex.: tarifa bancária).
              TRANSFERENCIA_ENTRADA
                 Valor: TRANSFERENCIA_ENTRADA
                 Texto: Transferência recebida - Perna de entrada de uma transferência entre contas; sempre com idTransferencia.
              TRANSFERENCIA_SAIDA
                 Valor: TRANSFERENCIA_SAIDA
                 Texto: Transferência enviada - Perna de saída de uma transferência entre contas; sempre com idTransferencia.
              ESTORNO
                 Valor: ESTORNO
                 Texto: Estorno - Anula uma linha anterior (idEstornoDe), com o sentido inverso e os mesmos valores. Não se estorna.
        enum:
          - RECEBIMENTO
          - PAGAMENTO
          - ENTRADA_AVULSA
          - SAIDA_AVULSA
          - TRANSFERENCIA_ENTRADA
          - TRANSFERENCIA_SAIDA
          - ESTORNO
      sentido:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            ENTRADA soma no saldo, SAIDA subtrai. Valores documentados em values.

            Valores permitidos: 
              ENTRADA
                 Valor: ENTRADA
                 Texto: Entrada - Dinheiro que entra na conta (sinal +).
              SAIDA
                 Valor: SAIDA
                 Texto: Saída - Dinheiro que sai da conta (sinal −).
        enum:
          - ENTRADA
          - SAIDA
      data:
        type: string
        format: date
        description: |
            Dia em que o dinheiro entrou ou saiu. Nunca futura (fuso America/Sao_Paulo) nem 
            anterior à data do saldo inicial da conta.

      descricao:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            Texto da linha no extrato (na baixa, a descrição do título; no estorno, 
            "Estorno: " e a original).

      forma:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Como o dinheiro entrou ou saiu: DINHEIRO, PIX, BOLETO, CARTAO ou TRANSFERENCIA. 
            Obrigatória na baixa; opcional no avulso. Valores documentados em values.

            Valores permitidos: 
              DINHEIRO
                 Valor: DINHEIRO
                 Texto: Dinheiro - Pagamento em espécie.
              PIX
                 Valor: PIX
                 Texto: Pix - Pagamento instantâneo Pix.
              BOLETO
                 Valor: BOLETO
                 Texto: Boleto - Boleto bancário.
              CARTAO
                 Valor: CARTAO
                 Texto: Cartão - Cartão de crédito ou débito.
              TRANSFERENCIA
                 Valor: TRANSFERENCIA
                 Texto: Transferência - Transferência bancária (TED, DOC ou entre contas).
        enum:
          - DINHEIRO
          - PIX
          - BOLETO
          - CARTAO
          - TRANSFERENCIA
      valor:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor da linha, sempre maior que zero (o sentido dá o sinal). Na baixa: quitado 
            + juros + multa − desconto.

      quitado:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Quanto do principal do título esta linha quitou. Zero em linha sem título.

      juros:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Juros cobrados ou pagos nesta baixa. Zero em linha sem título.

      multa:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Multa cobrada ou paga nesta baixa. Zero em linha sem título.

      desconto:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Desconto dado ou recebido nesta baixa; não pode zerar a baixa. Zero em linha sem 
            título.

      idLote:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            UUID comum às baixas feitas juntas numa baixa em lote.

      idTransferencia:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            UUID que liga as duas pernas de uma transferência entre contas (obrigatório 
            nelas).

      idEstornoDe:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            A linha que este estorno anula. Único: uma linha só se estorna uma vez.

      idCriadoPor:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do usuário que gravou a linha (referência bruta de auditoria, sem relação com 
            o contexto usuarios).

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do movimento (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a linha foi gravada. Não há data de atualização: a linha é 
            imutável.

      conta:
        description: |
            Conta onde o dinheiro entrou ou saiu, da mesma empresa (chave estrangeira 
            composta com a empresa). Ativa ao gravar.

        allOf:
          - $ref: '#/definitions/IdReference'
      titulo:
        description: |
            Título baixado por esta linha (obrigatório em recebimento e pagamento; no 
            estorno, o da linha anulada).

        allOf:
          - $ref: '#/definitions/IdReference'
      categoria:
        description: |
            Categoria da linha (no avulso, folha ativa do tipo certo; na baixa, a do 
            título). Opcional.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona desta linha e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  financeiro.LembreteCobranca:
    description: |
            Marca de que um lembrete automático de cobrança já saiu para um título 
            (docs/financeiro/README.md, 9.3, Fase 6; referência §9.1): cada aviso sai UMA 
            vez.
             O job diário (9h, por empresa, só com lembretesAtivos na configuração) grava 
            aqui antes de enviar; o índice único (título, tipo, dias) impede repetir.
             Não tem CRUD gerado: só o serviço de cobrança (financeiroop) grava. Vive no 
            contexto financeiro (domain.financeiro).

    type: object
    required:
      - tipo
      - dias
      - enviadoEm
      - id
      - dataCriacao
      - dataAtualizacao
      - titulo
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipo:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            ANTES (antes do vencimento) ou DEPOIS (atrasado). Valores documentados em 
            values.

            Valores permitidos: 
              ANTES
                 Valor: ANTES
                 Texto: Antes do vencimento - Aviso enviado lembreteDiasAntes dias antes do vencimento.
              DEPOIS
                 Valor: DEPOIS
                 Texto: Depois do vencimento - Aviso de atraso, em cada dia de lembreteDiasDepois.
        enum:
          - ANTES
          - DEPOIS
      dias:
        type: integer
        minimum: 0
        maximum: 99
        format: int32
        description: |
            Quantos dias antes ou depois do vencimento este aviso corresponde (0 a 99).

      enviadoEm:
        type: string
        format: date-time
        description: |
            Data e hora em que o lembrete saiu.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do lembrete (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi criado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      titulo:
        description: |
            Título lembrado.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona deste lembrete e tenant do registro. Todo acesso é filtrado por 
            ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  financeiro.CobrancaEnviada:
    description: |
            Registro de cada cobrança por e-mail (manual ou lembrete) mandada a um cliente 
            (docs/financeiro/README.md, 9.3, Fase 6; referência §9.1).
             No máximo UMA por cliente por dia: o índice único (empresa, idPessoa, dia) 
            reserva o dia ANTES de mandar o e-mail; se o envio falha, a reserva é apagada.
             Não tem CRUD gerado: só o serviço de cobrança (financeiroop) grava. A pessoa é 
            guardada como idPessoa (como no Título).

    type: object
    required:
      - idPessoa
      - origem
      - dia
      - email
      - enviadoEm
      - id
      - dataCriacao
      - dataAtualizacao
      - titulo
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      idPessoa:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id da pessoa cobrada (referência bruta, CN-REL-002, como no Título).

      origem:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            MANUAL (botão Enviar cobrança) ou LEMBRETE (job diário). Valores documentados em 
            values.

            Valores permitidos: 
              MANUAL
                 Valor: MANUAL
                 Texto: Manual - Enviada por uma pessoa pelo botão Enviar cobrança.
              LEMBRETE
                 Valor: LEMBRETE
                 Texto: Lembrete - Enviada pelo job diário de lembretes.
        enum:
          - MANUAL
          - LEMBRETE
      dia:
        type: string
        format: date
        description: |
            Dia (fuso de São Paulo) da cobrança; um por cliente.

      email:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            Endereço para onde o e-mail foi mandado (o da pessoa no momento do envio).

      enviadoEm:
        type: string
        format: date-time
        description: |
            Data e hora do envio.

      idEnviadoPor:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do usuário que mandou a cobrança manual; vazio no lembrete (referência de 
            auditoria, CN-REL-002).

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da cobrança enviada (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi criado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      titulo:
        description: |
            Título cobrado.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona desta cobrança e tenant do registro. Todo acesso é filtrado por 
            ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  financeiro.CredencialCobranca:
    description: |
            Integração de uma conta financeira com um provedor de cobrança (boleto, Pix, 
            link): docs/financeiro/README.md, 9.5, Fase 7; referência §9.2.
             Uma por conta. O token e o segredo do webhook NUNCA ficam aqui: só a referência 
            ao cofre de segredos (SegredoService), como o token da Empresa.
             O sellerId é único no sistema inteiro: o dinheiro nunca pode cair na conta 
            errada. Não tem CRUD gerado: a tela de integração (financeiroop) grava.

    type: object
    required:
      - provedor
      - sellerId
      - ativo
      - id
      - dataCriacao
      - dataAtualizacao
      - conta
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      provedor:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Provedor de cobrança. Por ora só FALSO (o adaptador de teste); cada provedor 
            real entra com o seu adaptador. Valores documentados em values.

            Valores permitidos: 
              FALSO
                 Valor: FALSO
                 Texto: Provedor de teste - GatewayFalso: responde na hora, sem chamar ninguém. Só para testes e homologação interna.
        enum:
          - FALSO
      endpoint:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            URL https da API do provedor (sandbox ou produção).

      sellerId:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Identificação da conta no provedor (seller, carteira). Única no sistema inteiro.

      referenciaToken:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Referência ao token da API no cofre de segredos. O token nunca vai para 
            entidade, resposta ou log.

      referenciaSegredoWebhook:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Referência ao segredo que autentica o webhook do provedor, no cofre de segredos.

      ativo:
        type: boolean
        description: |
            Integração ligada. Desligada, a conta não gera cobrança nova (as vivas seguem 
            sendo sincronizadas).

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da credencial (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi criado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      conta:
        description: |
            Conta financeira onde o dinheiro da cobrança cai. Uma credencial por conta.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona desta credencial e tenant do registro. Todo acesso é filtrado por 
            ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  financeiro.CobrancaDestino:
    description: |
            Tabela GLOBAL (sem tenant) que acha a empresa quando o webhook do provedor chega 
            sem sessão (docs/financeiro/README.md, 9.5, Fase 7; referência §9.2).
             Guarda só o hash SHA-256 do segredo do webhook, nunca o segredo. O webhook só 
            identifica a cobrança: quem muda o estado é o sincronizador, que sempre consulta 
            o provedor.
             Não tem CRUD gerado: só a integração (financeiroop) grava.

    type: object
    required:
      - idEmpresa
      - segredoHash
      - id
      - dataCriacao
      - dataAtualizacao
      - credencial
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      idEmpresa:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id da empresa dona da credencial (referência bruta: a tabela é global, sem RLS).

      segredoHash:
        type: string
        maxLength: 64
        pattern: \w*\W*
        description: |
            SHA-256 (hexadecimal) do segredo do webhook. Único.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do destino (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi criado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      credencial:
        description: |
            Credencial de cobrança deste destino.

        allOf:
          - $ref: '#/definitions/IdReference'
  financeiro.Cobranca:
    description: |
            Uma cobrança gerada num provedor (boleto, Pix ou link de pagamento) para o saldo 
            de um título a receber (docs/financeiro/README.md, 9.5, Fase 7; referência 
            §9.2).
             UMA cobrança viva por título (índice parcial em CRIANDO, AGUARDANDO e INCERTA). 
            A chamada ao provedor fica FORA da transação e nunca é repetida sozinha: sem 
            resposta, INCERTA.
             Só o sincronizador muda o estado depois de criada; o pagamento dá a baixa pelo 
            livro (idempotente por idBaixaMovimento), excedente vira juros e a tarifa vira 
            saída avulsa.
             Não tem CRUD gerado: só os serviços da financeiroop gravam.

    type: object
    required:
      - provedor
      - tipo
      - estado
      - valor
      - vencimento
      - id
      - dataCriacao
      - dataAtualizacao
      - titulo
      - conta
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      provedor:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Provedor que gerou a cobrança (o da credencial da conta, no momento).

      tipo:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            BOLETO, PIX ou LINK. Valores documentados em values.

            Valores permitidos: 
              BOLETO
                 Valor: BOLETO
                 Texto: Boleto - Vencimento de hoje em diante.
              PIX
                 Valor: PIX
                 Texto: Pix - Para pagar agora.
              LINK
                 Valor: LINK
                 Texto: Link de pagamento - Vale de 1 a 30 dias.
        enum:
          - BOLETO
          - PIX
          - LINK
      estado:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação da cobrança; viva = CRIANDO, AGUARDANDO ou INCERTA. Valores 
            documentados em values.

            Valores permitidos: 
              CRIANDO
                 Valor: CRIANDO
                 Texto: Gerando - Pedido ao provedor em andamento.
              AGUARDANDO
                 Valor: AGUARDANDO
                 Texto: Aguardando pagamento - Gerada no provedor; espera o pagamento.
              INCERTA
                 Valor: INCERTA
                 Texto: Confira no portal - A resposta do provedor se perdeu: nunca reenviar sem consultar.
              PAGA
                 Valor: PAGA
                 Texto: Paga - Pagamento confirmado; o título foi baixado pelo livro.
              PAGA_PARA_REVISAR
                 Valor: PAGA_PARA_REVISAR
                 Texto: Paga: revisar - Pagamento fora do esperado; não baixa sozinho.
              RECUSADA
                 Valor: RECUSADA
                 Texto: Recusada - O provedor recusou (motivo em português no campo motivo).
              CANCELADA
                 Valor: CANCELADA
                 Texto: Cancelada - Cancelada (título cancelado ou baixa estornada).
              EXPIRADA
                 Valor: EXPIRADA
                 Texto: Expirada - Venceu sem pagamento.
              DESCARTADA
                 Valor: DESCARTADA
                 Texto: Descartada - Descartada por uma pessoa (ex.: incerta conferida no portal).
        enum:
          - CRIANDO
          - AGUARDANDO
          - INCERTA
          - PAGA
          - PAGA_PARA_REVISAR
          - RECUSADA
          - CANCELADA
          - EXPIRADA
          - DESCARTADA
      valor:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor cobrado: o saldo do título na criação (maior que zero).

      vencimento:
        type: string
        format: date
        description: |
            Vencimento da cobrança.

      multaPercentual:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Multa por atraso, do título ou da configuração.

      jurosMensalPercentual:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Juros por atraso, do título ou da configuração.

      idExterno:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Identificador da cobrança no provedor. Único por empresa.

      linhaDigitavel:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Linha digitável do boleto.

      codigoDeBarras:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Código de barras do boleto.

      urlDoBoleto:
        type: string
        maxLength: 500
        pattern: \w*\W*
        description: |
            Link https do boleto (só https vira link na tela).

      pixCopiaECola:
        type: string
        maxLength: 500
        pattern: \w*\W*
        description: |
            Código Pix copia e cola.

      urlDoPix:
        type: string
        maxLength: 500
        pattern: \w*\W*
        description: |
            Link https do Pix.

      urlDoLink:
        type: string
        maxLength: 500
        pattern: \w*\W*
        description: |
            Link https de pagamento.

      pagoEm:
        type: string
        format: date-time
        description: |
            Quando o provedor confirmou o pagamento.

      valorPago:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor pago informado pelo provedor.

      meioPago:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Como foi pago (BOLETO, PIX, CARTAO), segundo o provedor.

      tarifa:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Tarifa do provedor. Vazio = o provedor não informou (nunca inventar).

      idBaixaMovimento:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do movimento de baixa gerado (idempotência; CN-REL-002).

      idTarifaMovimento:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do movimento da tarifa (saída avulsa em Tarifas; CN-REL-002).

      motivo:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            Frase nossa (português) da recusa, pelo código do provedor.

      respostaDoProvedor:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            Texto do provedor FILTRADO (sem CPF/CNPJ, e-mail, telefone, links). Nunca vai a 
            log.

      ultimaConsultaEm:
        type: string
        format: date-time
        description: |
            Última vez que o sincronizador consultou o provedor.

      idCriadoPor:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id do usuário que gerou (vazio na cobrança automática; CN-REL-002).

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da cobrança (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi criado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      titulo:
        description: |
            Título a receber cobrado.

        allOf:
          - $ref: '#/definitions/IdReference'
      conta:
        description: |
            Conta onde o dinheiro cai (a da credencial usada).

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona desta cobrança e tenant do registro. Todo acesso é filtrado por 
            ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.Empresa:
    description: |
            Empresa usuária do sistema e tenant do modelo. Cada empresa só emite e só 
            enxerga as próprias notas.
             NUNCA é apagada, só DESATIVADA (situacao = DESATIVADA): a aplicação não deve 
            expor a remoção. Nasce no signup com o documento, o e-mail e o WhatsApp 
            informados, em situacao PENDENTE_CONFIRMACAO, e fica ATIVA quando o usuário 
            clica no link do e-mail (ConfirmacaoCadastro).
             É identificada por um documento único (CNPJ ou CPF). Tem atividades 
            (AtividadeEmpresa) e quadro de sócios (QsaEmpresa) como detalhes ([m]/[o]).
             Regra de edição, da aplicação: o usuário da empresa só altera razaoSocial, 
            nomeFantasia e o endereço; o resto é alterável só pelo administrador da 
            plataforma ou suporte. É cadastrada no gateway IntegraNotas, onde se chama 
            "emitente", e o gateway devolve o token do emitente,
             separado por ambiente. Token, credenciais da prefeitura e certificado ficam no 
            cofre, aqui só há referência.
             Vive no contexto configuracao (domain.configuracao), sozinha. Há dependência 
            mútua com o contexto cadastros: a Empresa referencia o Municipio (cadastros), e 
            Pessoa e Servico (cadastros) referenciam a Empresa. Empresa e Municipio devem 
            ser modelados juntos.

    type: object
    required:
      - nomeFantasia
      - razaoSocial
      - documento
      - email
      - whatsapp
      - telefone
      - logradouro
      - numeroEndereco
      - bairro
      - cep
      - regimeTributario
      - situacao
      - nfseHabilitada
      - ultimoNumeroNfse
      - statusCadastro
      - situacaoCertificado
      - id
      - ambiente
      - dataCriacao
      - dataAtualizacao
      - municipio
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nomeFantasia:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Nome fantasia da empresa, de 2 a 60 caracteres (campo nome do cadastro no 
            gateway). Alterável pelo usuário da empresa.

      razaoSocial:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Razão social da empresa, de 2 a 60 caracteres (campo razao do cadastro no 
            gateway). Alterável pelo usuário da empresa.

      documento:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Documento da empresa, só dígitos, sem formatação: 14 dígitos é CNPJ e 11 dígitos 
            é CPF. É um ou outro, nunca os dois.
             No cadastro no gateway e no envio ao IntegraNotas o sistema o separa em cnpj ou 
            cpf conforme o tamanho. CPF é dado pessoal, sujeito a mascaramento nas 
            respostas. Obrigatório.
             Único por ambiente (o mesmo documento tem um registro por ambiente). Alterável 
            só pelo administrador da plataforma ou suporte.

      rgInscricaoEstadual:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Inscrição estadual da empresa, até 20 caracteres. Mesmo nome do campo da Pessoa. 
            Opcional. Alterável só pelo administrador da plataforma ou suporte.

      inscricaoMunicipal:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Inscrição municipal da empresa, de 1 a 20 caracteres (campo im do gateway). 
            Opcional. Alterável só pelo administrador da plataforma ou suporte.

      email:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            E-mail da empresa, até 60 caracteres. Obrigatório: várias integrações exigem 
            (IntegraNotas, bancos para boleto e PIX). É o e-mail informado no signup. 
            Alterável só pelo administrador da plataforma ou suporte.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            WhatsApp da empresa, até 20 caracteres. Obrigatório: necessário em cadastros de 
            integração como IntegraNotas e bancos para boleto e PIX. É o WhatsApp informado 
            no signup. Alterável só pelo administrador da plataforma ou suporte.

      telefone:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Telefone da empresa, de 6 a 14 dígitos, só números. Alterável só pelo 
            administrador da plataforma ou suporte.

      logradouro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Rua, avenida ou similar do endereço da empresa, de 1 a 60 caracteres (campo rua 
            do gateway). Alterável pelo usuário da empresa.

      numeroEndereco:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Número do imóvel, de 1 a 60 caracteres, texto porque aceita S/N (campo numero do 
            gateway). Alterável pelo usuário da empresa.

      complemento:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Complemento do endereço, até 60 caracteres. Opcional. Alterável pelo usuário da 
            empresa.

      bairro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Bairro do endereço, de 2 a 60 caracteres. Alterável pelo usuário da empresa.

      cep:
        type: string
        maxLength: 8
        pattern: \w*\W*
        description: |
            CEP do endereço, exatamente 8 dígitos sem hífen. Guardado como texto para 
            preservar zeros à esquerda. Alterável pelo usuário da empresa.

      regimeTributario:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime tributário da empresa (campo crt do gateway). Define o enquadramento 
            usado na emissão. Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              SIMPLES_NACIONAL
                 Valor: 1
                 Texto: Simples Nacional - Empresa optante pelo Simples Nacional. Código gravado e enviado ao gateway (crt): 1.
              SIMPLES_EXCESSO_SUBLIMITE
                 Valor: 2
                 Texto: Simples Nacional com excesso de sublimite - Simples Nacional com excesso de sublimite de receita. Código gravado e enviado ao gateway (crt): 2.
              REGIME_NORMAL
                 Valor: 3
                 Texto: Regime Normal - Empresa no regime normal (lucro presumido ou real). Código gravado e enviado ao gateway (crt): 3.
              MEI
                 Valor: 4
                 Texto: MEI - Microempreendedor Individual. Código gravado e enviado ao gateway (crt): 4.
      regimeIbsCbs:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime de apuração do IBS e da CBS da empresa (campo regime_cibs do gateway), de 
            0 a 4. Opcional por decisão do usuário.
             O valor 0 significa não informado e a tag não é enviada. Alterável só pelo 
            administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_INFORMADO
                 Valor: 0
                 Texto: Não informado - Não informado, padrão: a tag regime_cibs não é enviada. Código gravado: 0.
              SIMPLES_OPCAO_REGIME_REGULAR
                 Valor: 1
                 Texto: Simples Nacional com opção pelo regime regular - Simples Nacional com opção pelo regime regular do IBS e da CBS (crt 1 ou 2). Código gravado e enviado ao gateway: 1.
              NORMAL_OPCAO_SIMPLES_PENDENTE_SEM_REGULAR
                 Valor: 2
                 Texto: Regime Normal, opção pelo Simples pendente, sem regime regular - Regime Normal com opção pendente pelo Simples Nacional, sem regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 2.
              NORMAL_SUBLIMITE_PENDENTE_SEM_REGULAR
                 Valor: 3
                 Texto: Regime Normal, excesso de sublimite pendente, sem regime regular - Regime Normal com opção pendente pelo Simples Nacional com excesso de sublimite, sem regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 3.
              NORMAL_OPCAO_SIMPLES_PENDENTE_COM_REGULAR
                 Valor: 4
                 Texto: Regime Normal, opção pelo Simples pendente, com regime regular - Regime Normal com opção pendente pelo Simples Nacional, com regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 4.
      logo:
        type: string
        format: byte
        description: |
            Logotipo da empresa, imagem JPG ou PNG proporcional (como 100x100) de até 1 MB. 
            Opcional, enviado ao gateway em Base64. Alterável só pelo administrador da 
            plataforma ou suporte.

      urlWebhook:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            URL pública, de 1 a 200 caracteres, que recebe as notificações do gateway. 
            Registrada no cadastro da empresa no gateway
             e só aceita se responder HTTP 200. Opcional. Alterável só pelo administrador da 
            plataforma ou suporte.

      situacao:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação da conta da empresa NO SISTEMA (não confundir com statusCadastro, que é 
            o cadastro no gateway IntegraNotas). A empresa nasce PENDENTE_CONFIRMACAO no 
            signup,
             vira ATIVA quando o usuário clica no link do e-mail (ou quando o suporte ativa) 
            e DESATIVADA quando o suporte a desativa à mão. Nunca é apagada. Alterável só 
            pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              PENDENTE_CONFIRMACAO
                 Valor: PENDENTE_CONFIRMACAO
                 Texto: Pendente de confirmação - Estado inicial e padrão: a empresa nasce assim no signup, aguardando o clique no link de confirmação enviado por e-mail.
              ATIVA
                 Valor: ATIVA
                 Texto: Ativa - Conta ativa, depois do clique no link do e-mail ou quando o suporte a ativa.
              DESATIVADA
                 Valor: DESATIVADA
                 Texto: Desativada - Conta desativada à mão pelo suporte, com motivo obrigatório. A empresa nunca é apagada.
        enum:
          - PENDENTE_CONFIRMACAO
          - ATIVA
          - DESATIVADA
      dataConfirmacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o usuário confirmou o cadastro pelo link do e-mail. Vazia 
            enquanto pendente. Alterável só pelo administrador da plataforma ou suporte.

      referenciaCrm:
        type: string
        maxLength: 50
        pattern: \w*\W*
        description: |
            Identificador desta empresa como cliente no CRM da Marke. A cobrança é do CRM, 
            este sistema não processa pagamento. Opcional. Alterável só pelo administrador 
            da plataforma ou suporte.

      nfseHabilitada:
        type: boolean
        description: |
            Indica se a empresa habilitou a emissão de NFS-e. Ao habilitar, o sistema 
            cadastra o emitente no IntegraNotas (webhook e token do emitente, guardado no 
            cofre) e, se já houver certificado, envia-o. Padrão não (false). Alterável pelo 
            administrador da empresa e pela plataforma.

      serieNfse:
        type: string
        maxLength: 5
        pattern: \w*\W*
        description: |
            Série da DPS usada nas notas desta empresa, 1 a 5 dígitos. Informada ao 
            habilitar a emissão. Vai no campo serie do envio.

      ultimoNumeroNfse:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Último número da DPS já utilizado pela empresa (0 se nunca emitiu). O próximo 
            número é este mais 1, e o sistema o incrementa de forma atômica a cada nota. 
            Informado ao habilitar a emissão, para continuar a numeração de outro emissor. 
            Até 9 dígitos.

      statusCadastro:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação do cadastro da empresa NO GATEWAY (emitente no IntegraNotas), no 
            ambiente do registro. Não é a situação da conta no sistema (ver situacao). A 
            empresa nasce NAO_CADASTRADO,
             vira CADASTRADO quando o gateway devolve o token, e ERRO quando o cadastro é 
            recusado. Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_CADASTRADO
                 Valor: NAO_CADASTRADO
                 Texto: Não cadastrado - A empresa ainda não foi cadastrada no gateway. É o estado inicial e o padrão.
              CADASTRADO
                 Valor: CADASTRADO
                 Texto: Cadastrado - Cadastro aceito pelo gateway, que devolveu o token do emitente (nome no IntegraNotas), guardado no cofre.
              ERRO
                 Valor: ERRO
                 Texto: Erro no cadastro - Cadastro recusado pelo gateway.
        enum:
          - NAO_CADASTRADO
          - CADASTRADO
          - ERRO
      dataCadastroGateway:
        type: string
        format: date-time
        description: |
            Data e hora em que o gateway aceitou o cadastro e devolveu o token. Vazia 
            enquanto não cadastrado. Alterável só pelo administrador da plataforma ou 
            suporte.

      validadeCertificado:
        type: string
        format: date
        description: |
            Data de validade do certificado digital enviado ao gateway. Vazia enquanto não 
            houver certificado. Alterável só pelo administrador da plataforma ou suporte.

      situacaoCertificado:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação do certificado digital da empresa no gateway, no ambiente do registro. 
            Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_ENVIADO
                 Valor: NAO_ENVIADO
                 Texto: Não enviado - Nenhum certificado foi enviado ao gateway. É o estado inicial e o padrão.
              VALIDO
                 Valor: VALIDO
                 Texto: Válido - Certificado aceito pelo gateway e dentro da validade.
              VENCIDO
                 Valor: VENCIDO
                 Texto: Vencido - Certificado com a validade vencida (erro 5011 do gateway).
              INVALIDO
                 Valor: INVALIDO
                 Texto: Inválido - Certificado corrompido ou enviado com senha errada (erro 5003 do gateway).
              NAO_PERTENCE
                 Valor: NAO_PERTENCE
                 Texto: Não pertence à empresa - Certificado que não pertence ao documento (CNPJ ou CPF) da empresa (erro 5029 do gateway).
        enum:
          - NAO_ENVIADO
          - VALIDO
          - VENCIDO
          - INVALIDO
          - NAO_PERTENCE
      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da empresa (UUID). Também é o identificador do tenant, 
            usado como chave de escopo
             da própria empresa (tenantKey) e referenciado pelo tenantKey das demais 
            entidades.

      ambiente:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Ambiente do gateway a que este registro pertence. Empresa (emitente no 
            IntegraNotas) e token são independentes por ambiente,
             então o mesmo documento (CNPJ ou CPF) tem um registro por ambiente e uma nota de 
            teste nunca se mistura com uma real.

            Valores permitidos: 
              HOMOLOGACAO
                 Valor: HOMOLOGACAO
                 Texto: Homologação - Ambiente de testes do gateway. É o padrão. Nada emitido aqui tem validade fiscal e uma nota de teste nunca se mistura com uma real.
              PRODUCAO
                 Valor: PRODUCAO
                 Texto: Produção - Ambiente real do gateway. As notas emitidas aqui têm validade fiscal.
        enum:
          - HOMOLOGACAO
          - PRODUCAO
      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a empresa foi cadastrada no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      atividades:
        type: array
        items:
          $ref: '#/definitions/configuracao.AtividadeEmpresa'
        description: |
            Atividades econômicas (CNAE) da empresa: uma principal e várias secundárias. Só 
            existem dentro da empresa, no mesmo contexto. Alterável só pelo administrador da 
            plataforma ou suporte.

      qsa:
        type: array
        items:
          $ref: '#/definitions/configuracao.QsaEmpresa'
        description: |
            Quadro de sócios e administradores (QSA) da empresa, com vários itens. Só existe 
            dentro da empresa, no mesmo contexto. Alterável só pelo administrador da 
            plataforma ou suporte.

      municipio:
        description: |
            Município do endereço da empresa. Traz código IBGE, nome e UF, que não se 
            repetem aqui (campos cmun, municipio e uf do gateway). A empresa não pode usar o 
            registro Exterior (regra da aplicação). Alterável pelo usuário da empresa.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.AtividadeEmpresa:
    description: |
            Atividade econômica (CNAE) de uma Empresa, com tipo, código CNAE e descrição. 
            Uma empresa tem uma atividade principal e várias secundárias. A regra de no 
            máximo uma principal por empresa é da aplicação.
             Existe só dentro da empresa e no mesmo contexto, por isso é detalhe da Empresa 
            ([m]/[o]). O tenant é a própria empresa. Não tem ambiente: herda o da Empresa.
             Vive no contexto configuracao (domain.configuracao).

    type: object
    required:
      - tipo
      - codigoCnae
      - descricao
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipo:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Se a atividade é a principal ou uma secundária da empresa. No máximo uma 
            principal por empresa (regra da aplicação). Obrigatório.

            Valores permitidos: 
              PRINCIPAL
                 Valor: PRINCIPAL
                 Texto: Principal - Atividade econômica principal da empresa. No máximo uma por empresa (regra da aplicação).
              SECUNDARIA
                 Valor: SECUNDARIA
                 Texto: Secundária - Atividade econômica secundária da empresa. Uma empresa pode ter várias.
        enum:
          - PRINCIPAL
          - SECUNDARIA
      codigoCnae:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            Código CNAE da atividade, 7 dígitos, só números, sem formatação. Guardado como 
            texto para preservar zeros à esquerda. Obrigatório.

      descricao:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Descrição da atividade conforme a tabela CNAE, até 300 caracteres. Obrigatório.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da atividade (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a atividade foi cadastrada.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa a quem a atividade pertence e tenant do registro. Apagar a empresa apaga 
            suas atividades. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.QsaEmpresa:
    description: |
            Item do quadro de sócios e administradores (QSA) de uma Empresa, com nome, CPF, 
            qualificação e data de entrada na sociedade. Uma empresa tem vários.
             Existe só dentro da empresa e no mesmo contexto, por isso é detalhe da Empresa 
            ([m]/[o]). O tenant é a própria empresa. Não tem ambiente: herda o da Empresa.
             Vive no contexto configuracao (domain.configuracao).

    type: object
    required:
      - nome
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome do sócio ou administrador. Obrigatório.

      cpf:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            CPF do sócio, opcional. NÃO se valida como 11 dígitos: a consulta pública de 
            CNPJ pode devolver o CPF do sócio mascarado (a confirmar ao ler a API), então o 
            valor é guardado como veio, até 14 caracteres.
             Dado pessoal, sujeito a mascaramento nas respostas.

      qualificacao:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Qualificação do sócio na sociedade, como Sócio-Administrador, até 100 
            caracteres. Opcional.

      dataEntradaSociedade:
        type: string
        format: date
        description: |
            Data em que o sócio entrou na sociedade. Opcional.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do item do QSA (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o item foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa a quem o sócio pertence e tenant do registro. Apagar a empresa apaga seu 
            QSA. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  cadastros.Municipio:
    description: |
            Município brasileiro identificado pelo código IBGE de 7 dígitos, exceto o 
            registro especial Exterior (UF EX), que não tem IBGE e carrega o código 0 da 
            tabela oficial; esse 0 nunca é enviado ao IntegraNotas (para pessoa no exterior 
            o envio manda uf = EX e omite o código do município). Dado de referência 
            compartilhado:
             endereço de Empresa aponta para ele, e a Pessoa o referencia por cidade e UF 
            (relação cidade): a tela mostra cidade e UF e esconde o IBGE, que está direto 
            aqui.
             O par (nome, UF) é único, regra documentada e não expressa no mapa. O Municipio 
            é buscado por nome e UF. Todo registro tem código: o IBGE de 7 dígitos ou, no 
            Exterior, o 0.
             Vive no contexto cadastros (domain.cadastros). Há dependência mútua entre os 
            contextos configuracao e cadastros:
             a Empresa (configuracao) referencia o Municipio, e Pessoa e Servico (cadastros) 
            referenciam a Empresa.
             Municipio e Empresa devem ser modelados juntos.

    type: object
    required:
      - codigoIbge
      - nome
      - uf
      - id
      - dataCriacao
      - dataAtualizacao
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      codigoIbge:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            Código do município no IBGE, 7 dígitos numéricos (inclui o dígito verificador), 
            exceto o registro especial Exterior (UF EX),
             que não tem IBGE e carrega o código 0 da tabela oficial. Esse 0 nunca é enviado 
            ao IntegraNotas (para pessoa no exterior o envio manda uf = EX e omite o código 
            do município).
             É único: não há dois municípios com o mesmo código. Guardado como texto para 
            preservar o formato.

      nome:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Nome oficial do município, como publicado pelo IBGE. O registro Exterior tem o 
            nome Exterior (o nome do IBGE vem vazio no arquivo; decisão provisória do 
            usuário, a confirmar).

      uf:
        type: string
        maxLength: 2
        pattern: \w*\W*
        description: |
            Sigla da unidade federativa do município, com 2 letras maiúsculas (ex: SP). 
            Valem as 27 UFs do Brasil mais EX (exterior).

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID). O código IBGE é a chave de negócio; 
            este campo é a chave técnica.

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o município foi cadastrado no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.


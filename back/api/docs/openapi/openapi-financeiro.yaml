  /Banco/{from}/{to}:
    get:
      operationId: "Banco_listRange"
      summary: Lista os registros de Banco por faixa de posição.
      description: |
          Observar que a faixa inicia em 0 e o limite máximo é de 100 itens retornados total.
          Deve ser usado em conjunto com o count para determinar qtos itens tem no total, e no seu aplicativo fazer o controle de paginas.
          Por exemplo, ao usar um determinado filtro o count retorna o valor de 240 itens, e no seu aplicativo usa 20 itens por pagina:
          A primeira pagina vai ser from = 0 e o to = 19
          A segunda pagina vai ser from = 20 e o to = 39
          e assim sucessivamente até ler toda a lista.
          ATENÇÃO para usar o mesmo filtro (query parameters) no count e no listRange para evitar divergencia no tamanho da lista, lembrando que a lista pode aumentar caso novos registros sejam inseridos no banco, durante a leitura paginada.
      tags:
        - Banco
      parameters:
      - name: "from"
        in: "path"
        required: true
        type: "integer"
      - name: "to"
        in: "path"
        required: true
        type: "integer"
      - name: "sortBy"
        in: "query"
        description: "Campo para ordenação"
        type: string
      - name: "sortDirection"
        in: "query"
        description: "Direção da ordenação (asc ou desc)"
        type: string
        enum:
          - asc
          - desc
        default: "asc"
      - name: "codigo"
        in: "query"
        description: "Filtra registros por codigo"
        type: string
      - name: "ispb"
        in: "query"
        description: "Filtra registros por ispb"
        type: string
      - name: "nome"
        in: "query"
        description: "Filtra registros por nome"
        type: string
      - name: "nomeExtenso"
        in: "query"
        description: "Filtra registros por nomeExtenso"
        type: string
      - name: "participaCompe"
        in: "query"
        description: "Filtra registros por participaCompe"
        type: boolean
      - name: "integradoGateway"
        in: "query"
        description: "Filtra registros por integradoGateway"
        type: boolean
      - name: "urlPassoAPasso"
        in: "query"
        description: "Filtra registros por urlPassoAPasso"
        type: string
      - name: "id"
        in: "query"
        description: "Filtra registros por id"
        type: string
      - name: "version"
        in: "query"
        description: "Filtra registros por versão"
        type: integer
      produces:
      - "application/json"
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/financeiro.Banco'
        '400':
          description: "A requisição foi malformada, omitindo atributos obrigatórios, seja no payload ou através de atributos na URL."
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: "Cabeçalho de autenticação ausente/inválido ou token inválido"
          schema:
            $ref: '#/definitions/ErrorResponse'
        '403':
          description: "O token tem escopo incorreto ou uma política de segurança foi violada"
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: "O recurso solicitado não existe ou não foi implementado"
          schema:
            $ref: '#/definitions/ErrorResponse'
        '405':
          description: "O consumidor tentou acessar o recurso com um método não suportado"
          schema:
            $ref: '#/definitions/ErrorResponse'
        '406':
          description: "A solicitação continha um cabeçalho Accept diferente dos tipos de mídia permitidos ou um conjunto de caracteres diferente de UTF-8"
          schema:
            $ref: '#/definitions/ErrorResponse'
        '422':

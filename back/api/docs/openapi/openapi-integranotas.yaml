        format: double
  integranotas.ChamadaGateway:
    description: |
            Registro de auditoria de cada chamada que o sistema faz ao IntegraNotas, para 
            operar e depurar. Guarda operação, método, rota, versão da API, códigos de 
            retorno, mensagem, duração e a chave da nota.
             A versão da API é por operação: o envio da nota usa v2, a consulta e o 
            cancelamento usam v1.
             NUNCA guarda token, senha, corpo com segredos, XML ou PDF. Guarda só um resumo 
            seguro do que foi enviado (campo resumoEnvio, sem dado pessoal, sem segredo e 
            sem documento).

    type: object
    required:
      - operacao
      - metodoHttp
      - rota
      - versaoApi
      - dataChamada
      - id
      - ambiente
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      operacao:
        type: string
        maxLength: 30
        pattern: \w*\W*
        description: |
            Operação de negócio que motivou a chamada ao gateway.

            Valores permitidos: 
              EMITIR
                 Valor: EMITIR
                 Texto: Emitir nota - Envio da nota ao gateway para emissão (API v2). Só ocorre depois da aprovação de uma pessoa.
              CONSULTAR
                 Valor: CONSULTAR
                 Texto: Consultar nota - Consulta da situação e do retorno de uma nota no gateway, pela chave (API v1).
              CANCELAR
                 Valor: CANCELAR
                 Texto: Cancelar nota - Pedido de cancelamento de uma nota autorizada ao gateway (API v1). Só ocorre depois da aprovação de uma pessoa.
              CADASTRAR_EMITENTE
                 Valor: CADASTRAR_EMITENTE
                 Texto: Cadastrar emitente - Cadastro da empresa como emitente no gateway, que devolve o token do emitente (guardado no cofre).
              ENVIAR_CERTIFICADO
                 Valor: ENVIAR_CERTIFICADO
                 Texto: Enviar certificado digital - Envio do certificado digital da empresa ao gateway. Arquivo e senha nunca são gravados no registro da chamada.
              OUTRA
                 Valor: OUTRA
                 Texto: Outra operação - Qualquer chamada ao gateway que não seja uma das operações acima.
        enum:
          - EMITIR
          - CONSULTAR
          - CANCELAR
          - CADASTRAR_EMITENTE
          - ENVIAR_CERTIFICADO
          - OUTRA
      metodoHttp:
        type: string
        maxLength: 7
        pattern: \w*\W*
        description: |
            Método HTTP da chamada.

            Valores permitidos: 
              GET
                 Valor: GET
                 Texto: GET - Método HTTP GET, de leitura. Usado nas consultas ao gateway.
              POST
                 Valor: POST
                 Texto: POST - Método HTTP POST, de criação ou envio. Usado, por exemplo, no envio da nota e no cadastro do emitente.
              PUT
                 Valor: PUT
                 Texto: PUT - Método HTTP PUT, de substituição ou atualização.
              DELETE
                 Valor: DELETE
                 Texto: DELETE - Método HTTP DELETE, de remoção.
        enum:
          - GET
          - POST
          - PUT
          - DELETE
      rota:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            Rota chamada, por exemplo /v2/nfse ou /v1/nfse/cancela. Sem host e sem parâmetro 
            de consulta que carregue segredo. Como a chave da nota pode ir no caminho, ela 
            também fica no campo chave.

      versaoApi:
        type: string
        maxLength: 5
        pattern: \w*\W*
        description: |
            Versão da API da operação. É por operação, não global: envio V2, consulta e 
            cancelamento V1.

            Valores permitidos: 
              V1
                 Valor: V1
                 Texto: Versão 1 - API v1 do IntegraNotas, usada na consulta e no cancelamento da nota.
              V2
                 Valor: V2
                 Texto: Versão 2 - API v2 do IntegraNotas, usada no envio da nota.
        enum:
          - V1
          - V2
      codigoHttp:
        type: integer
        minimum: 0
        maximum: 999
        format: int32
        description: |
            Código HTTP da resposta. O gateway costuma responder 200 mesmo em falha de 
            negócio, então o resultado real está no código de retorno. Vazio se não houve 
            resposta.

      codigoRetorno:
        type: integer
        minimum: 0
        maximum: 9999
        format: int32
        description: |
            Código de retorno do gateway, por exemplo 5023 em processamento, 100 autorizada, 
            101 cancelada. Vazio se não houve resposta.

      mensagemRetorno:
        type: string
        maxLength: 500
        pattern: \w*\W*
        description: |
            Mensagem devolvida pelo gateway, truncada em 500 caracteres. Não guarda a lista 
            detalhada de erros de campo, que fica na nota.

      duracaoMs:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Tempo gasto na chamada, em milissegundos.

      dataChamada:
        type: string
        format: date-time
        description: |
            Data e hora em que a chamada foi feita.

      chave:
        type: string
        maxLength: 50
        pattern: \w*\W*
        description: |
            Chave da nota, 50 dígitos, quando a chamada a envolve. Gravada mesmo em falha, 
            porque o gateway pode devolvê-la.

      identificacao:
        type: string
        maxLength: 40
        pattern: \w*\W*
        description: |
            Valor do campo identificacao enviado na emissão (1 a 40 caracteres), que é o id 
            da Nota (UUID de 36 caracteres). Vazia nas demais operações.

      resumoEnvio:
        type: string
        maxLength: 500
        pattern: \w*\W*
        description: |
            Resumo seguro do que foi enviado, em texto livre, por exemplo numero, serie e 
            valor do serviço. Proibido incluir token, senha, certificado, XML, PDF ou dado 
            pessoal do tomador.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID).

      ambiente:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Ambiente do gateway em que a chamada foi feita. Uma chamada de homologação nunca 
            se mistura com uma de produção.

            Valores permitidos: 
              HOMOLOGACAO
                 Valor: HOMOLOGACAO
                 Texto: Homologação - Chamada feita ao ambiente de testes do gateway. É o padrão. Uma chamada de teste nunca se mistura com uma real.
              PRODUCAO
                 Valor: PRODUCAO
                 Texto: Produção - Chamada feita ao ambiente real do gateway.
        enum:
          - HOMOLOGACAO
          - PRODUCAO
      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi gravado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa dona desta chamada e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
      nota:
        description: |
            Nota a que a chamada se refere. Opcional: cadastro da empresa (emitente no 
            IntegraNotas) e envio de certificado não envolvem nota, e uma emissão recusada 
            pode não ter gerado nota.

        allOf:
          - $ref: '#/definitions/IdReference'
  integranotas.EventoWebhook:
    description: |
            Cada notificação recebida do gateway no endpoint de webhook do sistema. Registro 
            de auditoria e de idempotência.
             ATENÇÃO: o corpo exato do webhook de emissão de NFS-e AINDA NÃO FOI CONFIRMADO 
            (as páginas Notificação com sucesso e Notificação com falha não foram lidas). 
            Este modelo cobre só o envelope comum conhecido (origem, cnpj_cpf, tipo) e os 
            campos chave, sucesso, código, mensagem e identificação. Quando o corpo for 
            confirmado, o mapa será revisado.
             O XML e o PDF do webhook NÃO são guardados aqui: a Nota guarda os documentos.
             Idempotência: a mesma notificação pode chegar até 3 vezes. Chave de deduplicação 
            sugerida: (empresa, ambiente, chave, código). O mapa não expressa unicidade 
            composta, ela precisa virar constraint única no banco, e uma repetição deve ser 
            reconhecida e marcada como ignorada em vez de reprocessada.
             A empresa (emitente no IntegraNotas) é resolvida pelo cnpj_cpf e pelo ambiente. 
            A validade da assinatura é registrada, mas não há validação por header e a 
            assinatura na v2 não está confirmada.

    type: object
    required:
      - dataRecebimento
      - resultadoAssinatura
      - estadoProcessamento
      - id
      - ambiente
      - dataCriacao
      - dataAtualizacao
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      origem:
        type: string
        maxLength: 30
        pattern: \w*\W*
        description: |
            Origem da notificação, como informada no envelope do gateway. Os valores 
            possíveis não estão confirmados.

      cnpjCpf:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            CNPJ ou CPF da empresa a que a notificação se refere, só dígitos.

      tipo:
        type: string
        maxLength: 30
        pattern: \w*\W*
        description: |
            Tipo da notificação, como informado no envelope. Os valores possíveis não estão 
            confirmados.

      chave:
        type: string
        maxLength: 50
        pattern: \w*\W*
        description: |
            Chave da nota, 50 dígitos. Parte da chave de deduplicação.

      sucesso:
        type: boolean
        description: |
            Indica se a notificação informa sucesso na emissão.

      codigo:
        type: integer
        minimum: 0
        maximum: 9999
        format: int32
        description: |
            Código de retorno do gateway na notificação. Parte da chave de deduplicação.

      mensagem:
        type: string
        maxLength: 500
        pattern: \w*\W*
        description: |
            Mensagem da notificação, truncada em 500 caracteres.

      identificacao:
        type: string
        maxLength: 40
        pattern: \w*\W*
        description: |
            Eco do campo identificacao do envio (1 a 40 caracteres), que é o id da Nota 
            (UUID de 36 caracteres), devolvido na notificação.

      dataRecebimento:
        type: string
        format: date-time
        description: |
            Data e hora em que o sistema recebeu a notificação.

      resultadoAssinatura:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Resultado da validação da assinatura da notificação. A assinatura em si não é 
            guardada.

            Valores permitidos: 
              VALIDA
                 Valor: VALIDA
                 Texto: Válida - A assinatura da notificação foi validada com sucesso.
              INVALIDA
                 Valor: INVALIDA
                 Texto: Inválida - A assinatura da notificação não confere.
              EXPIRADA
                 Valor: EXPIRADA
                 Texto: Expirada - A assinatura da notificação está fora do prazo de validade.
        enum:
          - VALIDA
          - INVALIDA
          - EXPIRADA
      estadoProcessamento:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Estado do tratamento da notificação. Nasce RECEBIDO, vira PROCESSADO quando 
            atualiza a nota, IGNORADO quando é repetição ou descartada, e COM_ERRO quando o 
            tratamento falha.

            Valores permitidos: 
              RECEBIDO
                 Valor: RECEBIDO
                 Texto: Recebido - Estado inicial e padrão: a notificação foi recebida e aguarda tratamento. dataProcessamento fica vazia.
              PROCESSADO
                 Valor: PROCESSADO
                 Texto: Processado - A notificação foi tratada e atualizou a nota.
              IGNORADO
                 Valor: IGNORADO
                 Texto: Ignorado - A notificação foi ignorada porque é repetição ou foi descartada.
              COM_ERRO
                 Valor: COM_ERRO
                 Texto: Com erro - O tratamento da notificação falhou.
        enum:
          - RECEBIDO
          - PROCESSADO
          - IGNORADO
          - COM_ERRO
      dataProcessamento:
        type: string
        format: date-time
        description: |
            Data e hora em que o tratamento terminou. Vazia enquanto estiver RECEBIDO.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do evento (UUID).

      ambiente:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Ambiente do gateway de que veio a notificação. Parte da chave de deduplicação.

            Valores permitidos: 
              HOMOLOGACAO
                 Valor: HOMOLOGACAO
                 Texto: Homologação - Notificação vinda do ambiente de testes do gateway. É o padrão.
              PRODUCAO
                 Valor: PRODUCAO
                 Texto: Produção - Notificação vinda do ambiente real do gateway.
        enum:
          - HOMOLOGACAO
          - PRODUCAO
      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi gravado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro, inclusive a mudança de estado do 
            processamento.

      empresa:
        description: |
            Empresa dona deste evento e tenant do registro, resolvida pelo cnpj_cpf e pelo 
            ambiente. Notificação de emitente desconhecido não vira registro.

        allOf:
          - $ref: '#/definitions/IdReference'
      nota:
        description: |
            Nota a que a notificação se refere, localizada pela chave. Opcional: a 
            notificação pode chegar antes de a nota ser localizada.

        allOf:
          - $ref: '#/definitions/IdReference'
  configuracao.Empresa:
    description: |
            Empresa usuária do sistema e tenant do modelo. Cada empresa só emite e só 
            enxerga as próprias notas.
             NUNCA é apagada, só DESATIVADA (situacao = DESATIVADA): a aplicação não deve 
            expor a remoção. Nasce no signup com o documento, o e-mail e o WhatsApp 
            informados, em situacao PENDENTE_CONFIRMACAO, e fica ATIVA quando o usuário 
            clica no link do e-mail (ConfirmacaoCadastro).
             É identificada por um documento único (CNPJ ou CPF). Tem atividades 
            (AtividadeEmpresa) e quadro de sócios (QsaEmpresa) como detalhes ([m]/[o]).
             Regra de edição, da aplicação: o usuário da empresa só altera razaoSocial, 
            nomeFantasia e o endereço; o resto é alterável só pelo administrador da 
            plataforma ou suporte. É cadastrada no gateway IntegraNotas, onde se chama 
            "emitente", e o gateway devolve o token do emitente,
             separado por ambiente. Token, credenciais da prefeitura e certificado ficam no 
            cofre, aqui só há referência.
             Vive no contexto configuracao (domain.configuracao), sozinha. Há dependência 
            mútua com o contexto cadastros: a Empresa referencia o Municipio (cadastros), e 
            Pessoa e Servico (cadastros) referenciam a Empresa. Empresa e Municipio devem 
            ser modelados juntos.

    type: object
    required:
      - nomeFantasia
      - razaoSocial
      - documento
      - email
      - whatsapp
      - telefone
      - logradouro
      - numeroEndereco
      - bairro
      - cep
      - regimeTributario
      - situacao
      - nfseHabilitada
      - ultimoNumeroNfse
      - statusCadastro
      - situacaoCertificado
      - id
      - ambiente
      - dataCriacao
      - dataAtualizacao
      - municipio
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nomeFantasia:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Nome fantasia da empresa, de 2 a 60 caracteres (campo nome do cadastro no 
            gateway). Alterável pelo usuário da empresa.

      razaoSocial:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Razão social da empresa, de 2 a 60 caracteres (campo razao do cadastro no 
            gateway). Alterável pelo usuário da empresa.

      documento:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Documento da empresa, só dígitos, sem formatação: 14 dígitos é CNPJ e 11 dígitos 
            é CPF. É um ou outro, nunca os dois.
             No cadastro no gateway e no envio ao IntegraNotas o sistema o separa em cnpj ou 
            cpf conforme o tamanho. CPF é dado pessoal, sujeito a mascaramento nas 
            respostas. Obrigatório.
             Único por ambiente (o mesmo documento tem um registro por ambiente). Alterável 
            só pelo administrador da plataforma ou suporte.

      rgInscricaoEstadual:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Inscrição estadual da empresa, até 20 caracteres. Mesmo nome do campo da Pessoa. 
            Opcional. Alterável só pelo administrador da plataforma ou suporte.

      inscricaoMunicipal:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Inscrição municipal da empresa, de 1 a 20 caracteres (campo im do gateway). 
            Opcional. Alterável só pelo administrador da plataforma ou suporte.

      email:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            E-mail da empresa, até 60 caracteres. Obrigatório: várias integrações exigem 
            (IntegraNotas, bancos para boleto e PIX). É o e-mail informado no signup. 
            Alterável só pelo administrador da plataforma ou suporte.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            WhatsApp da empresa, até 20 caracteres. Obrigatório: necessário em cadastros de 
            integração como IntegraNotas e bancos para boleto e PIX. É o WhatsApp informado 
            no signup. Alterável só pelo administrador da plataforma ou suporte.

      telefone:
        type: string
        maxLength: 14
        pattern: \w*\W*
        description: |
            Telefone da empresa, de 6 a 14 dígitos, só números. Alterável só pelo 
            administrador da plataforma ou suporte.

      logradouro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Rua, avenida ou similar do endereço da empresa, de 1 a 60 caracteres (campo rua 
            do gateway). Alterável pelo usuário da empresa.

      numeroEndereco:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Número do imóvel, de 1 a 60 caracteres, texto porque aceita S/N (campo numero do 
            gateway). Alterável pelo usuário da empresa.

      complemento:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Complemento do endereço, até 60 caracteres. Opcional. Alterável pelo usuário da 
            empresa.

      bairro:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            Bairro do endereço, de 2 a 60 caracteres. Alterável pelo usuário da empresa.

      cep:
        type: string
        maxLength: 8
        pattern: \w*\W*
        description: |
            CEP do endereço, exatamente 8 dígitos sem hífen. Guardado como texto para 
            preservar zeros à esquerda. Alterável pelo usuário da empresa.

      regimeTributario:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime tributário da empresa (campo crt do gateway). Define o enquadramento 
            usado na emissão. Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              SIMPLES_NACIONAL
                 Valor: 1
                 Texto: Simples Nacional - Empresa optante pelo Simples Nacional. Código gravado e enviado ao gateway (crt): 1.
              SIMPLES_EXCESSO_SUBLIMITE
                 Valor: 2
                 Texto: Simples Nacional com excesso de sublimite - Simples Nacional com excesso de sublimite de receita. Código gravado e enviado ao gateway (crt): 2.
              REGIME_NORMAL
                 Valor: 3
                 Texto: Regime Normal - Empresa no regime normal (lucro presumido ou real). Código gravado e enviado ao gateway (crt): 3.
              MEI
                 Valor: 4
                 Texto: MEI - Microempreendedor Individual. Código gravado e enviado ao gateway (crt): 4.
      regimeIbsCbs:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime de apuração do IBS e da CBS da empresa (campo regime_cibs do gateway), de 
            0 a 4. Opcional por decisão do usuário.
             O valor 0 significa não informado e a tag não é enviada. Alterável só pelo 
            administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_INFORMADO
                 Valor: 0
                 Texto: Não informado - Não informado, padrão: a tag regime_cibs não é enviada. Código gravado: 0.
              SIMPLES_OPCAO_REGIME_REGULAR
                 Valor: 1
                 Texto: Simples Nacional com opção pelo regime regular - Simples Nacional com opção pelo regime regular do IBS e da CBS (crt 1 ou 2). Código gravado e enviado ao gateway: 1.
              NORMAL_OPCAO_SIMPLES_PENDENTE_SEM_REGULAR
                 Valor: 2
                 Texto: Regime Normal, opção pelo Simples pendente, sem regime regular - Regime Normal com opção pendente pelo Simples Nacional, sem regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 2.
              NORMAL_SUBLIMITE_PENDENTE_SEM_REGULAR
                 Valor: 3
                 Texto: Regime Normal, excesso de sublimite pendente, sem regime regular - Regime Normal com opção pendente pelo Simples Nacional com excesso de sublimite, sem regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 3.
              NORMAL_OPCAO_SIMPLES_PENDENTE_COM_REGULAR
                 Valor: 4
                 Texto: Regime Normal, opção pelo Simples pendente, com regime regular - Regime Normal com opção pendente pelo Simples Nacional, com regime regular do IBS e da CBS (crt 3). Código gravado e enviado ao gateway: 4.
      logo:
        type: string
        format: byte
        description: |
            Logotipo da empresa, imagem JPG ou PNG proporcional (como 100x100) de até 1 MB. 
            Opcional, enviado ao gateway em Base64. Alterável só pelo administrador da 
            plataforma ou suporte.

      urlWebhook:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            URL pública, de 1 a 200 caracteres, que recebe as notificações do gateway. 
            Registrada no cadastro da empresa no gateway
             e só aceita se responder HTTP 200. Opcional. Alterável só pelo administrador da 
            plataforma ou suporte.

      situacao:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação da conta da empresa NO SISTEMA (não confundir com statusCadastro, que é 
            o cadastro no gateway IntegraNotas). A empresa nasce PENDENTE_CONFIRMACAO no 
            signup,
             vira ATIVA quando o usuário clica no link do e-mail (ou quando o suporte ativa) 
            e DESATIVADA quando o suporte a desativa à mão. Nunca é apagada. Alterável só 
            pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              PENDENTE_CONFIRMACAO
                 Valor: PENDENTE_CONFIRMACAO
                 Texto: Pendente de confirmação - Estado inicial e padrão: a empresa nasce assim no signup, aguardando o clique no link de confirmação enviado por e-mail.
              ATIVA
                 Valor: ATIVA
                 Texto: Ativa - Conta ativa, depois do clique no link do e-mail ou quando o suporte a ativa.
              DESATIVADA
                 Valor: DESATIVADA
                 Texto: Desativada - Conta desativada à mão pelo suporte, com motivo obrigatório. A empresa nunca é apagada.
        enum:
          - PENDENTE_CONFIRMACAO
          - ATIVA
          - DESATIVADA
      dataConfirmacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o usuário confirmou o cadastro pelo link do e-mail. Vazia 
            enquanto pendente. Alterável só pelo administrador da plataforma ou suporte.

      referenciaCrm:
        type: string
        maxLength: 50
        pattern: \w*\W*
        description: |
            Identificador desta empresa como cliente no CRM da Marke. A cobrança é do CRM, 
            este sistema não processa pagamento. Opcional. Alterável só pelo administrador 
            da plataforma ou suporte.

      nfseHabilitada:
        type: boolean
        description: |
            Indica se a empresa habilitou a emissão de NFS-e. Ao habilitar, o sistema 
            cadastra o emitente no IntegraNotas (webhook e token do emitente, guardado no 
            cofre) e, se já houver certificado, envia-o. Padrão não (false). Alterável pelo 
            administrador da empresa e pela plataforma.

      serieNfse:
        type: string
        maxLength: 5
        pattern: \w*\W*
        description: |
            Série da DPS usada nas notas desta empresa, 1 a 5 dígitos. Informada ao 
            habilitar a emissão. Vai no campo serie do envio.

      ultimoNumeroNfse:
        type: integer
        minimum: 0
        maximum: 999999999
        format: int32
        description: |
            Último número da DPS já utilizado pela empresa (0 se nunca emitiu). O próximo 
            número é este mais 1, e o sistema o incrementa de forma atômica a cada nota. 
            Informado ao habilitar a emissão, para continuar a numeração de outro emissor. 
            Até 9 dígitos.

      statusCadastro:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação do cadastro da empresa NO GATEWAY (emitente no IntegraNotas), no 
            ambiente do registro. Não é a situação da conta no sistema (ver situacao). A 
            empresa nasce NAO_CADASTRADO,
             vira CADASTRADO quando o gateway devolve o token, e ERRO quando o cadastro é 
            recusado. Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_CADASTRADO
                 Valor: NAO_CADASTRADO
                 Texto: Não cadastrado - A empresa ainda não foi cadastrada no gateway. É o estado inicial e o padrão.
              CADASTRADO
                 Valor: CADASTRADO
                 Texto: Cadastrado - Cadastro aceito pelo gateway, que devolveu o token do emitente (nome no IntegraNotas), guardado no cofre.
              ERRO
                 Valor: ERRO
                 Texto: Erro no cadastro - Cadastro recusado pelo gateway.
        enum:
          - NAO_CADASTRADO
          - CADASTRADO
          - ERRO
      dataCadastroGateway:
        type: string
        format: date-time
        description: |
            Data e hora em que o gateway aceitou o cadastro e devolveu o token. Vazia 
            enquanto não cadastrado. Alterável só pelo administrador da plataforma ou 
            suporte.

      validadeCertificado:
        type: string
        format: date
        description: |
            Data de validade do certificado digital enviado ao gateway. Vazia enquanto não 
            houver certificado. Alterável só pelo administrador da plataforma ou suporte.

      situacaoCertificado:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Situação do certificado digital da empresa no gateway, no ambiente do registro. 
            Alterável só pelo administrador da plataforma ou suporte.

            Valores permitidos: 
              NAO_ENVIADO
                 Valor: NAO_ENVIADO
                 Texto: Não enviado - Nenhum certificado foi enviado ao gateway. É o estado inicial e o padrão.
              VALIDO
                 Valor: VALIDO
                 Texto: Válido - Certificado aceito pelo gateway e dentro da validade.
              VENCIDO
                 Valor: VENCIDO
                 Texto: Vencido - Certificado com a validade vencida (erro 5011 do gateway).
              INVALIDO
                 Valor: INVALIDO
                 Texto: Inválido - Certificado corrompido ou enviado com senha errada (erro 5003 do gateway).
              NAO_PERTENCE
                 Valor: NAO_PERTENCE
                 Texto: Não pertence à empresa - Certificado que não pertence ao documento (CNPJ ou CPF) da empresa (erro 5029 do gateway).
        enum:
          - NAO_ENVIADO
          - VALIDO
          - VENCIDO
          - INVALIDO
          - NAO_PERTENCE
      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno da empresa (UUID). Também é o identificador do tenant, 
            usado como chave de escopo
             da própria empresa (tenantKey) e referenciado pelo tenantKey das demais 
            entidades.

      ambiente:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Ambiente do gateway a que este registro pertence. Empresa (emitente no 
            IntegraNotas) e token são independentes por ambiente,
             então o mesmo documento (CNPJ ou CPF) tem um registro por ambiente e uma nota de 
            teste nunca se mistura com uma real.

            Valores permitidos: 
              HOMOLOGACAO
                 Valor: HOMOLOGACAO
                 Texto: Homologação - Ambiente de testes do gateway. É o padrão. Nada emitido aqui tem validade fiscal e uma nota de teste nunca se mistura com uma real.
              PRODUCAO
                 Valor: PRODUCAO
                 Texto: Produção - Ambiente real do gateway. As notas emitidas aqui têm validade fiscal.
        enum:
          - HOMOLOGACAO
          - PRODUCAO
      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que a empresa foi cadastrada no sistema.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      atividades:
        type: array
        items:
          $ref: '#/definitions/configuracao.AtividadeEmpresa'
        description: |
            Atividades econômicas (CNAE) da empresa: uma principal e várias secundárias. Só 
            existem dentro da empresa, no mesmo contexto. Alterável só pelo administrador da 
            plataforma ou suporte.

      qsa:
        type: array
        items:
          $ref: '#/definitions/configuracao.QsaEmpresa'
        description: |
            Quadro de sócios e administradores (QSA) da empresa, com vários itens. Só existe 
            dentro da empresa, no mesmo contexto. Alterável só pelo administrador da 
            plataforma ou suporte.

      municipio:
        description: |
            Município do endereço da empresa. Traz código IBGE, nome e UF, que não se 
            repetem aqui (campos cmun, municipio e uf do gateway). A empresa não pode usar o 
            registro Exterior (regra da aplicação). Alterável pelo usuário da empresa.

        allOf:
          - $ref: '#/definitions/IdReference'
  nfse.Nota:
    description: |
            NFS-e da empresa e o seu ciclo de vida. Há dois caminhos de entrada.
             (A) Emissão DIRETA por uma pessoa no sistema: NÃO há rascunho; a nota nasce em 
            processamento, criada e enviada ao gateway numa só ação. (B) Assistente de IA: o 
            assistente só PREPARA a nota como rascunho (preparadoPorCliente) e uma PESSOA 
            aprova (o sistema envia e a nota vira PROCESSANDO) ou descarta (vira 
            DESCARTADA). Aprovar e descartar o rascunho são requisito AINDA NÃO IMPLEMENTADO 
            no código. O estado rascunho só existe no caminho B.
             Depois do envio, o gateway devolve o código 5023 com a chave e só depois vem a 
            autorização. Falha de infraestrutura no envio direto (gateway indisponível, 
            token recusado, aceite sem chave, código 0) leva a FALHA_ENVIO, que pode ser 
            reenviada com o mesmo número, como a REJEITADA. As transições estão em 
            CicloNota.
             Vive no contexto nfse (domain.nfse). Depende de configuracao (Empresa), de 
            cadastros (Pessoa e Servico) e de usuarios (Usuario e ClienteAcesso) para o 
            rastro de quem preparou, aprovou e descartou. Usuarios depende só de cadastros e 
            configuracao, então não há ciclo.
             Guarda uma CÓPIA dos dados do SERVIÇO enviados (código, discriminação, valores, 
            tributos), porque alterar o cadastro de Servico depois não pode mudar uma nota 
            já emitida.
             Da PESSOA guarda só o vínculo: o sistema monta o envio lendo a Pessoa no momento 
            do envio (aprovação). O registro do que de fato foi enviado e autorizado é o XML 
            (e o PDF) que a nota guarda; consultas por nome ou documento da pessoa usam a 
            relação. Custo: se a Pessoa for alterada depois, a nota passa a mostrar o dado 
            novo nas telas e nos relatórios, mas o XML e o PDF guardados preservam o que foi 
            emitido.
             Chave única: a nota só tem a chave de 50 caracteres devolvida pelo gateway, 
            única por NFS-e (índice no banco). O campo identificacao do envio (1 a 40 
            caracteres) é preenchido com o id da nota (UUID de 36 caracteres, cabe nos 40 do 
            gateway, que não aceita mais que isso), então a nota não guarda atributo de 
            correlação à parte.
             A numeração da DPS (numero e serie) é atributo da nota, não existe entidade RPS. 
            O prestador não vai no envio, vem do token da empresa (emitente no 
            IntegraNotas).
             Regra de unicidade para a camada de banco: a combinação (empresa, ambiente, 
            serie, numero) deve ser única. O rascunho do assistente tem numero e serie 
            vazios e não conflita: no PostgreSQL valores nulos não colidem em índice único.
             O mapa não expressa unicidade composta, ela precisa virar constraint no banco.
             Tributação: o grupo tributos_municipais SÓ vai no envio quando há dado de ISS 
            (ISS retido ligado, alíquota, base ou valor retido; iss_retido = false sozinho 
            não conta) E (regime de apuração diferente de 1 OU ISS retido); sem regime, vale 
            1 (regra E0625). Quando vai, leva sempre aliquota_iss (obrigatória, nunca 
            deduzida) e valor_base_calculo_iss (em branco = valor dos serviços menos 
            desconto incondicionado, mínimo 0). Uma nota simples, sem dado de ISS, sai sem o 
            grupo tributos_municipais (a confirmar em homologação). O campo tipo_operacao 
            não é mais enviado (não existe no schema de 2026-11-24). O grupo 
            tributos_nacionais só vai com dado, e então exige o CST. Nenhum agente de IA 
            informa tributo: só a pessoa, pela tela. As validações de coerência estão nas 
            description dos atributos e são implementadas à mão.
             Fora do modelo por ora, a modelar sob demanda: obra, evento, locação, exterior, 
            intermediário, deduções, contingência, emissão pelo tomador e o bloco ibs_cbs.

    type: object
    required:
      - codigoServico
      - discriminacao
      - valorServicos
      - tipoOperacaoIss
      - issRetido
      - estado
      - id
      - ambiente
      - dataCriacao
      - dataAtualizacao
      - empresa
      - pessoa
      - servico
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      numero:
        type: string
        maxLength: 9
        pattern: \w*\W*
        description: |
            Numeração da DPS enviada ao gateway, 1 a 9 dígitos (campo numero do envio). Não 
            é o número da NFS-e devolvido na autorização.
             Vazio no rascunho do assistente: o número só é alocado quando a nota vira 
            PROCESSANDO (criação direta ou aprovação), sem reservar no preparo e sem 
            buracos. Por isso o mapa não marca required. Regra de aplicação, a validar no 
            código: obrigatório fora do rascunho (e a coluna do banco continua exigindo isso 
            por constraint de estado ou validação).

      serie:
        type: string
        maxLength: 5
        pattern: \w*\W*
        description: |
            Série da DPS, 1 a 5 dígitos (campo serie do envio). Vazia no rascunho do 
            assistente; preenchida obrigatoriamente quando a nota vira PROCESSANDO (criação 
            direta ou aprovação). Regra de aplicação, a validar no código.

      dataEmissao:
        type: string
        format: date-time
        description: |
            Data e hora de emissão enviadas (campo data_emissao do envio, ISO com fuso). 
            Regravada a cada reenvio. Define o mês vigente da regra de cancelamento (mês e 
            ano da emissão, fuso America/Sao_Paulo). Vazia no rascunho do assistente; 
            preenchida obrigatoriamente quando a nota vira PROCESSANDO (criação direta ou 
            aprovação). Regra de aplicação, a validar no código.

      dataCompetencia:
        type: string
        format: date
        description: |
            Data de competência (campo data_competencia do envio). Opcional, o padrão do 
            gateway é a data de emissão.

      informacoesComplementares:
        type: string
        maxLength: 2000
        pattern: \w*\W*
        description: |
            Texto livre de até 2000 caracteres (campo informacoes_complementares do envio). 
            Quebra de linha só com \n. Opcional.

      regimeApuracao:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime de apuração do Simples Nacional, de 1 a 3 (campo regime_apuracao do 
            envio). Opcional.

      regimeTributacao:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Regime especial de tributação, de 0 a 9 (campo regime_tributacao do envio). 
            Padrão 0, nenhum. Opcional.

      idCondicaoPagamento:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Id da condição de pagamento do financeiro (CN-REL-002, sem relação de objeto: 
            nfse não depende de financeiro). Não vai ao IntegraNotas: o financeiro usa para 
            gerar as parcelas a receber quando a nota é autorizada. Opcional; sem ela, 1 
            título à vista.

      codigoServico:
        type: string
        maxLength: 6
        pattern: \w*\W*
        description: |
            Código do serviço da LC 116/2003, 6 dígitos (campo servico.codigo do envio). 
            Cópia do que foi enviado.

      codigoTributacaoMunicipio:
        type: string
        maxLength: 3
        pattern: \w*\W*
        description: |
            Código de tributação do município, 3 dígitos. Opcional.

      codigoNbs:
        type: string
        maxLength: 9
        pattern: \w*\W*
        description: |
            Nomenclatura Brasileira de Serviços, 9 dígitos. Opcional.

      discriminacao:
        type: string
        maxLength: 2000
        pattern: \w*\W*
        description: |
            Discriminação do serviço, até 2000 caracteres (campo servico.discriminacao do 
            envio). Quebra de linha só com \n.

      descricao:
        type: string
        maxLength: 200
        pattern: \w*\W*
        description: |
            Descrição de até 200 caracteres, usada só no PDF (campo servico.descricao do 
            envio). Opcional.

      valorServicos:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor dos serviços, mínimo 0.01 (campo servico.valor_servicos do envio).

      valorRecebido:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor efetivamente recebido (campo servico.valor_recebido do envio). Opcional.

      valorDescontoCondicionado:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor do desconto condicionado (campo servico.valor_desconto_condicionado do 
            envio). Opcional.

      valorDescontoIncondicionado:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor do desconto incondicionado (campo servico.valor_desconto_incondicionado do 
            envio). Opcional.

      tipoOperacaoIss:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Tipo da operação para o ISS. NÃO vai mais no envio v2: o campo 
            tributos_municipais.tipo_operacao não existe no schema de 2026-11-24.
             O atributo é mantido na nota, sem efeito no envio. Padrão 1, tributável.

            Valores permitidos: 
              TRIBUTAVEL
                 Valor: 1
                 Texto: Tributável - Operação tributável pelo ISS (padrão). Código gravado: 1.
              IMUNIDADE
                 Valor: 2
                 Texto: Imunidade - Operação com imunidade do ISS. Código gravado: 2.
              EXPORTACAO
                 Valor: 3
                 Texto: Exportação - Exportação de serviço. Código gravado: 3.
              NAO_INCIDENCIA
                 Valor: 4
                 Texto: Não incidência - Operação em que o ISS não incide. Código gravado: 4.
      aliquotaIss:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Alíquota do ISS em pontos percentuais, de 0 a 100 (5.00 significa 5%; campo 
            aliquota_iss do envio). Opcional na nota, mas obrigatória quando o grupo
             tributos_municipais vai no envio (regra E0625); nunca é deduzida pelo sistema. 
            Validar à mão ao enviar.

      valorBaseCalculoIss:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Base de cálculo do ISS em R$ (campo valor_base_calculo_iss do envio, obrigatório 
            quando o grupo tributos_municipais vai). CALCULADA pelo
             sistema, nunca digitada: valor dos serviços − desconto incondicionado (mínimo 
            0), a mesma conta do governo (vBC = vServ − vDescIncond).
             Decisão do dono (2026-11-25): a homologação mostrou que o governo ignora base 
            informada e recalcula.

      valorIssRetido:
        type: number
        minimum: 0
        maximum: 9999999999999.99
        description: |
            Valor do ISS retido em R$ (campo valor_iss_retido do envio). CALCULADO pelo 
            sistema, nunca digitado: só com ISS retido ligado e alíquota,
             base de cálculo × alíquota / 100, 2 casas, meio para cima (vISSQN = vBC × pAliq, 
            como o governo calcula).

      issRetido:
        type: boolean
        description: |
            Indica se o ISS é retido pelo tomador (campo iss_retido do envio). Padrão não. 
            Sozinho com valor falso não conta como dado de ISS
             para decidir se o grupo tributos_municipais vai no envio (regra E0625).

      responsavelRetencao:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Quem retém o ISS, quando há retenção (campo 
            tributos_municipais.responsavel_retencao do envio). Opcional.

            Valores permitidos: 
              TOMADOR
                 Valor: 2
                 Texto: Tomador - A retenção do ISS é feita pelo tomador. Código gravado: 2.
              INTERMEDIARIO
                 Valor: 3
                 Texto: Intermediário - A retenção do ISS é feita pelo intermediário. Código gravado: 3.
      cstPisCofins:
        type: string
        maxLength: 2
        pattern: \w*\W*
        description: |
            CST do PIS/COFINS, 2 dígitos com zero à esquerda (campo tributos_nacionais.cst 
            do envio). Lista fechada com os 33 códigos do schema do IntegraNotas
             (valores em [e] values; o código gravado é o filho codigo). Opcional na nota: o 
            grupo tributos_nacionais só vai com dado, e então o CST é obrigatório
             (validar à mão ao enviar). O sistema nunca escolhe o CST.

            Valores permitidos: 
              ALIQUOTA_NORMAL
                 Valor: 01
                 Texto: Alíquota normal - Operação tributável: base de cálculo = valor da operação (alíquota normal, cumulativo ou não cumulativo). Código gravado: 01.
              ALIQUOTA_DIFERENCIADA
                 Valor: 02
                 Texto: Alíquota diferenciada - Operação tributável: base de cálculo = valor da operação (alíquota diferenciada). Código gravado: 02.
              ALIQUOTA_POR_UNIDADE
                 Valor: 03
                 Texto: Alíquota por unidade - Operação tributável: base de cálculo = quantidade vendida × alíquota por unidade de produto. Código gravado: 03.
              MONOFASICA_ALIQUOTA_ZERO
                 Valor: 04
                 Texto: Monofásica (alíquota zero) - Operação tributável: tributação monofásica (alíquota zero). Código gravado: 04.
              SUBSTITUICAO_TRIBUTARIA
                 Valor: 05
                 Texto: Substituição tributária - Operação tributável: substituição tributária. Código gravado: 05.
              ALIQUOTA_ZERO
                 Valor: 06
                 Texto: Alíquota zero - Operação tributável: alíquota zero. Código gravado: 06.
              ISENTA
                 Valor: 07
                 Texto: Isenta da contribuição - Operação isenta da contribuição. Código gravado: 07.
              SEM_INCIDENCIA
                 Valor: 08
                 Texto: Sem incidência - Operação sem incidência da contribuição. Código gravado: 08.
              COM_SUSPENSAO
                 Valor: 09
                 Texto: Com suspensão - Operação com suspensão da contribuição. Código gravado: 09.
              OUTRAS_SAIDAS
                 Valor: 49
                 Texto: Outras operações de saída - Outras operações de saída. Código gravado: 49.
              CREDITO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 50
                 Texto: Crédito: tributada no mercado interno - Operação com direito a crédito: vinculada exclusivamente a receita tributada no mercado interno. Código gravado: 50.
              CREDITO_NAO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 51
                 Texto: Crédito: não tributada no mercado interno - Operação com direito a crédito: vinculada exclusivamente a receita não tributada no mercado interno. Código gravado: 51.
              CREDITO_EXPORTACAO
                 Valor: 52
                 Texto: Crédito: exportação - Operação com direito a crédito: vinculada exclusivamente a receita de exportação. Código gravado: 52.
              CREDITO_TRIBUTADA_E_NAO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 53
                 Texto: Crédito: tributada e não tributada no mercado interno - Operação com direito a crédito: vinculada a receitas tributadas e não tributadas no mercado interno. Código gravado: 53.
              CREDITO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 54
                 Texto: Crédito: tributada no mercado interno e exportação - Operação com direito a crédito: vinculada a receitas tributadas no mercado interno e de exportação. Código gravado: 54.
              CREDITO_NAO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 55
                 Texto: Crédito: não tributada no mercado interno e exportação - Operação com direito a crédito: vinculada a receitas não tributadas no mercado interno e de exportação. Código gravado: 55.
              CREDITO_TRIBUTADA_E_NAO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 56
                 Texto: Crédito: tributada e não tributada no mercado interno e exportação - Operação com direito a crédito: vinculada a receitas tributadas e não tributadas no mercado interno e de exportação. Código gravado: 56.
              CREDITO_PRESUMIDO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 60
                 Texto: Crédito presumido: tributada no mercado interno - Crédito presumido: operação de aquisição vinculada exclusivamente a receita tributada no mercado interno. Código gravado: 60.
              CREDITO_PRESUMIDO_NAO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 61
                 Texto: Crédito presumido: não tributada no mercado interno - Crédito presumido: operação de aquisição vinculada exclusivamente a receita não tributada no mercado interno. Código gravado: 61.
              CREDITO_PRESUMIDO_EXPORTACAO
                 Valor: 62
                 Texto: Crédito presumido: exportação - Crédito presumido: operação de aquisição vinculada exclusivamente a receita de exportação. Código gravado: 62.
              CREDITO_PRESUMIDO_TRIBUTADA_E_NAO_TRIBUTADA_MERCADO_INTERNO
                 Valor: 63
                 Texto: Crédito presumido: tributada e não tributada no mercado interno - Crédito presumido: operação de aquisição vinculada a receitas tributadas e não tributadas no mercado interno. Código gravado: 63.
              CREDITO_PRESUMIDO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 64
                 Texto: Crédito presumido: tributada no mercado interno e exportação - Crédito presumido: operação de aquisição vinculada a receitas tributadas no mercado interno e de exportação. Código gravado: 64.
              CREDITO_PRESUMIDO_NAO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 65
                 Texto: Crédito presumido: não tributada no mercado interno e exportação - Crédito presumido: operação de aquisição vinculada a receitas não tributadas no mercado interno e de exportação. Código gravado: 65.
              CREDITO_PRESUMIDO_TRIBUTADA_E_NAO_TRIBUTADA_MERCADO_INTERNO_E_EXPORTACAO
                 Valor: 66
                 Texto: Crédito presumido: tributada e não tributada no mercado interno e exportação - Crédito presumido: operação de aquisição vinculada a receitas tributadas e não tributadas no mercado interno e de exportação. Código gravado: 66.
              CREDITO_PRESUMIDO_OUTRAS_OPERACOES
                 Valor: 67
                 Texto: Crédito presumido: outras operações - Crédito presumido: outras operações. Código gravado: 67.
              AQUISICAO_SEM_CREDITO
                 Valor: 70
                 Texto: Aquisição sem direito a crédito - Operação de aquisição sem direito a crédito. Código gravado: 70.
              AQUISICAO_ISENTA
                 Valor: 71
                 Texto: Aquisição com isenção - Operação de aquisição com isenção. Código gravado: 71.
              AQUISICAO_COM_SUSPENSAO

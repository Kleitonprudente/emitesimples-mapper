      tipoRetencao:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Tipo de retenção do PIS, da COFINS e da CSLL, de 0 a 9 (campo 
            tributos_nacionais.tipo_retencao do envio). Opcional.
             No JSON vai como texto ("2"), não como número; em branco, o gateway assume 2 
            (PIS/COFINS não retidos). O código gravado é o número.
             Coerência (validar à mão ao salvar): informado o tipo de retenção, o CST do 
            PIS/COFINS é obrigatório.

            Valores permitidos: 
              NENHUM_RETIDO
                 Valor: 0
                 Texto: PIS/COFINS/CSLL não retidos - PIS, COFINS e CSLL não retidos. Código gravado: 0.
              PIS_COFINS_RETIDOS
                 Valor: 1
                 Texto: PIS/COFINS retido - PIS e COFINS retidos. Código gravado: 1.
              PIS_COFINS_NAO_RETIDOS
                 Valor: 2
                 Texto: PIS/COFINS não retido - PIS e COFINS não retidos. É o que o gateway assume quando o campo vem em branco. Código gravado: 2.
              PIS_COFINS_CSLL_RETIDOS
                 Valor: 3
                 Texto: PIS/COFINS/CSLL retidos - PIS, COFINS e CSLL retidos. Código gravado: 3.
              PIS_COFINS_RETIDOS_CSLL_NAO_RETIDA
                 Valor: 4
                 Texto: PIS/COFINS retidos, CSLL não retido - PIS e COFINS retidos, CSLL não retida. Código gravado: 4.
              PIS_RETIDO
                 Valor: 5
                 Texto: PIS retido, COFINS/CSLL não retidos - PIS retido, COFINS e CSLL não retidos. Código gravado: 5.
              COFINS_RETIDO
                 Valor: 6
                 Texto: COFINS retido, PIS/CSLL não retidos - COFINS retido, PIS e CSLL não retidos. Código gravado: 6.
              COFINS_CSLL_RETIDOS
                 Valor: 7
                 Texto: PIS não retido, COFINS/CSLL retidos - PIS não retido, COFINS e CSLL retidos. Código gravado: 7.
              CSLL_RETIDO
                 Valor: 8
                 Texto: PIS/COFINS não retidos, CSLL retido - PIS e COFINS não retidos, CSLL retida. Código gravado: 8.
              PIS_CSLL_RETIDOS
                 Valor: 9
                 Texto: COFINS não retido, PIS/CSLL retidos - COFINS não retido, PIS e CSLL retidos. Código gravado: 9.
      aliquotaPis:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Alíquota do PIS em pontos percentuais (5.00 significa 5%; campo 
            tributos_nacionais.aliquota_pis do envio). Opcional.
             Informada, exige o CST do PIS/COFINS (validar à mão ao salvar).

      aliquotaCofins:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Alíquota da COFINS em pontos percentuais (5.00 significa 5%; campo 
            tributos_nacionais.aliquota_cofins do envio). Opcional.
             Informada, exige o CST do PIS/COFINS (validar à mão ao salvar).

      percentualTributosSimples:
        type: number
        minimum: 0
        maximum: 999.99
        description: |
            Percentual aproximado de tributos do Simples Nacional (Lei 12.741/2012), em 
            pontos percentuais (13.75 significa 13,75%). Opcional. Vai nos tributos totais 
            da nota; o nome exato do campo no envio v2 precisa ser confirmado em 
            homologação.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do serviço (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o serviço foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa dona deste serviço e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
  usuarios.Usuario:
    description: |
            Identidade de uma pessoa que entra no sistema. É global: uma pessoa pode ter 
            vínculo com várias empresas, por isso não tem tenantKey, e o isolamento por 
            empresa está no VinculoUsuario. Vive no contexto usuarios (domain.usuarios), que 
            depende de configuracao e cadastros.
             O e-mail é único no sistema inteiro (o mapa não expressa unicidade, ela é regra 
            de negócio e índice único no banco).
             NUNCA guarda a senha, só o hash. NUNCA guarda token.

    type: object
    required:
      - nome
      - email
      - ativo
      - administradorPlataforma
      - id
      - dataCriacao
      - dataAtualizacao
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 120
        pattern: \w*\W*
        description: |
            Nome da pessoa. No signup é o nome do responsável, o primeiro usuário da 
            empresa.

      email:
        type: string
        maxLength: 160
        pattern: \w*\W*
        description: |
            E-mail usado no login. Único no sistema, sem diferenciar maiúsculas de 
            minúsculas. No signup, nome, e-mail e WhatsApp do responsável viram dados do 
            Usuario.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            WhatsApp da pessoa, até 20 caracteres. Opcional: o primeiro usuário, do signup, 
            o terá; usuários criados depois podem não ter.

      ativo:
        type: boolean
        description: |
            Usuário inativo não consegue entrar nem renovar o acesso.

      administradorPlataforma:
        type: boolean
        description: |
            Indica o administrador da plataforma, que pode cadastrar empresas em modo 
            irrestrito. Necessário porque a Empresa é o tenant e carrega tenantKey no 
            próprio id.

      dataUltimoAcesso:
        type: string
        format: date-time
        description: |
            Data e hora do último login bem-sucedido. Vazia se nunca entrou.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi gravado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

  usuarios.ClienteAcesso:
    description: |
            Credencial de máquina para os agentes do próprio usuário (fase 1), vinculada a 
            uma única empresa. Troca clientId e segredo por um JWT de acesso com a claim da 
            empresa e os scopes permitidos. Vive no contexto usuarios (domain.usuarios), que 
            depende de configuracao e cadastros.
             Não é cliente OAuth de terceiros: registro dinâmico e consentimento ficam para a 
            fase 2.
             O clientId é único no sistema. NUNCA guarda o segredo, só o hash, e NUNCA guarda 
            token.

    type: object
    required:
      - nome
      - clientId
      - scopes
      - ativo
      - id
      - dataCriacao
      - dataAtualizacao
      - empresa
      - usuario
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      nome:
        type: string
        maxLength: 120
        pattern: \w*\W*
        description: |
            Nome que identifica o agente ou a integração, por exemplo Agente de conciliação.

      clientId:
        type: string
        maxLength: 64
        pattern: \w*\W*
        description: |
            Identificador público do cliente (clientId). Único no sistema. Não é segredo.

      scopes:
        type: string
        maxLength: 100
        pattern: \w*\W*
        description: |
            Lista dos scopes permitidos, separados por espaço, entre consultar, preparar, 
            emitir e cancelar (formato da claim scope do JWT). Texto em vez de entidade 
            filha: o conjunto é fixo e pequeno, não tem ciclo de vida próprio e vai direto 
            para a claim. Emitir e cancelar exigem confirmação humana, regra de fluxo fora 
            deste mapa.

      ativo:
        type: boolean
        description: |
            Cliente inativo não obtém token.

      dataUltimoUso:
        type: string
        format: date-time
        description: |
            Data e hora da última troca de credencial por token. Vazia se nunca usado.

      dataExpiracao:
        type: string
        format: date-time
        description: |
            Data e hora a partir da qual o cliente deixa de valer. Vazia significa sem 
            expiração.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do registro (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o registro foi gravado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Única empresa a que o cliente dá acesso e tenant do registro. Todo acesso é 
            filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'
      usuario:
        description: |
            Usuário que criou o agente e por quem ele age, só com os escopos dados 
            (docs/financeiro/README.md, 9.4, B3). Revogar o vínculo do usuário derruba o 
            agente.

        allOf:
          - $ref: '#/definitions/IdReference'
  nfse.Cancelamento:
    description: |
            Pedido de cancelamento de uma Nota, com o evento e o retorno do gateway (XML e 
            PDF). Só se cancela nota autorizada,
             caso contrário o gateway devolve 5013. Nota já cancelada devolve 5015, tratado 
            como sucesso idempotente.
             Existe só dentro de uma nota e no mesmo contexto, por isso é detalhe da Nota 
            ([m]/[o]).
             REGRA DO PRODUTO, mês vigente: só se cancela dentro do mês e ano da data de 
            emissão da nota (fuso America/Sao_Paulo). Prazos específicos de cada município 
            não são tratados.
             Dois caminhos de entrada. (A) Cancelamento DIRETO por uma pessoa: o pedido nasce 
            em PROCESSANDO, criado e enviado ao gateway numa só ação. (B) Assistente de IA: 
            só PREPARA o pedido como RASCUNHO (preparadoPorCliente); uma pessoa com 
            permissão de cancelar aprova (o sistema envia e o pedido vira PROCESSANDO) ou 
            descarta (vira DESCARTADO). Aprovar e descartar o rascunho são requisito AINDA 
            NÃO IMPLEMENTADO no código. O estado RASCUNHO só existe no caminho B.
             Quem cancela: o administrador sempre; o operador SÓ com permissão delegada 
            (VinculoUsuario.podeCancelarNfse). O código atual deixa o operador cancelar sem 
            delegação: divergência a corrigir no código.
             Estados do pedido: RASCUNHO, PROCESSANDO, CONCLUIDO, RECUSADO (o gateway ou o 
            sistema recusou), EXPIRADO (pendente por mais de 24 h sem confirmação) e 
            DESCARTADO. As transições estão em CicloCancelamento.
             Vive no contexto nfse (domain.nfse). Depende do contexto usuarios (Usuario e 
            ClienteAcesso) para o rastro; usuarios depende só de cadastros e configuracao, 
            não há ciclo.

    type: object
    required:
      - codigoMotivo
      - motivo
      - estado
      - id
      - ambiente
      - dataCriacao
      - dataAtualizacao
      - empresa
      - nota
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      codigoMotivo:
        type: integer
        minimum: 0
        maximum: 9
        format: int32
        description: |
            Código do motivo do cancelamento (campo codigo_cancelamento do envio).

            Valores permitidos: 
              ERRO_EMISSAO
                 Valor: 1
                 Texto: Erro de Emissão - A nota foi emitida com erro. Código gravado e enviado ao gateway: 1.
              SERVICO_NAO_CONCLUIDO
                 Valor: 2
                 Texto: Serviço não concluído - O serviço da nota não foi concluído. Código gravado e enviado ao gateway: 2.
              OUTROS
                 Valor: 9
                 Texto: Outros - Outro motivo, explicado no texto do motivo. Código gravado e enviado ao gateway: 9.
      motivo:
        type: string
        maxLength: 255
        pattern: \w*\W*
        description: |
            Motivo do cancelamento em texto, de 15 a 255 caracteres (campo 
            motivo_cancelamento do envio).

      dataHoraAprovacao:
        type: string
        format: date-time
        description: |
            Momento em que o pedido foi enviado ao gateway por decisão de uma pessoa. No 
            fluxo direto é gravada na criação; no fluxo do assistente, na aprovação do 
            rascunho. Vazia no RASCUNHO e no pedido DESCARTADO.

      dataHoraDescarte:
        type: string
        format: date-time
        description: |
            Momento em que uma pessoa descartou o rascunho do assistente (ainda não 
            implementado no código). Preenchida só no estado DESCARTADO.

      dataHoraRecusa:
        type: string
        format: date-time
        description: |
            Momento em que o gateway ou o sistema recusou o pedido (a recusa não é decisão 
            de uma pessoa). Preenchida só no estado RECUSADO.

      estado:
        type: string
        maxLength: 25
        pattern: \w*\W*
        description: |
            Estado do pedido, na ordem: RASCUNHO, PROCESSANDO, CONCLUIDO, RECUSADO, 
            EXPIRADO, DESCARTADO. As transições estão em CicloCancelamento. A semântica de 
            cada valor está em [e] values.

            Valores permitidos: 
              RASCUNHO
                 Valor: RASCUNHO
                 Texto: Rascunho - Existe SÓ no caminho do assistente de IA: o pedido preparado e ainda não enviado ao gateway, aguardando uma pessoa aprovar (vira PROCESSANDO) ou descartar (vira DESCARTADO). Aprovar e descartar ainda não estão implementados no código. No cancelamento direto pela pessoa o pedido nasce PROCESSANDO.
              PROCESSANDO
                 Valor: PROCESSANDO
                 Texto: Processando - Pedido enviado ao gateway, aguardando a confirmação. Trava a nota: só um pedido por vez. É o padrão (estado em que o cancelamento direto nasce). Termina em CONCLUIDO, RECUSADO ou EXPIRADO.
              CONCLUIDO
                 Valor: CONCLUIDO
                 Texto: Concluído - O cancelamento foi confirmado pelo gateway (código 101 ou 5015, este tratado como sucesso idempotente). Nesse momento a Nota passa a CANCELADA. Estado final.
              RECUSADO
                 Valor: RECUSADO
                 Texto: Recusado - O gateway ou o sistema recusou o pedido (5013, 5001, token recusado e outras recusas); a nota segue AUTORIZADA. O motivo fica em mensagemRetorno. Preenche dataHoraRecusa. A recusa não é decisão de uma pessoa. Estado final.
              EXPIRADO
                 Valor: EXPIRADO
                 Texto: Expirado - O pedido ficou pendente por mais de 24 h sem confirmação do gateway; a nota segue AUTORIZADA e um novo pedido é liberado. O motivo fica em mensagemRetorno. Estado final.
              DESCARTADO
                 Valor: DESCARTADO
                 Texto: Descartado - Rascunho do assistente recusado por uma pessoa; nunca foi enviado ao gateway. Preenche dataHoraDescarte e descartadoPor (ainda não implementado no código). Estado final.
        enum:
          - RASCUNHO
          - PROCESSANDO
          - CONCLUIDO
          - RECUSADO
          - EXPIRADO
          - DESCARTADO
      codigoRetorno:
        type: integer
        minimum: 0
        maximum: 9999
        format: int32
        description: |
            Código de retorno do gateway (101 homologado, 5013, 5015...).

      mensagemRetorno:
        type: string
        maxLength: 500
        pattern: \w*\W*
        description: |
            Mensagem de retorno do gateway. Informativa, não se decide por ela.

      dataHoraEvento:
        type: string
        format: date-time
        description: |
            Data e hora do evento de cancelamento devolvida pelo gateway, formato AAAA-MM-DD 
            HH:MM:SS sem fuso. Nula até o retorno.

      xml:
        type: string
        format: byte
        description: |
            XML do evento de cancelamento, decodificado do Base64, com limite explícito de 2 
            MiB. Documento fiscal, precisa ser retido.

      pdf:
        type: string
        format: byte
        description: |
            PDF do cancelamento, decodificado do Base64, com limite explícito de 2 MiB.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do cancelamento (UUID).

      ambiente:
        type: string
        maxLength: 15
        pattern: \w*\W*
        description: |
            Ambiente do gateway, o mesmo da nota cancelada.

            Valores permitidos: 
              HOMOLOGACAO
                 Valor: HOMOLOGACAO
                 Texto: Homologação - Ambiente de testes do gateway, o mesmo da nota cancelada. É o padrão. Um cancelamento de teste nunca se mistura com um real.
              PRODUCAO
                 Valor: PRODUCAO
                 Texto: Produção - Ambiente real do gateway, o mesmo da nota cancelada.
        enum:
          - HOMOLOGACAO
          - PRODUCAO
      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o pedido foi registrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      empresa:
        description: |
            Empresa dona deste cancelamento e tenant do registro. Todo acesso é filtrado por 
            ela.

        allOf:
          - $ref: '#/definitions/IdReference'
      preparadoPorUsuario:
        description: |
            Pessoa que preparou o pedido. No cancelamento direto é a própria pessoa que 
            cancelou. Regra que o mapa não expressa: preencher este campo OU 
            preparadoPorCliente, no máximo um dos dois, e exatamente um deles na criação.

        allOf:
          - $ref: '#/definitions/IdReference'
      preparadoPorCliente:
        description: |
            Assistente de IA (credencial de máquina, por exemplo o MCP) que preparou o 
            pedido como rascunho. Só existe no caminho do assistente. Regra que o mapa não 
            expressa: preencher este campo OU preparadoPorUsuario, no máximo um dos dois.

        allOf:
          - $ref: '#/definitions/IdReference'
      aprovadoPor:
        description: |
            Pessoa que mandou enviar o cancelamento ao gateway: no cancelamento direto, quem 
            cancelou; no caminho do assistente, quem aprovou o rascunho. Só uma PESSOA, 
            nunca um ClienteAcesso, e só quem pode cancelar na empresa: o administrador, ou 
            o operador com permissão delegada (VinculoUsuario.podeCancelarNfse), em vínculo 
            ativo. Vazio no RASCUNHO e no pedido DESCARTADO.

        allOf:
          - $ref: '#/definitions/IdReference'
      descartadoPor:
        description: |
            Pessoa que descartou o rascunho do assistente (ainda não implementado no 
            código), com a mesma permissão de cancelar exigida para aprovar. Preenchido só 
            no estado DESCARTADO. Substitui recusadoPor: a recusa agora é do gateway ou do 
            sistema, não de uma pessoa.

        allOf:
          - $ref: '#/definitions/IdReference'
      nota:
        description: |
            Nota cancelada, que deve estar autorizada. A chave do pedido é a da nota.

        allOf:
          - $ref: '#/definitions/IdReference'
  cadastros.Contato:
    description: |
            Contato de uma Pessoa, com tipo, nome, WhatsApp e e-mail. Uma pessoa tem vários. 
            Existe só dentro da pessoa e no mesmo contexto, por isso é detalhe da Pessoa 
            ([m]/[o]).
             Os sócios do QSA da consulta de CNPJ entram como contatos do tipo sócio. O 
            e-mail e o telefone principais ficam na própria Pessoa.
             Vive no contexto cadastros (domain.cadastros) e referencia a Empresa 
            (configuracao) como tenant.

    type: object
    required:
      - tipoContato
      - nome
      - id
      - dataCriacao
      - dataAtualizacao
      - pessoa
      - empresa
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 9999999999999
        format: int64
        description: |
            ID para referência interna da API
      version:
        type: string
        format: date-time
        description: |
            Data e hora da versão do registro. Usado principalmente para sincronização e controle de lock otimista.
            Mantido pela API, não deve ser alterado, mas em caso de alterações deve ser copiado o valor recebido.
            Em inclusões deve vir vazio, ao gravar a API irá retornar a primeira versão.
            Em alterações deve vir o mesmo valor que verio no ultimo retorno de consulta do registro, ao gravar o sistema vai gerar um novo valor.
            Somente com o valor certo desse campo, que registros podem ser atualizados.
      tipoContato:
        type: string
        maxLength: 10
        pattern: \w*\W*
        description: |
            Papel do contato perante a pessoa. Os valores são os de [e] values: SOCIO, 
            FINANCEIRO, COMERCIAL, FISCAL e OUTRO. Só SOCIO decorre da história do usuário 
            (sócios do QSA entram como contatos); os demais foram propostos pelo modelador 
            (a confirmar). Obrigatório.

            Valores permitidos: 
              SOCIO
                 Valor: SOCIO
                 Texto: Sócio - Sócio ou administrador da pessoa jurídica, vindo do quadro de sócios e administradores (QSA) da consulta de CNPJ. É o tipo com que os sócios do QSA entram como contatos; o usuário pode ajustá-los antes de salvar.
              FINANCEIRO
                 Valor: FINANCEIRO
                 Texto: Financeiro - Pessoa de contato da área financeira da pessoa cadastrada (cobrança, pagamento, boletos).
              COMERCIAL
                 Valor: COMERCIAL
                 Texto: Comercial - Pessoa de contato da área comercial da pessoa cadastrada (negociação, propostas, relacionamento).
              FISCAL
                 Valor: FISCAL
                 Texto: Fiscal ou contábil - Pessoa de contato fiscal ou contábil (contador ou responsável por impostos e notas) da pessoa cadastrada.
              OUTRO
                 Valor: OUTRO
                 Texto: Outro - Qualquer contato que não se enquadre nos demais tipos.
        enum:
          - SOCIO
          - FINANCEIRO
          - COMERCIAL
          - FISCAL
          - OUTRO
      nome:
        type: string
        maxLength: 300
        pattern: \w*\W*
        description: |
            Nome da pessoa de contato. Acréscimo do modelador, não listado pelo usuário: os 
            sócios do QSA entram como contatos e um contato sem nome não se identifica. 
            Obrigatório.

      whatsapp:
        type: string
        maxLength: 20
        pattern: \w*\W*
        description: |
            Número de WhatsApp do contato, só números. Opcional.

      email:
        type: string
        maxLength: 60
        pattern: \w*\W*
        description: |
            E-mail do contato, até 60 caracteres. Opcional.

      id:
        type: string
        maxLength: 36
        pattern: \w*\W*
        description: |
            Identificador interno do contato (UUID).

      dataCriacao:
        type: string
        format: date-time
        description: |
            Data e hora em que o contato foi cadastrado.

      dataAtualizacao:
        type: string
        format: date-time
        description: |
            Data e hora da última alteração do registro.

      pessoa:
        description: |
            Pessoa a quem o contato pertence. Apagar a pessoa apaga seus contatos.

        allOf:
          - $ref: '#/definitions/IdReference'
      empresa:
        description: |
            Empresa dona deste contato e tenant do registro. Todo acesso é filtrado por ela.

        allOf:
          - $ref: '#/definitions/IdReference'

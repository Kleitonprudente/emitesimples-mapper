# Configuracao. Para COMPILAR nao e necessario nada daqui; para SUBIR a aplicacao sao banco e chaves JWT.

# Prefixo de toda a API REST (os resources geram @Path("/Nota"), "/Municipio" etc. sem prefixo)
quarkus.rest.path=/api

# Banco (decisao do usuario: PostgreSQL). A busca gerada usa unaccent(): a migracao V2 ativa a extensao.
quarkus.datasource.db-kind=postgresql
#quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/emitesimples
#quarkus.datasource.username=
#quarkus.datasource.password=

# Esquema do banco: o FLYWAY e o dono (decisao do usuario). O Hibernate so VALIDA que as entidades batem com o
# banco; nunca cria nem altera tabelas. As migracoes ficam em src/main/resources/db/migration.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.hibernate-orm.schema-management.strategy=validate

# ---------------------------------------------------------------------------------------------------------------
# CORS (front em desenvolvimento). Origens configuraveis por EMITESIMPLES_CORS_ORIGINS (lista separada por virgula).
# ---------------------------------------------------------------------------------------------------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${EMITESIMPLES_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept,X-Requested-With
# Credenciais (cookie do refresh) so para as origens EXPLICITAS acima; nunca use origem "*" com isto.
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.exposed-headers=Retry-After
quarkus.http.cors.access-control-max-age=PT1H

# ---------------------------------------------------------------------------------------------------------------
# JWT emitido pelo proprio back-end (RS256). As chaves PEM ficam em keys/ (fora do git). Em desenvolvimento gere o
# par com scripts/gerar-chaves-dev.sh. NUNCA use o par de desenvolvimento em producao.
# ---------------------------------------------------------------------------------------------------------------
mp.jwt.verify.issuer=emitesimples
%dev,prod.mp.jwt.verify.publickey.location=${EMITESIMPLES_JWT_PUBLIC_KEY:keys/public.pem}
%dev,prod.smallrye.jwt.sign.key.location=${EMITESIMPLES_JWT_PRIVATE_KEY:keys/private.pem}
smallrye.jwt.new-token.issuer=emitesimples
emitesimples.auth.access-token-minutos=15
emitesimples.auth.refresh-token-dias=7
# Cookie do refresh token: Secure ligado por padrao (prod). Em dev/test (http puro) desligado. Nunca desligue em producao.
emitesimples.auth.cookie-secure=${EMITESIMPLES_COOKIE_SECURE:true}
%dev.emitesimples.auth.cookie-secure=false

# Banco de desenvolvimento PERSISTENTE (dev/compose.yaml, porta 5433). Flyway como dono; runtime como role de aplicacao (RLS ativa).
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=${EMITESIMPLES_DEV_DB_URL:jdbc:postgresql://localhost:5433/emitesimples}
%dev.quarkus.datasource.username=emitesimples_app
%dev.quarkus.datasource.password=dev-app
%dev.quarkus.flyway.username=emitesimples
%dev.quarkus.flyway.password=dev-dono
# Administrador de dev (so no perfil dev; fora dele vem das variaveis de ambiente).
%dev.emitesimples.bootstrap.admin.email=${EMITESIMPLES_ADMIN_EMAIL:plataforma@exemplo.com.br}
%dev.emitesimples.bootstrap.admin.senha=${EMITESIMPLES_ADMIN_SENHA:senha1234}
%test.emitesimples.auth.cookie-secure=false

# Administrador inicial da plataforma (so cria se NAO existir nenhum administrador). Nunca registrado em log.
emitesimples.bootstrap.admin.email=${EMITESIMPLES_ADMIN_EMAIL:}
emitesimples.bootstrap.admin.senha=${EMITESIMPLES_ADMIN_SENHA:}

# Ambiente do IntegraNotas: PADRAO homologacao. Nunca apontar para producao por padrao.
#emitesimples.integranotas.ambiente=homologacao

# ---------------------------------------------------------------------------------------------------------------
# POLITICAS DE ACESSO POR CAMINHO. Os papeis de roles-allowed vem da claim "groups" do JWT (papel da empresa na
# sessao e, para o administrador da plataforma, "plataforma_admin"). Nada disto edita o codigo gerado.
#
# Como o Quarkus combina permissoes (provado em src/test, PoliticaAcessoTest): vence a regra de caminho mais ESPECIFICO;
# no mesmo caminho vale a que declara o metodo da requisicao. Se o caminho mais especifico casa mas nenhuma regra dele
# declara o metodo, o Quarkus NAO volta para a regra mais curta (/api/*): cai no padrao-negar. Por isso, para cada
# entidade com regra propria, TODOS os metodos (GET, HEAD, POST, PUT, PATCH, DELETE) tem regra explicita, e a base
# /api/* deixa so a leitura aberta (autenticada) e nega a escrita: endpoint novo nasce fechado.
# ---------------------------------------------------------------------------------------------------------------
quarkus.http.auth.policy.so-plataforma.roles-allowed=plataforma_admin
quarkus.http.auth.policy.admin-ou-operador.roles-allowed=administrador,operador,plataforma_admin

# 0) Rede de seguranca: o que nao casa com nenhuma regra abaixo e NEGADO (falha fechada).
quarkus.http.auth.permission.padrao-negar.paths=/*
quarkus.http.auth.permission.padrao-negar.policy=deny

# 1) PUBLICO. O signup e a confirmacao de e-mail serao publicos depois: acrescentar aqui (POST /api/signup e
#    POST /api/confirmacao) quando existirem.
quarkus.http.auth.permission.publico-auth.paths=/api/auth/login,/api/auth/refresh,/api/auth/logout
quarkus.http.auth.permission.publico-auth.methods=POST
quarkus.http.auth.permission.publico-auth.policy=permit
quarkus.http.auth.permission.publico-infra.paths=/q/health,/q/health/*,/q/openapi,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.publico-infra.methods=GET,HEAD
quarkus.http.auth.permission.publico-infra.policy=permit
# Dev UI so existe em desenvolvimento
%dev.quarkus.http.auth.permission.devui.paths=/q/dev-ui,/q/dev-ui/*,/q/dev,/q/dev/*
%dev.quarkus.http.auth.permission.devui.policy=permit

# 2) BASE de /api/*: leitura exige autenticacao; escrita e NEGADA por padrao (um endpoint novo nasce fechado e so abre
#    com regra explicita abaixo). POST /api/auth/senha e a unica escrita autenticada fora das entidades.
quarkus.http.auth.permission.api-leitura.paths=/api/*
quarkus.http.auth.permission.api-leitura.methods=GET,HEAD
quarkus.http.auth.permission.api-leitura.policy=authenticated
quarkus.http.auth.permission.api-escrita-negar.paths=/api/*
quarkus.http.auth.permission.api-escrita-negar.methods=POST,PUT,PATCH,DELETE
quarkus.http.auth.permission.api-escrita-negar.policy=deny
quarkus.http.auth.permission.auth-senha.paths=/api/auth/senha
quarkus.http.auth.permission.auth-senha.methods=POST
quarkus.http.auth.permission.auth-senha.policy=authenticated

# 2b) CEP: qualquer usuario autenticado consulta (GET); nada de escrita. Limite por usuario e cache no CepService.
quarkus.http.auth.permission.cep-leitura.paths=/api/cep/*
quarkus.http.auth.permission.cep-leitura.methods=GET,HEAD
quarkus.http.auth.permission.cep-leitura.policy=authenticated
quarkus.http.auth.permission.cep-escrita-negar.paths=/api/cep/*
quarkus.http.auth.permission.cep-escrita-negar.methods=POST,PUT,PATCH,DELETE
quarkus.http.auth.permission.cep-escrita-negar.policy=deny

# 2c) /api/admin/*: TUDO so para o administrador da plataforma (importacao de municipios e usuarios/vinculos). Sem DELETE:
#     usuario e vinculo nunca se apagam. Os recursos tambem levam @RolesAllowed("plataforma_admin") como cinto extra.
quarkus.http.auth.permission.admin-plataforma.paths=/api/admin/*
quarkus.http.auth.permission.admin-plataforma.methods=GET,HEAD,POST,PUT,PATCH
quarkus.http.auth.permission.admin-plataforma.policy=so-plataforma
quarkus.http.auth.permission.admin-delete-negar.paths=/api/admin/*
quarkus.http.auth.permission.admin-delete-negar.methods=DELETE
quarkus.http.auth.permission.admin-delete-negar.policy=deny

# 2d) /api/admin/configuracoes/*: configuracoes da plataforma (consulta de CNPJ), so o administrador da plataforma. Todos
#     os metodos explicitos (regra do caminho mais especifico); so GET/PUT existem, o resto e negado.
quarkus.http.auth.permission.admin-configuracoes.paths=/api/admin/configuracoes,/api/admin/configuracoes/*
quarkus.http.auth.permission.admin-configuracoes.methods=GET,HEAD,PUT
quarkus.http.auth.permission.admin-configuracoes.policy=so-plataforma
quarkus.http.auth.permission.admin-configuracoes-negar.paths=/api/admin/configuracoes,/api/admin/configuracoes/*
quarkus.http.auth.permission.admin-configuracoes-negar.methods=POST,PATCH,DELETE
quarkus.http.auth.permission.admin-configuracoes-negar.policy=deny
# Excecao unica: o POST de TESTE da consulta de CNPJ (caminho exato, mais especifico que o /* acima). Nos demais metodos
# desse caminho exato tudo e negado (regra explicita por metodo, ver aviso abaixo).
quarkus.http.auth.permission.admin-configuracoes-testar.paths=/api/admin/configuracoes/consulta-cnpj/testar
quarkus.http.auth.permission.admin-configuracoes-testar.methods=POST
quarkus.http.auth.permission.admin-configuracoes-testar.policy=so-plataforma
quarkus.http.auth.permission.admin-configuracoes-testar-negar.paths=/api/admin/configuracoes/consulta-cnpj/testar
quarkus.http.auth.permission.admin-configuracoes-testar-negar.methods=GET,HEAD,PUT,PATCH,DELETE
quarkus.http.auth.permission.admin-configuracoes-testar-negar.policy=deny

# 2e) Consulta de CNPJ para preencher o cadastro (/api/admin/consulta-cnpj/{cnpj}): so GET, so plataforma. Demais metodos negados.
quarkus.http.auth.permission.admin-consulta-cnpj.paths=/api/admin/consulta-cnpj,/api/admin/consulta-cnpj/*
quarkus.http.auth.permission.admin-consulta-cnpj.methods=GET,HEAD
quarkus.http.auth.permission.admin-consulta-cnpj.policy=so-plataforma
quarkus.http.auth.permission.admin-consulta-cnpj-negar.paths=/api/admin/consulta-cnpj,/api/admin/consulta-cnpj/*
quarkus.http.auth.permission.admin-consulta-cnpj-negar.methods=POST,PUT,PATCH,DELETE
quarkus.http.auth.permission.admin-consulta-cnpj-negar.policy=deny

# 2e-bis) Consulta de CNPJ para usuarios da EMPRESA (/api/consulta-cnpj/{cnpj}): GET/HEAD para administrador, operador e
#     plataforma_admin (`consulta` nao); demais metodos negados. Mesmo limite (30/min por usuario, contador compartilhado).
quarkus.http.auth.permission.consulta-cnpj.paths=/api/consulta-cnpj,/api/consulta-cnpj/*
quarkus.http.auth.permission.consulta-cnpj.methods=GET,HEAD
quarkus.http.auth.permission.consulta-cnpj.policy=admin-ou-operador
quarkus.http.auth.permission.consulta-cnpj-negar.paths=/api/consulta-cnpj,/api/consulta-cnpj/*
quarkus.http.auth.permission.consulta-cnpj-negar.methods=POST,PUT,PATCH,DELETE
quarkus.http.auth.permission.consulta-cnpj-negar.policy=deny

# 2f) Vinculos vistos pela empresa (/api/admin/empresas/{id}/vinculos[/{vinculoId}]): GET, POST, PATCH so plataforma; PUT e DELETE
#     negados (vinculo nunca se apaga). Caminho distinto do /api/Empresa gerado (que continua com as regras proprias).
quarkus.http.auth.permission.admin-empresas.paths=/api/admin/empresas,/api/admin/empresas/*
quarkus.http.auth.permission.admin-empresas.methods=GET,HEAD,POST,PATCH
quarkus.http.auth.permission.admin-empresas.policy=so-plataforma
quarkus.http.auth.permission.admin-empresas-negar.paths=/api/admin/empresas,/api/admin/empresas/*
quarkus.http.auth.permission.admin-empresas-negar.methods=PUT,DELETE
quarkus.http.auth.permission.admin-empresas-negar.policy=deny

# Consulta de CNPJ (CNPJ.ws): timeouts da chamada externa e limite do teste por usuario (cada teste gasta uma consulta do plano).
emitesimples.cnpj.timeout-conexao=5s
emitesimples.cnpj.timeout-resposta=10s
%test.emitesimples.cnpj.timeout-resposta=1s
emitesimples.cnpj.limite-teste-por-minuto=10
emitesimples.cnpj.limite-consulta-por-minuto=30

# Cofre de segredos (SegredoService): chave-mestra AES-256, 32 bytes em base64 (gere com: openssl rand -base64 32).
# Fora de dev/test NAO ha padrao: sem EMITESIMPLES_SEGREDOS_CHAVE a aplicacao sobe, mas guardar/ler segredo falha com erro claro.
# A chave de DEV/TESTE abaixo e publica: nunca use em producao.
emitesimples.segredos.chave=${EMITESIMPLES_SEGREDOS_CHAVE:}
%dev.emitesimples.segredos.chave=${EMITESIMPLES_SEGREDOS_CHAVE:Y2hhdmUtZGUtREVWLW5hby11c2FyLWVtLXByb2QtMyE=}
%test.emitesimples.segredos.chave=Y2hhdmUtZGUtVEVTVEUtc28tcGFyYS10ZXN0ZXMtMzI=

# Consulta de CNPJ (CNPJ.ws): URL local (http://localhost, 127.0.0.1) so em dev/test; em producao e sempre https publico.
emitesimples.cnpj.permitir-url-local=false
%dev.emitesimples.cnpj.permitir-url-local=true
%test.emitesimples.cnpj.permitir-url-local=true

# Teto de qualquer corpo (corta antes de chegar ao codigo). O limite do arquivo de municipios (o do IBGE tem ~300 KB) e
# emitesimples.municipios.max-bytes (2 MB; 413 arquivo_grande_demais).
quarkus.http.limits.max-body-size=6M

# CEP (ViaCEP): URL base, timeout total da chamada, limite por usuario. Os testes apontam a URL para um servidor local.
emitesimples.cep.url-base=${EMITESIMPLES_CEP_URL_BASE:https://viacep.com.br/ws}
emitesimples.cep.timeout-ms=3000
emitesimples.cep.limite-por-minuto=30
%test.emitesimples.cep.timeout-ms=1000

# ATENCAO (provado em PoliticaAcessoTest): quando um caminho mais especifico casa mas NENHUMA regra dele declara o metodo
# da requisicao, o Quarkus NAO volta para a regra mais curta (/api/*): cai no padrao-negar. Por isso, para cada entidade
# listada abaixo TODOS os metodos (GET, HEAD, POST, PUT, PATCH, DELETE) tem regra explicita.

# 3) Leitura das entidades (autenticado; o filtro por empresa e do codigo gerado). Usuario fica de fora (regra 6).
quarkus.http.auth.permission.entidades-leitura.paths=/api/Empresa,/api/Empresa/*,/api/AtividadeEmpresa,/api/AtividadeEmpresa/*,/api/QsaEmpresa,/api/QsaEmpresa/*,/api/Municipio,/api/Municipio/*,/api/ImportacaoMunicipio,/api/ImportacaoMunicipio/*,/api/Pessoa,/api/Pessoa/*,/api/Contato,/api/Contato/*,/api/Servico,/api/Servico/*,/api/VinculoUsuario,/api/VinculoUsuario/*,/api/ClienteAcesso,/api/ClienteAcesso/*,/api/Nota,/api/Nota/*,/api/Cancelamento,/api/Cancelamento/*,/api/ChamadaGateway,/api/ChamadaGateway/*,/api/EventoWebhook,/api/EventoWebhook/*,/api/Plano,/api/Plano/*,/api/AssinaturaEmpresa,/api/AssinaturaEmpresa/*,/api/FaturaCrm,/api/FaturaCrm/*,/api/HistoricoSituacaoEmpresa,/api/HistoricoSituacaoEmpresa/*
quarkus.http.auth.permission.entidades-leitura.methods=GET,HEAD
quarkus.http.auth.permission.entidades-leitura.policy=authenticated

# 4) Entidades de FLUXO do sistema: escrita direta proibida para todos (so servicos escrevem).
quarkus.http.auth.permission.fluxo-negar.paths=/api/Nota,/api/Nota/*,/api/Cancelamento,/api/Cancelamento/*,/api/ChamadaGateway,/api/ChamadaGateway/*,/api/EventoWebhook,/api/EventoWebhook/*,/api/FaturaCrm,/api/FaturaCrm/*,/api/HistoricoSituacaoEmpresa,/api/HistoricoSituacaoEmpresa/*,/api/ImportacaoMunicipio,/api/ImportacaoMunicipio/*
quarkus.http.auth.permission.fluxo-negar.methods=POST,PUT,PATCH,DELETE
quarkus.http.auth.permission.fluxo-negar.policy=deny

# 5) VinculoUsuario e ClienteAcesso: escrita negada (endpoints a mao depois: mexem em papeis e segredos).
quarkus.http.auth.permission.acesso-negar.paths=/api/VinculoUsuario,/api/VinculoUsuario/*,/api/ClienteAcesso,/api/ClienteAcesso/*
quarkus.http.auth.permission.acesso-negar.methods=POST,PUT,PATCH,DELETE
quarkus.http.auth.permission.acesso-negar.policy=deny

# 6) Usuario e global (sem filtro de empresa): TODOS os metodos so para o administrador da plataforma; DELETE negado.
quarkus.http.auth.permission.usuario-plataforma.paths=/api/Usuario,/api/Usuario/*
quarkus.http.auth.permission.usuario-plataforma.methods=GET,HEAD,POST,PUT,PATCH
quarkus.http.auth.permission.usuario-plataforma.policy=so-plataforma
quarkus.http.auth.permission.usuario-delete-negar.paths=/api/Usuario,/api/Usuario/*
quarkus.http.auth.permission.usuario-delete-negar.methods=DELETE
quarkus.http.auth.permission.usuario-delete-negar.policy=deny

# 7) Escrita so do administrador da plataforma (empresa, catalogos); DELETE negado (a empresa so se desativa).
quarkus.http.auth.permission.escrita-plataforma.paths=/api/Municipio,/api/Municipio/*,/api/Plano,/api/Plano/*,/api/AssinaturaEmpresa,/api/AssinaturaEmpresa/*,/api/Empresa,/api/Empresa/*,/api/AtividadeEmpresa,/api/AtividadeEmpresa/*,/api/QsaEmpresa,/api/QsaEmpresa/*
quarkus.http.auth.permission.escrita-plataforma.methods=POST,PUT,PATCH
quarkus.http.auth.permission.escrita-plataforma.policy=so-plataforma

# 8) Escrita do dia a dia: administrador ou operador da empresa (e administrador da plataforma). `consulta` so le.
quarkus.http.auth.permission.escrita-cadastros.paths=/api/Pessoa,/api/Pessoa/*,/api/Servico,/api/Servico/*
quarkus.http.auth.permission.escrita-cadastros.methods=POST,PUT,PATCH
quarkus.http.auth.permission.escrita-cadastros.policy=admin-ou-operador

# 9) DELETE: negado em tudo. Contato: escrita (POST/PUT/PATCH/DELETE) negada a todos; so se gerencia pela Pessoa (PUT /api/Pessoa/{id}/contatos).
quarkus.http.auth.permission.delete-negar.paths=/api/Municipio,/api/Municipio/*,/api/Plano,/api/Plano/*,/api/AssinaturaEmpresa,/api/AssinaturaEmpresa/*,/api/Empresa,/api/Empresa/*,/api/AtividadeEmpresa,/api/AtividadeEmpresa/*,/api/QsaEmpresa,/api/QsaEmpresa/*,/api/Pessoa,/api/Pessoa/*,/api/Servico,/api/Servico/*,/api/Contato,/api/Contato/*
quarkus.http.auth.permission.delete-negar.methods=DELETE
quarkus.http.auth.permission.delete-negar.policy=deny
# Contato: DELETE acima (delete-negar) e POST/PUT/PATCH aqui; GET segue em entidades-leitura.
quarkus.http.auth.permission.contato-negar.paths=/api/Contato,/api/Contato/*
quarkus.http.auth.permission.contato-negar.methods=POST,PUT,PATCH
quarkus.http.auth.permission.contato-negar.policy=deny

# ---------------------------------------------------------------------------------------------------------------
# OpenAPI em tempo de execucao (GET /q/openapi). A Swagger UI so entra em dev e test (padrao do Quarkus).
# ---------------------------------------------------------------------------------------------------------------
mp.openapi.extensions.smallrye.info.title=Emite Simples API
mp.openapi.extensions.smallrye.info.version=0.1.0
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.security-scheme-description=JWT de acesso obtido em POST /api/auth/login (cabecalho Authorization: Bearer ...)
quarkus.smallrye-openapi.auto-add-security-requirement=true

# ---------------------------------------------------------------------------------------------------------------
# Testes: Dev Services sobe o PostgreSQL com a imagem LOCAL (nenhuma imagem e baixada). As chaves JWT dos testes sao
# geradas em memoria (ChavesJwtTestResource).
# ---------------------------------------------------------------------------------------------------------------
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.emitesimples.bootstrap.admin.email=
%test.emitesimples.bootstrap.admin.senha=

# ---------------------------------------------------------------------------------------------------------------
# RLS (migracao V3) e PAPEIS DO BANCO: dois usuarios distintos.
#  - Flyway migra com o DONO das tabelas:        QUARKUS_FLYWAY_USERNAME / QUARKUS_FLYWAY_PASSWORD
#  - A aplicacao roda como role COMUM (nao dono, nao superusuario): QUARKUS_DATASOURCE_USERNAME / ..._PASSWORD
#    (criado por scripts/db/criar-role-app.sql). Superusuario e BYPASSRLS ignoram a RLS: nunca use um deles em runtime.
# O escopo de tenant e aplicado em toda conexao do pool por tenant/RlsPoolInterceptor.
# ---------------------------------------------------------------------------------------------------------------
# (sem quarkus.flyway.username aqui: em prod o Flyway recebe o dono por QUARKUS_FLYWAY_USERNAME/PASSWORD)

# Testes: Dev Services cria o container com um dono (superusuario do container) e o init script cria o role comum;
# o runtime conecta com o role comum e o Flyway com o dono. Valores abaixo existem so no container efemero.
%test.quarkus.datasource.devservices.username=dono_teste
%test.quarkus.datasource.devservices.password=dono-teste-efemero
%test.quarkus.datasource.devservices.init-script-path=db/init-role-app-teste.sql
%test.quarkus.flyway.username=dono_teste
%test.quarkus.flyway.password=dono-teste-efemero
%test.quarkus.datasource.username=emitesimples_app
%test.quarkus.datasource.password=app-teste-efemero
